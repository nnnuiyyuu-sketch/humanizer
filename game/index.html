/* места по субъектам — метод наибольших остатков */
function apportion(){
  const tot=REGIONS.reduce((a,r)=>a+r.pop,0), q={}, rem=[];
  let used=0;
  REGIONS.forEach(r=>{ const ex=r.pop/tot*SEATS, n=Math.max(2,Math.floor(ex)); q[r.id]=n; used+=n;
    rem.push([r.id,ex-Math.floor(ex)]); });
  rem.sort((a,b)=>b[1]-a[1]);
  for(let i=0;used<SEATS;i++,used++) q[rem[i%rem.length][0]]++;
  S.regSeats=q;
}

/* доли голосов из «привлекательности»: мягкий степенной перевод,
   иначе мелкие фракции вымирают за один цикл */
function shareFrom(score){
  const out={},k=Object.keys(score);let sum=0;
  k.forEach(x=>{ out[x]=Math.pow(Math.max(score[x]-24,0.6),1.35); sum+=out[x]; });
  k.forEach(x=>out[x]=out[x]/sum*100);
  return out;
}

/* Мандаты распределяются по действующему избирательному закону,
   а не по вшитой формуле: имя оставлено прежним, чтобы все места
   подсчёта — Собрание, Сенат, губернаторы — сменили правило разом. */
function dhondt(shares,n){ return allocate(shares,n); }

/* В двух палатах 535 человек: имена держим в наборе, иначе поиск
   двойника по списку становится дороже самой генерации созыва. */
let nameBook=null;
function nameReset(){
  nameBook=new Set();
  (S.deputies||[]).forEach(d=>nameBook.add(d.name));
  (S.senate||[]).forEach(d=>nameBook.add(d.name));
}
function depName(){
  if(!nameBook)nameReset();
  for(let i=0;i<60;i++){
    const f=Math.random()<0.34;
    const n=f?pick(NAME_F)+' '+pick(SURN_F):pick(NAME_M)+' '+pick(SURN_M);
    if(!nameBook.has(n)){ nameBook.add(n); return n; }
  }
  const n=pick(NAME_M)+' '+pick(SURN_M)+'-'+pick(SURN_M);   // на самый крайний случай
  nameBook.add(n); return n;
}
function makeDep(party,region,i){
  const p=P(party), st={};
  AX.forEach(k=>st[k]=clamp(r1((p.st[k]||0)+rnd(-0.7,0.7)),-2,2));
  return {id:party+'-'+region+'-'+i, name:depName(), party, region, st,
    loyal:ri(46,93), integ:ri(18,92), rel:clamp(Math.round(60-axDist(st,me().st)*11+rnd(-8,8)),8,92),
    deals:0, note:''};
}

/* идеологическая привлекательность партии в субъекте — общая основа
   и для первого созыва, и для довыборов в Сенат */
function seedShare(r,bonus){
  const sh={};
  S.parties.forEach(p=>{
    let v=0; GROUPS.forEach(g=>v+=r.share[g.id]*fitOf(g,p.st));
    if(p.id===PL)v*=(bonus||1);
    sh[p.id]=v;
  });
  return shareFrom(sh);
}
/* первый созыв: голоса считаются по чистой идеологии */
function seedParliament(){
  S.deputies=[]; nameReset();
  const tot={}; S.parties.forEach(p=>tot[p.id]=0);
  REGIONS.forEach(r=>{
    const seats=dhondt(seedShare(r,1.10),S.regSeats[r.id]);   // премия действующей власти
    Object.entries(seats).forEach(([pid,n])=>{
      tot[pid]+=n;
      for(let i=0;i<n;i++)S.deputies.push(makeDep(pid,r.id,i));
    });
  });
  S.seats=tot;
}
function seatsOf(id){ return S.seats[id]||0; }
function coalSeats(){ return coalition().reduce((a,id)=>a+seatsOf(id),0); }

/* ─── Сенат ──────────────────────────────────────────────────────
   Сто мест по населению субъектов. Сенатор сидит дольше депутата,
   меньше слушает фракцию и больше — свой субъект: переизбирают его
   не вместе со всеми, а своим классом раз в два года. */
function makeSen(party,region,cls,i){
  const p=P(party), st={};
  AX.forEach(k=>st[k]=clamp(r1((p.st[k]||0)+rnd(-0.95,0.95)),-2,2));
  return {id:'s-'+party+'-'+region+'-'+i+'-'+cls, name:depName(), party, region, cls, st,
    loyal:ri(34,80), integ:ri(24,95), rel:clamp(Math.round(60-axDist(st,me().st)*10+rnd(-9,9)),8,92),
    since:S.q, terms:1, deals:0, note:''};
}
function seedSenate(){
  S.senate=[];
  const tot={}; S.parties.forEach(p=>tot[p.id]=0);
  REGIONS.forEach(r=>{
    const seats=dhondt(seedShare(r,1.04),r.sen);
    let k=0;
    Object.entries(seats).forEach(([pid,n])=>{
      tot[pid]+=n;
      for(let i=0;i<n;i++,k++){
        const s=makeSen(pid,r.id,k%3,i);
        s.terms=ri(1,4);                       // палата не начинается с чистого листа
        s.since=S.q-(s.terms-1)*SEN_CYCLE;
        S.senate.push(s);
      }
    });
  });
  S.senSeats=tot; S.senCls=0;
  S.senRules={cloture:CLOTURE, nuked:false, nukedBy:null, nukedQ:0};
  seatSenLeader(true);
}
function senSeatsOf(id){ return S.senSeats[id]||0; }
function senCoalSeats(){ return coalition().reduce((a,id)=>a+senSeatsOf(id),0); }
function senDue(){ return S.q>1 && (S.q-1)%SEN_CYCLE===0; }

/* ─── регламент палаты ───────────────────────────────────────────
   Порог клотура — не константа, а состояние: его можно опустить,
   но опущенный он остаётся опущенным и для тех, кто придёт после. */
function cloture(){ return (S.senRules&&S.senRules.cloture)||CLOTURE; }
function nuked(){ return !!(S.senRules&&S.senRules.nuked); }
/* регламент меняют простым большинством — но для этого нужны и палата,
   и председатель: без своего вице поправку к регламенту не поставят */
function canNuke(){ return senCoalSeats()>=NUKE_MIN && isVP() && !nuked(); }

/* ─── старшинство ────────────────────────────────────────────────
   В палате, где треть меняется раз в два года, стаж — валюта.
   Старейшина тянет за собой земляков и первым получает комитет. */
function senRank(s){ return s.terms||1; }
function senElder(s){ return senRank(s)>=4; }
/* земляки прислушиваются к старейшине своей делегации */
function senDean(region){
  const here=S.senate.filter(s=>s.region===region);
  if(!here.length)return null;
  return here.slice().sort((a,b)=>senRank(b)-senRank(a)||a.id.localeCompare(b.id))[0];
}

/* ─── лидер сенатского большинства ───────────────────────────────
   Председательствует вице-президент, но повестку ведёт лидер
   крупнейшей фракции. Чужой лидер не отклоняет закон — он просто
   не ставит его в календарь, и это дороже отклонения. */
function senLeadParty(){
  let best=null,bv=-1;
  S.parties.forEach(p=>{ const n=senSeatsOf(p.id); if(n>bv){bv=n;best=p.id;} });
  return best;
}
function senLead(){ return S.senLead; }
function senLeadPerson(){
  if(!S.senLead)return null;
  return S.senate.find(s=>s.id===S.senLead.id)||null;
}
function isSenLead(){ return !!(S.senLead&&S.senLead.party===PL); }
function senFriendlyLead(){ return !!(S.senLead&&(S.senLead.party===PL||inCoal(S.senLead.party))); }
/* лидером становится самый заслуженный сенатор крупнейшей фракции */
function seatSenLeader(quiet){
  const pid=senLeadParty();
  const pool=S.senate.filter(s=>s.party===pid);
  if(!pool.length){ S.senLead=null; return; }
  const who=pool.slice().sort((a,b)=>
    (senRank(b)*10+b.loyal*0.2)-(senRank(a)*10+a.loyal*0.2)||a.id.localeCompare(b.id))[0];
  const was=S.senLead;
  if(was&&was.id===who.id&&was.party===pid)return;
  S.senLead={id:who.id, name:who.name, party:pid, since:S.q, deals:0, favour:0};
  if(!quiet){
    logMsg('Лидером сенатского большинства стал '+who.name+' («'+P(pid).name+'»).',1);
    chron('Сенат возглавил '+who.name+'.',pid===PL?'g':'');
  }
}
/* насколько лидер расположен вести ваш проект: фракция плюс личные услуги */
function leadFavour(){
  if(!S.senLead)return 60;
  const base=S.senLead.party===PL?92:inCoal(S.senLead.party)?74:26;
  return clamp(Math.round(base+(S.senLead.favour||0)),0,100);
}

/* Сенатор голосует иначе, чем депутат: фракция весит вдвое меньше,
   зато интерес субъекта и личное отношение — вдвое больше. */
function senSupport(sen,bill){
  const t=T(bill.topic), ax=t.ax;
  let v=(0.95-Math.abs(sen.st[ax]-bill.stance))*24;
  // фракция весит меньше, чем в Собрании, но не настолько, чтобы палата
  // стала непроходимой: разницу добирают коалиционная дисциплина и округ
  v+=leaderLine(sen.party,bill)*sen.loyal*0.27;
  v+=(sen.rel-50)*0.34;
  if(bill.riders&&bill.riders.indexOf('money')>=0) v+= sen.region===bill.regTarget?22:-3.5;
  if(inCoal(sen.party))v+=11;
  // палата субъектов: всё, что бьёт по регионам, здесь встречают жёстче
  if(t.ax==='reg') v+=bill.stance*(R(sen.region).dev<3?5:-3);
  if(t.local&&bill.stance>0&&R(sen.region).capital)v-=7;
  const mine=(bill.by||PL)===PL;
  if(mine&&!inCoal(sen.party))v-=7;
  if(!mine&&sen.party===PL)v-=7;
  if(mine&&hasTrait('jurist'))v+=4;
  // старейшина делегации задаёт тон землякам: в палате субъектов
  // возражение человека, сидящего здесь двадцать лет, весит отдельно
  const dean=senDean(sen.region);
  if(dean&&dean.id!==sen.id){
    const dv=(0.95-Math.abs(dean.st[ax]-bill.stance))*24+(dean.rel-50)*0.3;
    v+=clamp(dv,-24,24)*0.14*Math.min(senRank(dean),5)/5;
  }
  // председатель, занятый палатой, подтягивает своих
  if(S.vp&&S.vp.job==='senate'&&(sen.party===S.vp.party||inCoal(sen.party)))
    v+=vpSkill()*0.06;
  v+=noise(sen.id+'|'+bill.topic+bill.stance+(bill.riders||[]).join('')+S.billNo,9);
  return v;
}
function senTally(bill){
  const t={yes:0,no:0,und:0,list:[]};
  S.senate.forEach(d=>{ const v=senSupport(d,bill), st=v>10?'yes':v<-10?'no':'und';
    t[st]++; t.list.push({d,v,st}); });
  return t;
}
/* Сколько голосов реально ляжет за проект: колеблющиеся падают
   в ту сторону, куда их клонит, а обещанное на прениях учитывается. */
function senCount(bill,tl){
  const t=tl||senTally(bill); let yes=0,no=0;
  t.list.forEach(x=>{
    const pl=(x.d.spledge&&x.d.spledgeNo===bill.id)?x.d.spledge:0;
    const v=x.v+pl;
    if(v>10)yes++; else if(v<-10)no++;
    else (Math.random()<0.5+v/30?yes++:no++);
  });
  return {yes,no};
}
/* Обструкция: считается не большинство, а те, кто готов её прекратить.
   Меньшинство, у которого больше сорока твёрдых «против», держит
   трибуну до тех пор, пока за клотур не наберётся шестьдесят. */
function clotureCount(bill,tl){
  const t=tl||senTally(bill); let n=0;
  const by=bill.by||PL;
  t.list.forEach(x=>{
    const pl=(x.d.spledge&&x.d.spledgeNo===bill.id)?x.d.spledge:0;
    // На процедуре фракция весит вдвое больше, чем на существе: вопрос
    // «дать ли им победу» проще вопроса «хорош ли закон», и партийная
    // линия держится здесь крепче всего.
    const own=x.d.party===by||inCoal(x.d.party);
    let v=x.v*0.65+pl+(own?24:-18)+(x.d.rel-50)*0.2;
    if(senRank(x.d)>=4)v+=6;                       // старейшины берегут обычаи палаты
    if(S.vp&&S.vp.job==='senate'&&own)v+=vpSkill()*0.05;
    if(v>0)n++;
  });
  return n;
}
function willFilibuster(bill,tl){
  if(cloture()<=SEN_MAJ)return false;              // регламент уже опущен
  const n=clotureCount(bill,tl);
  return n<cloture();
}
/* Медиана палаты по оси проекта — то, на чём согласительная комиссия
   сойдётся, если её созвать. */
function senMedian(ax){
  if(!S.senate.length)return 0;
  const v=S.senate.map(s=>s.st[ax]||0).sort((a,b)=>a-b);
  const m=v.length%2?v[(v.length-1)/2]:(v[v.length/2-1]+v[v.length/2])/2;
  return r1(m);
}
function resolveSenVote(bill){
  const t=senTally(bill);
  let {yes,no}=senCount(bill,t);
  // сто мест — значит равенство возможно, и его разбивает председатель палаты
  let tie=0, talked=0;
  if(VP_TIE&&S.vp){
    const m=vpMargin(), gap=no-yes;
    // председатель с именем в палате разворачивает не только равенство,
    // но и счёт, проигранный на голос-другой, — уговором в кулуарах
    if(gap>0&&gap<=m&&vpBreak(bill)>0){ talked=gap; yes+=gap; no-=gap; }
    if(yes===no){ tie=vpBreak(bill); if(tie>0)yes++; else no++; S.vp.ties=(S.vp.ties||0)+1; }
  }
  return {yes,no,pass:yes>=SEN_MAJ,tie,talked,cl:clotureCount(bill,t),need:cloture()};
}

/* ─── главы субъектов ────────────────────────────────────────────
   Одиннадцать своих правителей со своими сроками. Компетентный и
   лояльный гасит напряжённость и тянет за собой округ на выборах;
   враждебный делает ровно обратное, и снять его можно не всегда. */
function makeGov(rid,party){
  const p=P(party);
  const or0=origin();
  let rel=Math.round(58-axDist(p.st,me().st)*11+rnd(-9,9));
  if(or0&&or0.id==='province')rel+=6;
  if(hasTrait('zemsky'))rel+=7;
  return {region:rid, party, name:depName(), comp:ri(28,88),
    rel:clamp(rel,6,94), since:S.q, till:S.q+ri(3,GOV_TERM), deals:0,
    appointed:!govElected()};        // как край достался: назначением или выбором
}
/* жребий по долям: сильная партия чаще берёт край, но не всегда —
   иначе все одиннадцать глав оказались бы вашими с первого квартала */
function drawByShare(sh){
  const k=Object.keys(sh);
  let sum=k.reduce((a,x)=>a+Math.max(0,sh[x]),0), t=Math.random()*sum;
  for(const x of k){ t-=Math.max(0,sh[x]); if(t<=0)return x; }
  return k[0];
}
function seedGovernors(){
  S.govs={};
  REGIONS.forEach(r=>{ S.govs[r.id]=makeGov(r.id,drawByShare(seedShare(r,1.0))); });
}
function govCoalCount(){ return REGIONS.filter(r=>{const g=govOf(r.id); return g&&(g.party===PL||inCoal(g.party));}).length; }

/* ─── посев печати, суда и соседей ───────────────────────────── */
function seedPress(){
  S.press={o:{},heads:[]};
  PRESS.forEach(o=>{
    S.press.o[o.id]={id:o.id, rel:clamp(Math.round(56-axDist(o.st,me().st)*12+rnd(-8,8)),8,92),
      hits:0, banned:false};
  });
}
function makeJudge(by,q){
  const p=P(by)||me(), st={};
  AX.forEach(k=>st[k]=clamp(r1((p.st[k]||0)*0.7+rnd(-0.7,0.7)),-2,2));
  return {id:'j'+q+'-'+by+'-'+Math.round(Math.random()*1e6).toString(36),
    name:depName(), by, st, since:q, until:q+JUDGE_LIFE};
}
function seedCourt(){
  S.court=[];
  // суд собирался десятилетиями: судьи разных лет и разных назначателей
  const pool=S.parties.map(p=>p.id);
  for(let i=0;i<COURT_SIZE;i++){
    const by=pick(pool), age=ri(2,JUDGE_LIFE-6);
    const j=makeJudge(by,S.q-age); j.until=S.q-age+JUDGE_LIFE;
    S.court.push(j);
  }
}
function seedNeighbours(){
  S.nb={};
  NEIGHBOURS.forEach(x=>{
    S.nb[x.id]={id:x.id, rel:clamp(Math.round(54-axDist(x.st,me().st)*11+rnd(-7,7)),10,90),
      treaty:false, since:S.q};
  });
}

/* ─── карьера ────────────────────────────────────────────────────
   Летопись пишет историю страны, карьера — историю человека. */
function career(t){
  if(!S.you)return;
  S.you.career.push({q:S.q, y:2029+Math.floor((S.q-1)/4), t});
  if(S.you.career.length>140)S.you.career.shift();
}

/* ─── президент ──────────────────────────────────────────────────
   На старте кресло занимает лидер ближайшей к вам партии: это он
   поручил вам собрать правительство. Его срок истекает раньше, чем
   ваш созыв, — первые президентские выборы придутся на середину. */
function seedPresident(){
  const near=S.parties.filter(p=>p.id!==PL).sort((a,b)=>axDist(a.st,me().st)-axDist(b.st,me().st))[0];
  S.pres={party:near.id, name:near.leader, since:S.q-11, until:S.q+12, term:1, vetoes:0, decrees:0};
  S.presRel=clamp(Math.round(72-axDist(near.st,me().st)*11),25,88);
  seatVP(near.id);
}
/* вице-президент всегда из партии президента: они шли одним списком.
   Кем именно он окажется — решает жребий, если список не ваш; ваш
   список вы составляете сами, и тогда сюда приходит готовый напарник. */
function makeVP(party,kind,region){
  const k=VP_KIND.find(x=>x.id===kind)||pick(VP_KIND);
  const r=region||pick(REGIONS).id;
  return {party, name:depName(), kind:k.id, region:r,
    sen:ri(k.sen[0],k.sen[1]), pop:ri(k.pop[0],k.pop[1]), amb:ri(k.amb[0],k.amb[1]),
    job:'none', since:S.q, ties:0, jobQ:S.q, dropped:0, restless:0};
}
function seatVP(party,name,who){
  if(who){ S.vp={...who, party, since:S.q, ties:0, jobQ:S.q}; return; }
  const v=makeVP(party);
  if(name)v.name=name;
  S.vp=v;
}

/* ─── кабинет ────────────────────────────────────────────────────
   Премьер и министры заводятся людьми: у портфеля есть не только
   партия, но и фамилия, компетентность и срок в должности. */
function makeMinister(post,party){
  return {post, party, name:depName(), comp:ri(30,86), since:S.q};
}
function seedCabinet(){
  S.pm={party:S.gov.lead, name:S.gov.lead===PL?S.you.name:P(S.gov.lead).leader, since:S.q, reshuffles:0};
  S.ministers={};
  POSTS.forEach(p=>{ S.ministers[p.id]=makeMinister(p.id,S.gov.posts[p.id]||S.gov.lead); });
}
/* портфель сменил партию — значит сменился и человек */
function syncCabinet(){
  if(!S.ministers)S.ministers={};
  POSTS.forEach(p=>{
    const want=S.gov.posts[p.id]||S.gov.lead, cur=S.ministers[p.id];
    if(!cur||cur.party!==want)S.ministers[p.id]=makeMinister(p.id,want);
  });
  if(!S.pm||S.pm.party!==S.gov.lead)
    S.pm={party:S.gov.lead, name:S.gov.lead===PL?S.you.name:P(S.gov.lead).leader, since:S.q, reshuffles:0};
}
/* вероятность вето: расхождение по теме плюс испорченные отношения */
function vetoChance(bill){
  if(isPres())return 0;                                   // свой президент подписывает не глядя
  const p=presParty(); if(!p)return 0;
  const d=Math.abs((p.st[T(bill.topic).ax]||0)-bill.stance);
  let c=(d-1.3)*0.30+(58-S.presRel)*0.006;
  if(hasTrait('diplo'))c-=0.10;                    // с ним просто договариваются
  if(inCoal(p.id))c-=0.12;                                // президент в коалиции воюет реже, но не никогда
  if((bill.by||PL)!==PL&&!inCoal(bill.by||PL))c+=0.06;    // чужой закон завернуть проще
  return clamp(c,0,0.85);
}
function vetoWord(c){ return c<0.12?'подпишет':c<0.35?'скорее подпишет':c<0.6?'может завернуть':'почти наверняка вето'; }

/* ─── указы ──────────────────────────────────────────────────────
   Указ живёт вполсилы и всего несколько кварталов, зато не спрашивает
   ни Собрания, ни Сената. Цена — недовольство тех, кто следит за
   процедурой. */
function activeDecrees(){ return S.laws.filter(l=>l.decree); }
function decreeTick(){
  const gone=S.laws.filter(l=>l.decree&&l.until<=S.q);
  if(gone.length){
    S.laws=S.laws.filter(l=>!(l.decree&&l.until<=S.q));
    gone.forEach(l=>logMsg('Срок указа «'+l.name+'» истёк: он больше не действует.'));
  }
  const n=activeDecrees().length;
  if(n){ shiftMood('intel',-0.55*n); shiftMood('urban',-0.32*n); shiftMood('patr',0.2*n); }
}

/* ─── формирование правительства ─────────────────────────────── */
function partyPrice(id){                     // сколько портфелей просит партия
  const s=seatsOf(id);
  return s>=30?3:s>=20?2:s>=10?2:1;
}
function formCoalition(initial){
  if(initial){
    // старт: игрок — первая партия, берёт в союзники ближайшую подходящую
    const order=S.parties.filter(p=>p.id!==PL).sort((a,b)=>axDist(a.st,me().st)-axDist(b.st,me().st));
    S.gov={lead:PL,coal:[PL],posts:{}};
    POSTS.forEach(p=>S.gov.posts[p.id]=PL);
    let tail=POSTS.length-1;                 // портфели союзникам раздаются с конца списка
    for(const p of order){
      if(coalSeats()>=MAJ)break;
      if(axDist(p.st,me().st)<1.9){
        S.gov.coal.push(p.id);
        for(let i=0;i<partyPrice(p.id)&&tail>0;i++,tail--)S.gov.posts[POSTS[tail].id]=p.id;
        S.partners[p.id]={patience:3,anger:0};
      }
    }
  }
}

/* ─── экономика ──────────────────────────────────────────────── */
function taxLoad(){ return (S.tax.inc+S.tax.corp+S.tax.vat)/3; }
function resIncome(){ return r1(((S.world?S.world.res:100)-100)*0.11*S.econ.gdp/100); }
function revenue(){
  const g=S.econ.gdp/100;
  let v=TAXES.reduce((a,t)=>a+t.yield*(S.tax[t.id]/2),0)*g+resIncome();
  if(S.gov.posts.fin===PL||inCoal(S.gov.posts.fin))v*=1.06;
  v*=1+minPower('fin');                       // министр финансов, а не только его фракция
  v*=clamp(1-avgUnrest()*0.004,0.7,1);
  return r1(v);
}
function outlay(){
  const g=0.55+S.econ.gdp/100*0.45;
  return r1(SPEND.reduce((a,s)=>a+s.base*(S.spend[s.id]/2),0)*g);
}
function interest(){ return r1(S.debt*0.016); }
function balance(){ return r1(revenue()-outlay()-interest()+lawSum('money')); }
function avgUnrest(){ let s=0,t=0; REGIONS.forEach(r=>{s+=S.unrest[r.id]*r.pop;t+=r.pop;}); return s/t; }
function lawSum(key){ return S.laws.reduce((a,l)=>a+(l.sum[key]||0),0); }

function cycleImpulse(){ return Math.sin((S.cyc?S.cyc.ph:0)*Math.PI*2)*2.0; }
function cyclePhase(){
  const v=cycleImpulse();
  return v>0.7?'подъём':v>0.2?'оживление':v>-0.2?'ровно':v>-0.7?'охлаждение':'спад';
}
function econTick(){
  const e=S.econ, W=S.world;
  // хозяйственный цикл идёт сам по себе, что бы вы ни делали
  S.cyc.ph+=1/S.cyc.len; if(S.cyc.ph>1){S.cyc.ph-=1;S.cyc.len=ri(13,19);}
  const tgt=100+nbTrade()*0.55;                 // отношения с соседями — это торговля
  W.demand=clamp(W.demand+(tgt-W.demand)*0.07+rnd(-5.5,5.5),55,142);
  W.res=clamp(W.res+(100-W.res)*0.05+rnd(-9,9),45,168);
  const cyc=cycleImpulse();
  const invT = 100 + (W.demand-100)*0.16 + cyc*7 + (2-S.tax.corp)*9 + (2-S.tax.inc)*3 + (S.stab-55)*0.45
             + lawSum('invest') + S.spend.inf*3 - e.inf*1.6 - avgUnrest()*0.35;
  e.invest = clamp(e.invest+(invT-e.invest)*(hasTrait('econom')?0.38:0.3)+rnd(-2,2),25,190);
  const gT = 0.5 + cyc + (W.demand-100)*0.014 + (e.invest-100)*0.016 - (S.tax.corp-2)*0.16 + S.spend.inf*0.14 + S.spend.edu*0.05
           + lawSum('growth') - Math.max(0,e.inf-6)*0.12 - avgUnrest()*0.018
           - (e.gdp/100-1)*0.55;               // догоняющий рост выдыхается
  e.growth = r2(clamp(e.growth+(gT-e.growth)*0.4+rnd(-0.2,0.2),-6,7));
  e.gdp = r1(Math.max(45,e.gdp*(1+e.growth/100)));
  const uT = 8.4 - e.growth*1.05 - S.spend.inf*0.35 - S.spend.edu*0.1 + (S.tax.inc-2)*0.22 + lawSum('unemp')*4
           + (S.rec>1?1.4:0);                  // затяжной спад ломает рынок труда
  e.unemp = r1(clamp(e.unemp+(uT-e.unemp)*0.3+rnd(-0.2,0.2),2.5,26));
  const bal=balance(), defc=Math.max(0,-bal);
  const iT = 2.6 + Math.max(0,cyc)*0.55 + defc*0.10 + (S.tax.vat-2)*0.45 + (W.res-100)*0.022 + Math.max(0,(e.invest-130))*0.025
           + Math.max(0,e.growth-2)*0.55 + lawSum('inf') - (S.tax.corp-2)*0.05;
  e.inf = r1(clamp(e.inf+(iT-e.inf)*0.34+rnd(-0.25,0.25),0,32));
  S.treasury = r1(S.treasury+bal);
  if(S.treasury<0){ S.debt=r1(S.debt-S.treasury); S.treasury=0; }
  else if(S.treasury>90&&S.debt>0){ const pay=Math.min(S.debt,(S.treasury-90)*0.5);
    S.debt=r1(S.debt-pay); S.treasury=r1(S.treasury-pay); }
  S.rec = e.growth<0 ? (S.rec||0)+1 : 0;
  if(S.rec===2){ logMsg('Второй квартал падения подряд: в стране рецессия.',1);
    chron('Началась рецессия.','b'); shiftAll(-2.2); }
  S.stab = clamp(S.stab+(52-S.stab)*0.07-avgUnrest()*0.05+lawSum('stab')*0.6+rnd(-1.2,1.2),0,100);
}

/* ─── годовой бюджет ─────────────────────────────────────────────
   Ставки и статьи живут до конца года, но раз в четыре квартала
   правительство защищает их в Собрании. */
function avgSpend(){ return SPEND.reduce((a,s)=>a+S.spend[s.id],0)/SPEND.length; }
function budgetDue(){ return (S.q-S.termStart)%4===3; }
function budgetYear(){ return 2029+Math.floor((S.q)/4)+1; }
function budgetStance(){
  return {tax:clamp((2-taxLoad())*1.4,-2,2), econ:clamp((2-avgSpend())*1.2,-2,2)};
}
function budgetSupport(d){
  const b=budgetStance();
  let v=(0.95-Math.abs(d.st.tax-b.tax))*13+(0.95-Math.abs(d.st.econ-b.econ))*10;
  v+=inCoal(d.party)?10:-8;
  v+=(d.rel-50)*0.30;
  ['tax','econ'].forEach(ax=>{ const id=S.comm&&S.comm[ax];
    const ch=id?S.deputies.find(x=>x.id===id):null;
    if(ch&&ch.party===d.party)v+=5; });
  if(S.unrest[d.region]>30&&S.spend.soc>=3)v+=4;      // округ на взводе ценит соцстатью
  v+=noise(d.id+'budget'+S.q+taxLoad()+avgSpend(),7);
  return v;
}
function budgetTally(){
  const t={yes:0,no:0,und:0,list:[]};
  S.deputies.forEach(d=>{ const v=budgetSupport(d), st=v>10?'yes':v<-10?'no':'und';
    t[st]++; t.list.push({d,v,st}); });
  return t;
}
function snapshotBudget(){ return {tax:{...S.tax},spend:{...S.spend}}; }

/* ─── настроения ─────────────────────────────────────────────── */
function perfOf(g){
  const e=S.econ,c=g.care;let v=0;
  if(c.unemp) v+=c.unemp*(e.unemp-8)*2.1;
  if(c.inf)   v+=c.inf*(e.inf-4)*1.7;
  if(c.growth)v+=c.growth*(e.growth-1)*3.4;
  if(c.taxload)v+=c.taxload*(taxLoad()-2)*5.5;
  if(c.unrest)v+=c.unrest*(avgUnrest()-14)*0.55;
  ['def','pol','med','edu','soc'].forEach(k=>{ if(c[k])v+=c[k]*(S.spend[k]-2)*4.2; });
  if(c.infr)  v+=c.infr*(S.spend.inf-2)*4.2;
  return clamp(v,-30,30);
}
function moodTarget(g){
  // курс, дела и усталость от власти: чем дольше правите, тем меньше кредита
  const wear=(S.fatigue||0)*(hasTrait('media')?0.7:1)+agePenalty();
  let base=0.55*fitOf(g,me().st)+0.45*(52+perfOf(g))-wear;
  base+=(rep('folk')-50)*0.06;                      // народного прощают охотнее
  if(hasTrait('iron')&&g.id==='intel')base-=4;      // твёрдую руку интеллигенция не любит
  return clamp(base+(S.moodShock&&S.moodShock[g.id]||0),3,97);
}
function moodTick(){
  GROUPS.forEach(g=>{ const t=moodTarget(g);
    S.mood[g.id]=clamp(S.mood[g.id]+(t-S.mood[g.id])*0.28+rnd(-1.1,1.1),2,98); });
  REGIONS.forEach(r=>{
    const t=(r.dev-2)*1.6-S.unrest[r.id]*0.16+(S.spend.inf-2)*0.8;
    S.rmod[r.id]=r1(clamp(S.rmod[r.id]+(t-S.rmod[r.id])*0.16,-22,22));
  });
}
function shiftMood(gid,v,raw){
  // печать стоит между решением и тем, что о нём подумают
  const k=(raw||!S.press)?1:pressMul(v);
  S.mood[gid]=clamp(S.mood[gid]+v*k,2,98);
}
function shiftAll(v){ GROUPS.forEach(g=>shiftMood(g.id,v)); }
function approvalIn(gid,rid){ return clamp(S.mood[gid]+S.rmod[rid]+govEffect(rid),0,100); }
function approval(){
  let s=0,t=0;
  REGIONS.forEach(r=>GROUPS.forEach(g=>{
    const w=r.pop*r.share[g.id]; s+=w*approvalIn(g.id,r.id); t+=w; }));
  return s/t;
}
function regApproval(rid){
  const r=R(rid);let s=0;
  GROUPS.forEach(g=>s+=r.share[g.id]*approvalIn(g.id,rid));
  return s;
}
/* без свежего опроса цифры показываются с погрешностью */
function polled(){ return S.poll===S.q; }
function shown(v,key){ return (polled()||hasTrait('econom'))?v:v+noise(key+S.q,3.2); }

/* ─── депутаты и голосование ─────────────────────────────────── */
function bigOpp(){
  return S.parties.filter(p=>p.id!==PL&&!inCoal(p.id)).sort((a,b)=>seatsOf(b.id)-seatsOf(a.id))[0];
}
function leaderLine(pid,bill){
  const p=P(pid), d=Math.abs((p.st[T(bill.topic).ax]||0)-bill.stance);
  if(pid===PL) return d>2.3?-1:1;
  let line = d<1.15?1:d>2.25?-1:0;
  if(inCoal(pid)&&line<1) line++;
  // оппозиционные фракции, стоящие рядом, держатся вместе против правительства
  if(!inCoal(pid)&&(bill.by||PL)===PL){
    const lead=bigOpp();
    if(lead&&lead.id!==pid&&axDist(lead.st,p.st)<1.3){
      const ld=Math.abs((lead.st[T(bill.topic).ax]||0)-bill.stance);
      if(ld>2.25)line=Math.min(line,0)-1;
    }
  }
  return clamp(line,-1,1);
}
function riderPull(dep,bill){
  let v=0;
  (bill.riders||[]).forEach(rd=>{
    if(rd==='money') v+= dep.region===bill.regTarget?16:-1.5;
    if(rd==='biz')   v+= (dep.st.econ+dep.st.tax)*3.2;
    if(rd==='work')  v+= -(dep.st.econ+dep.st.tax)*3.2;
    if(rd==='soft')  v+= 5-Math.abs(dep.st[T(bill.topic).ax]-bill.stance)*1.6;
  });
  return v;
}
function support(dep,bill){
  const ax=T(bill.topic).ax;
  let v=(0.95-Math.abs(dep.st[ax]-bill.stance))*22;
  v+=leaderLine(dep.party,bill)*dep.loyal*0.32;
  v+=(dep.rel-50)*0.30;
  v+=riderPull(dep,bill);
  if(inCoal(dep.party))v+=5;
  // профильный комитет: его председатель ведёт за собой однопартийцев
  const ch=S.comm&&S.comm[ax]?S.deputies.find(d=>d.id===S.comm[ax]):null;
  if(ch){ if(ch.id===dep.id)v+=7;
    if(ch.party===dep.party)v+=leaderLine(ch.party,bill)>=0?7:-3; }
  // чужой проект — повод его завалить, кто бы его ни вносил
  const mine=(bill.by||PL)===PL;
  if(mine&&!inCoal(dep.party))v-=9;
  if(!mine&&dep.party===PL)v-=9;
  if(!mine&&inCoal(dep.party)&&dep.party!==PL)v-=4;
  if(dep.pledge&&bill.id&&dep.pledgeNo===bill.id)v+=dep.pledge;
  if(mine&&hasTrait('jurist'))v+=4;               // текст написан так, что не придерёшься
  if(mine)v+=(rep('comp')-50)*0.05;
  v+=noise(dep.id+'|'+bill.topic+bill.stance+(bill.riders||[]).join('')+S.billNo,7);
  if(T(bill.topic).local&&bill.stance>0&&R(dep.region).capital)v-=6;
  return v;
}
function tally(bill){
  const t={yes:0,no:0,und:0,list:[]};
  S.deputies.forEach(d=>{
    const v=support(d,bill), st=v>10?'yes':v<-10?'no':'und';
    t[st]++; t.list.push({d,v,st});
  });
  return t;
}
function resolveVote(bill,need){
  const t=tally(bill);let yes=0,no=0;
  t.list.forEach(x=>{
    if(x.st==='yes')yes++; else if(x.st==='no')no++;
    else { const p=0.5+x.v/30; (Math.random()<p?yes++:no++); }
  });
  return {yes,no,pass:yes>=(need||MAJ)};
}

/* ─── эффект принятого закона ────────────────────────────────── */
function billSum(bill){
  const rd0=bill.riders||[];
  const t=T(bill.topic), k=bill.stance*(rd0.indexOf('soft')>=0?0.66:1), sum={};
  Object.entries(t.eff||{}).forEach(([key,v])=>sum[key]=r2(v*k));
  sum.gr={};
  Object.entries(t.gr||{}).forEach(([g,v])=>sum.gr[g]=r2(v*k));
  rd0.forEach(rd=>{
    if(rd==='biz'){ sum.gr.biz=(sum.gr.biz||0)+1.6; sum.gr.work=(sum.gr.work||0)-1; sum.once=(sum.once||0)-6; }
    if(rd==='work'){ sum.gr.work=(sum.gr.work||0)+1.6; sum.gr.biz=(sum.gr.biz||0)-1.2; sum.once=(sum.once||0)-7; }
    if(rd==='money'){ sum.once=(sum.once||0)-9; }
  });
  return sum;
}
function enact(bill,decree){
  const sum=billSum(bill), t=T(bill.topic);
  if(decree)['money','growth','inf','unemp','invest','unrest','stab','once'].forEach(k=>{
    if(sum[k])sum[k]=r2(sum[k]*DECREE_POWER); });
  if(decree)Object.keys(sum.gr).forEach(g=>sum.gr[g]=r2(sum.gr[g]*DECREE_POWER));
  // по каждой теме действует только последняя редакция — закон отменяет и указ
  const prev=S.laws.findIndex(l=>l.topic===bill.topic);
  if(prev>=0)S.laws.splice(prev,1);
  S.laws.push({no:++S.billNo, topic:bill.topic, stance:bill.stance, riders:[...(bill.riders||[])],
    q:S.q, sum, name:t.name, by:bill.by||PL,
    decree:!!decree, until:decree?S.q+DECREE_LEN:0});
  if(sum.once)S.treasury=r1(S.treasury+sum.once);
  // указом ставку не трогаем: он истечёт, а изменённый налог остался бы навсегда
  if(t.rate&&!decree&&Math.abs(bill.stance)>0)
    S.tax[t.rate]=clamp(S.tax[t.rate]-Math.round(bill.stance/1.4),0,4);
  Object.entries(sum.gr||{}).forEach(([g,v])=>shiftMood(g,v*1.5));
  if(sum.unrest)REGIONS.forEach(r=>S.unrest[r.id]=clamp(S.unrest[r.id]+sum.unrest*2,0,100));
  if(bill.regTarget){ S.rmod[bill.regTarget]=clamp(S.rmod[bill.regTarget]+3,-22,22);
    S.unrest[bill.regTarget]=clamp(S.unrest[bill.regTarget]-5,0,100); }
  // партия, чью позицию закон отражает, чувствует себя победителем
  S.parties.forEach(p=>{ if(p.id!==PL&&Math.abs(p.st[t.ax]-bill.stance)<0.9)p.mom=clamp(p.mom+1.5,-12,12); });
}

function lawOn(topic){ return S.laws.find(l=>l.topic===topic); }
/* постоянные эффекты законов пересчитываются каждый квартал через lawSum */

/* ─── журнал и летопись ──────────────────────────────────────── */
/* Кварталы бывают и отрицательными: судья или президент могли сесть
   в кресло до начала игры. Остаток по модулю приводим к неотрицательному,
   иначе индекс сезона уходит за границу массива. */
const qmod = q => ((q-1)%4+4)%4;
function dateLabel(q){ q=q===undefined?S.q:q; return SEASONS[qmod(q)]+' '+(2029+Math.floor((q-1)/4)); }
function shortDate(q){ q=q===undefined?S.q:q; return (2029+Math.floor((q-1)/4))+'/'+QUARTERS[qmod(q)]; }
function logMsg(t,key){ S.log.unshift({d:shortDate(),t,key:!!key}); if(S.log.length>240)S.log.pop(); }
function chron(t,kind){ S.chron.push({y:2029+Math.floor((S.q-1)/4),t,kind:kind||''}); }
function snapshot(){
  S.hist.push({q:S.q,ap:r1(approval()),gdp:r1(S.econ.gdp),gr:S.econ.growth,tr:Math.round(S.treasury),
    un:S.econ.unemp,inf:S.econ.inf,seats:seatsOf(PL),debt:Math.round(S.debt)});
  if(S.hist.length>90)S.hist.shift();
}
function toast(t){
  const b=document.getElementById('toasts');if(!b)return;
  const e=document.createElement('div');e.className='toast';e.textContent=t;b.appendChild(e);
  setTimeout(()=>e.remove(),2750);
}
/* ════════════════════════════════════════════════════════════════
   Ход игры: действия, события, коалиция, выборы.
   ════════════════════════════════════════════════════════════════ */

function useAP(n){ if(S.ap<n){toast('Не осталось действий на квартал');return false;} S.ap-=n; return true; }
function payCap(n){ if(S.cap<n){toast('Не хватает политического веса');return false;} S.cap-=n; return true; }
function payGold(n){ if(S.treasury<n){toast('В казне нет таких денег');return false;} S.treasury=r1(S.treasury-n); return true; }
function payFunds(n){ if(S.funds<n){toast('Партийная касса пуста');return false;} S.funds=r1(S.funds-n); return true; }
function addCap(n){ S.cap=clamp(S.cap+n,0,100); }

function capIncome(){
  let v=2.6+(approval()-46)*0.09+(seatsOf(PL)/SEATS)*7;
  if(!isPM())v=1.8+(approval()-42)*0.07+(seatsOf(PL)/SEATS)*5;
  v-=avgUnrest()*0.03;
  if(S.role==='junior')v+=1;
  return r1(clamp(v,-2,11));
}
function fundIncome(){
  let v=6+seatsOf(PL)*0.14+S.mood.biz*0.05;
  if(isPM())v+=3;
  return r1(v);
}

/* ─── действия кабинета ──────────────────────────────────────── */
const ACT = {
  visit(rid){
    if(!useAP(1)||!payGold(hasTrait('zemsky')?4:6))return;
    const r=R(rid), g=govOf(rid);
    const warm=hasTrait('zemsky')?2:0;
    S.rmod[rid]=clamp(S.rmod[rid]+ri(3,6)+warm,-22,22);
    S.unrest[rid]=clamp(S.unrest[rid]-ri(4,9)-warm,0,100);
    if(g)g.rel=clamp(g.rel+ri(2,5),0,100);
    bumpRep('folk',0.9);
    let also='';
    if(hasTrait('zemsky')){                       // свой в регионах цепляет и соседей
      NB(rid).forEach(n=>{ S.rmod[n]=clamp(S.rmod[n]+1.5,-22,22);
        S.unrest[n]=clamp(S.unrest[n]-2,0,100); });
      also=' Соседние субъекты тоже заметили приезд.';
    }
    logMsg('Поездка в '+r.cap+': поддержка в регионе выросла.'+also);
    toast('Регион принял визит');
  },
  address(gid){
    if(!useAP(1)||!payCap(6))return;
    const g=G(gid), k=hasTrait('orator')?1.6:1;
    shiftMood(gid,ri(3,6)*k);
    GROUPS.forEach(x=>{ if(x.id!==gid&&axDist(x.pref,g.pref)>2.2)shiftMood(x.id,-1.2); });
    bumpRep('folk',0.6);
    logMsg('Обращение к нации: ставка на группу «'+g.name.toLowerCase()+'».');
    toast('Речь произнесена');
  },
  poll(){
    if(!useAP(1)||!payFunds(9))return;
    S.poll=S.q; logMsg('Заказана социология: цифры по стране уточнены.'); toast('Опрос готов');
  },
  fundraise(){
    if(!useAP(1))return;
    let v=ri(14,26)+Math.round(S.mood.biz*0.16);
    if(hasTrait('media'))v=Math.round(v*1.35);
    if(S.you.origin==='business')v=Math.round(v*1.25);
    S.funds=r1(S.funds+v); shiftMood('intel',-1.4); shiftMood('work',-0.8);
    bumpRep('honest',-0.5);
    logMsg('Сбор средств: касса пополнена на '+v+' млн.');
    toast('+'+v+' млн в кассу');
  },
  noconf(){
    if(isPM()){toast('Вотум вносит оппозиция, а не вы');return;}
    if(S.noConfCool>0){toast('Собрание не примет новый вотум так скоро');return;}
    if(!useAP(1)||!payCap(22))return;
    confidenceVote(true);
  },
  whip(){
    if(!S.bill){toast('На столе нет проекта');return;}
    if(!useAP(1)||!payCap(capCost(11,'lobby')))return;
    const t=tally(S.bill);let n=0;
    t.list.forEach(x=>{ if(x.st!=='und')return;
      const g=inCoal(x.d.party)?ri(7,13):ri(2,7);
      x.d.pledge=(x.d.pledge||0)+g; x.d.pledgeNo=S.bill.id; n++; });
    logMsg('Работа с колеблющимися: обработано '+n+' депутатов.');
    toast(n?'Обработано: '+n:'Колеблющихся нет');
  },
  talk(pid){
    if(!useAP(1)||!payCap(capCost(5,'talk')))return;
    const p=P(pid), n=S.deputies.filter(d=>d.party===pid);
    const g=ri(4,9);
    n.forEach(d=>d.rel=clamp(d.rel+g+ri(-2,2),0,100));
    if(S.partners[pid])S.partners[pid].anger=Math.max(0,S.partners[pid].anger-1);
    bumpRep('folk',0.3);
    logMsg('Переговоры с фракцией «'+p.name+'»: отношения +'+g+'.');
    toast('Фракция выслушала вас');
  },
};

/* ─── работа с депутатом ─────────────────────────────────────── */
const LOBBY = [
  {id:'talk', name:'Личная беседа', cap:3, gold:0, txt:'Полчаса в кабинете и обещание помнить услугу.'},
  {id:'comm', name:'Место в комитете', cap:8, gold:0, txt:'Пост в профильном комитете. Однопартийцы заметят.'},
  {id:'cash', name:'Деньги округу', cap:0, gold:9, txt:'Стройка в его округе за счёт казны.'},
  {id:'dirt', name:'Разговор по-плохому', cap:6, gold:0, txt:'Намёк на папку. Сработает не со всяким.'},
  {id:'join', name:'Позвать во фракцию', cap:16, gold:10, need:d=>d.party!==PL&&d.rel>=64,
   txt:'Мандат переходит к вам. Его партия этого не забудет.'},
];
function lobby(depId,kind){
  const d=S.deputies.find(x=>x.id===depId), l=LOBBY.find(x=>x.id===kind);
  if(!d||!l)return;
  if(kind==='dirt'&&hasTrait('clean')){
    toast('Незапятнанный такими вещами не занимается'); return;
  }
  if(!useAP(1))return;
  if(l.cap&&!payCap(capCost(l.cap,'lobby'))){S.ap++;return;}
  if(l.gold&&!payGold(l.gold)){S.ap++;return;}
  d.deals++;
  if(kind==='talk'){ d.rel=clamp(d.rel+ri(6,12),0,100); d.note='беседовал с вами'; }
  if(kind==='comm'){ d.rel=clamp(d.rel+ri(14,22),0,100); d.note='получил комитет';
    const mate=S.deputies.filter(x=>x.party===d.party&&x.id!==d.id);
    if(mate.length){const m=pick(mate);m.rel=clamp(m.rel-ri(4,9),0,100);m.note='обойдён при дележе';} }
  if(kind==='cash'){ d.rel=clamp(d.rel+ri(10,18),0,100); d.note='получил стройку в округ';
    S.rmod[d.region]=clamp(S.rmod[d.region]+1.5,-22,22);
    addTrail(d.integ*0.085,'стройка в округе '+d.name); }  // честный проговорится скорее
  if(kind==='dirt'){
    if(Math.random()<clamp(d.integ/125,0.12,0.72)){
      d.rel=clamp(d.rel-ri(16,28),0,100); d.note='обиделся на нажим';
      shiftAll(-1.4); addCap(-6);
      bumpRep('honest',-9); bumpRep('firm',2);
      career('Скандал: разговор с депутатом '+d.name+' попал в печать.');
      logMsg('Депутат '+d.name+' вынес разговор на публику. Скандал.',1);
      chron('Скандал вокруг давления на депутата '+d.name+'.','b');
      sheetOpen({eye:'Утечка',title:'Разговор попал в газеты',
        body:'<p>'+d.name+' пересказал журналистам содержание беседы. Пресса пишет о шантаже в стенах Собрания.</p>',
        acts:[{label:'Принять к сведению'}]});
      render();return;
    }
    d.rel=clamp(d.rel+ri(18,30),0,100); d.note='стал сговорчивее';
    bumpRep('honest',-2.5); bumpRep('firm',1.2);
    addTrail(d.integ*0.14,'нажим на '+d.name);
  }
  if(kind==='join'){
    const from=d.party;
    const ch=clamp((d.rel-55)/58+(70-d.loyal)/150,0.08,0.82);
    if(Math.random()<ch){
      d.party=PL; d.rel=clamp(d.rel+6,0,100); d.loyal=ri(55,80); d.note='перешёл к вам';
      S.seats[from]--; S.seats[PL]=(S.seats[PL]||0)+1;
      S.deputies.filter(x=>x.party===from).forEach(x=>x.rel=clamp(x.rel-6,0,100));
      if(S.partners[from])S.partners[from].anger=clamp(S.partners[from].anger+1.5,0,6);
      bumpRep('firm',1.5);
      addTrail(ri(4,9),'переход '+d.name);
      logMsg('Депутат '+d.name+' перешёл из «'+P(from).name+'» в вашу фракцию.',1);
      chron('Депутат '+d.name+' сменил фракцию на вашу.','g');
    } else {
      d.rel=clamp(d.rel-15,0,100); d.note='отказал вам';
      S.deputies.filter(x=>x.party===from).forEach(x=>x.rel=clamp(x.rel-4,0,100));
      logMsg('Депутат '+d.name+' отказался переходить и рассказал об этом своим.',1);
    }
    render();return;
  }
  logMsg('Работа с депутатом: '+d.name+' ('+P(d.party).short+'), отношение '+Math.round(d.rel)+'.');
  toast('Отношение: '+Math.round(d.rel));
  render();
}

function setChair(ax,depId){
  if(!useAP(1)||!payCap(6))return;
  const old=S.comm[ax]?S.deputies.find(d=>d.id===S.comm[ax]):null;
  if(old){ old.rel=clamp(old.rel-9,0,100); old.note='потерял комитет'; }
  const d=S.deputies.find(x=>x.id===depId);
  if(!confirmSenate('chair',d,d.party)){

    toast('Сенат отклонил кандидатуру'); render(); return;
  }
  S.comm[ax]=depId; d.rel=clamp(d.rel+11,0,100); d.note='возглавил комитет';
  logMsg('Комитет по теме «'+AXNAME[ax]+'» возглавил '+d.name+' ('+P(d.party).short+').');
  toast('Комитет закреплён');

}
/* ─── путь закона ─────────────────────────────────────────────────
   Собрание → Сенат → подпись президента. Останавливается на первой
   же ступени, где не хватило голосов; вето снимается двумя третями
   Собрания — Сенат своё слово уже сказал. */
function pathRow(name,who,res,verdict,ok){
  return `<div class="stg ${ok?'ok':'no'}"><i>${name}</i><b>${who}</b>
    ${res?`<u>${res.yes} : ${res.no}</u>`:'<u></u>'}
    <span class="stamp ${ok?'y':'n'}">${verdict}</span></div>`;
}
function billPath(b,low,up,pres,ok,cl){
  const rows=[pathRow('Народное собрание','нужно '+MAJ+' из '+SEATS,low,low.pass?'принят':'отклонён',low.pass)];
  // ступень прений видна отдельно: закон теряют здесь чаще, чем на голосовании
  if(cl)rows.push(pathRow('Прения в Сенате','клотур: нужно '+cl.need+' из '+SEN_SEATS,
    {yes:cl.got,no:SEN_SEATS-cl.got},cl.ok?'прения закрыты':'обструкция',cl.ok));
  if(up)rows.push(pathRow('Сенат','нужно '+SEN_MAJ+' из '+SEN_SEATS,up,up.pass?'принят':'отклонён',up.pass));
  if(pres)rows.push(pathRow('Президент',S.pres.name+' · '+P(S.pres.party).short,null,pres.veto?'вето':'подписан',!pres.veto));
  return `<p class="lead">${stanceLine(b)}</p><div class="path">${rows.join('')}</div>`;
}
function refLocked(topic){
  const l=lawOn(topic);
  return !!(l&&l.ref&&l.until>S.q);
}
function submitBill(){
  const b=S.bill; if(!b)return;
  if(refLocked(b.topic)){
    toast('Решение референдума нельзя переписать до '+dateLabel(lawOn(b.topic).until)); return; }
  if(!useAP(1)||!payCap(8))return;
  S.billNo++;
  const t=T(b.topic);
  const low=resolveVote(b);
  S.votes.unshift({no:S.billNo,q:S.q,name:t.name,stance:b.stance,yes:low.yes,no:low.no,pass:low.pass,house:'соб'});

  if(!low.pass){
    addCap(-4); shiftAll(-0.7);
    cover({ax:t.ax,stance:b.stance,
      good:'Собрание остановило спорный проект',
      bad:'Провал в Собрании: «'+t.name.toLowerCase()+'» не прошёл',
      flat:'Собрание отклонило «'+t.name.toLowerCase()+'»'});
    logMsg('Собрание отклонило «'+t.name+'» ('+low.yes+' против '+low.no+').',1);
    chron('Собрание отклонило «'+t.name.toLowerCase()+'».','b');
    sheetOpen({eye:'Прохождение закона · '+dateLabel(),title:t.name,
      body:billPath(b,low)+'<p class="hint">Проект не прошёл первую палату. Тот же текст второй раз внести нельзя.</p>',
      acts:[{label:'Закрыть'}]});
    S.bill=null; render(); return;
  }

  S.bill=null;                       // дальше проект живёт своим ходом, а не на столе
  senateStage(b,low);
  render();
}

/* ═══ СЕНАТ: КАЛЕНДАРЬ, ПРЕНИЯ, ГОЛОСОВАНИЕ ═══════════════════════
   Три ступени вместо одной. Сначала лидер большинства решает, когда
   поставить проект в повестку. Потом меньшинство решает, давать ли
   вообще голосовать. И только третьей идёт сама подача голосов. */

/* ─── повестка ───────────────────────────────────────────────── */
function senCalendar(b,low){
  if(senFriendlyLead()||!S.senLead)return true;
  const risk=SEN_HOLD*(1-leadFavour()/100);
  if(Math.random()>=risk)return true;
  S.senHold={bill:{...b,riders:[...(b.riders||[])]}, low, left:ri(1,2), q:S.q};
  const t=T(b.topic);
  logMsg('Лидер большинства '+S.senLead.name+' не поставил «'+t.name+'» в повестку Сената.',1);
  chron('Сенат отложил «'+t.name.toLowerCase()+'».','b');
  sheetOpen({eye:'Повестка Сената · '+dateLabel(),title:'Проект положен под сукно',
    body:`<p class="lead">${t.name} прошёл Собрание, но до голосования в Сенате не дошёл.
        Календарь палаты ведёт лидер большинства, и он не назвал дату.</p>
      <div class="res"><span>Лидер</span><b class="w">${S.senLead.name}</b>
        <span>Фракция</span><b class="w">${P(S.senLead.party).name}</b>
        <span>Расположение к вам</span><b class="${leadFavour()<40?'bad':leadFavour()>=70?'good':'warn'}">${leadFavour()}</b>
        <span>Ожидание</span><b>${quarters(S.senHold.left)}</b></div>
      <p class="hint">Отклонения не было: проект жив и всплывёт сам. Ускорить его можно только
        одним способом — договориться с тем, кто ведёт календарь.</p>`,
    acts:[{label:'Ждать'},{label:'К Сенату',fn(){S.tab='senate';}}]});
  return false;
}
/* проект, пролежавший срок, выходит на голосование сам */
function senHoldTick(){
  const h=S.senHold; if(!h)return;
  h.left--;
  if(h.left>0)return;
  S.senHold=null;
  logMsg('«'+T(h.bill.topic).name+'» наконец поставлен на голосование в Сенате.',1);
  senateDebate(h.bill,h.low,true);
}
/* выкуп повестки: лидер ставит проект сразу, но услуга не бесплатна */
function pushCalendar(){
  const h=S.senHold; if(!h){toast('В повестке ничего не залежалось');return;}
  if(!useAP(1)||!payCap(capCost(LEAD_DEAL,'lobby')))return;
  S.senLead.deals=(S.senLead.deals||0)+1;
  S.senLead.favour=clamp((S.senLead.favour||0)+ri(6,12),-40,40);
  addTrail(ri(3,7),'сделка с лидером Сената');
  S.senHold=null;
  logMsg('Лидер большинства поставил «'+T(h.bill.topic).name+'» в повестку вне очереди.');
  senateDebate(h.bill,h.low,true);
  render();
}

/* ─── прения и обструкция ────────────────────────────────────── */
function senateStage(b,low){
  if(!senCalendar(b,low))return;
  senateDebate(b,low);
}
function senateDebate(b,low,skipCal){
  const t=T(b.topic), tl=senTally(b);
  if(!willFilibuster(b,tl)){ senateFloor(b,low,{got:clotureCount(b,tl),need:cloture(),ok:true}); return; }
  const got=clotureCount(b,tl), need=cloture(), lack=need-got;
  const med=senMedian(t.ax), soft=Math.round(clamp((b.stance+med)/2,-2,2))||(b.stance>0?1:-1);
  const opts=[];
  opts.push({label:'Ставить на клотур как есть',hint:'сейчас за прекращение прений '+got+' из '+need,
    fn(){ filiVote(b,low); }});
  // выкуп закрывает последние несколько голосов, а не разрыв в сорок:
  // предлагать его при большом отрыве — обманывать самих себя
  if(lack<=10)opts.push({label:'Выкупить недостающие голоса',
    hint:'вес '+capCost(FILI_CAP,'lobby')+' и '+Math.max(6,lack*2)+' млрд · берут не все',
    fn(){ filiBuy(b,low,lack); }});
  if(soft!==b.stance)opts.push({label:'Смягчить текст до «'+STEP[soft+2]+'»',hint:'вес '+CONF_CAP+' · палата стоит на '+med.toFixed(1),
    fn(){ filiSoften(b,low,soft); }});
  if(canNuke())opts.push({label:'Ядерный вариант: клотур в '+SEN_MAJ,hint:'вес '+NUKE_COST+' · навсегда и для всех',
    fn(){ askNuke(b,low); }});
  opts.push({label:'Отозвать проект',hint:'потерять вес '+3+', но не позориться голосованием',
    fn(){ addCap(-3); logMsg('«'+t.name+'» отозван из Сената: обструкцию сломать было нечем.',1); render(); }});

  sheetOpen({eye:'Прения в Сенате · '+dateLabel(),title:'Обструкция',
    body:`<p class="lead">${t.name} — ${stanceLine(b).split('—')[1]||''}. Собрание проект принял.
        В Сенате меньшинство отказалось прекращать прения: пока за клотур нет ${need} голосов,
        до голосования по существу дело не дойдёт.</p>
      ${voteBar(got,SEN_SEATS-got,need)}
      <div class="res"><span>За прекращение прений</span><b class="${got>=need?'good':'bad'}">${got}</b>
        <span>Нужно</span><b>${need}</b>
        <span>Не хватает</span><b class="bad">${lack}</b>
        <span>Простое большинство</span><b>${senCount(b,tl).yes} из ${SEN_MAJ}</b></div>
      <p class="hint">Голосов на сам закон может хватать — обструкция бьёт не по большинству,
        а по праву его показать. ${nuked()?'Регламент уже опущен раньше.':'Порог клотура — '+need+'.'}</p>`,
    opts});
}
/* голосование по клотуру: прошло — идём к существу, нет — проект мёртв */
function filiVote(b,low,note){
  const tl=senTally(b), got=clotureCount(b,tl), need=cloture();
  const cl={got,need,ok:got>=need};
  if(cl.ok){ senateFloor(b,low,cl,note); return; }
  const t=T(b.topic);
  addCap(-4); shiftAll(-0.5);
  S.votes.unshift({no:S.billNo,q:S.q,name:t.name+' · клотур',stance:b.stance,
    yes:got,no:SEN_SEATS-got,pass:false,house:'сен'});
  cover({ax:t.ax,stance:b.stance,
    good:'Сенат не дал продавить спорный закон',
    bad:'Обструкция в Сенате похоронила «'+t.name.toLowerCase()+'»',
    flat:'Прения в Сенате так и не были закрыты'});
  logMsg('Обструкция устояла: за клотур '+got+' при нужных '+need+'. «'+t.name+'» снят.',1);
  chron('Обструкция в Сенате остановила «'+t.name.toLowerCase()+'».','b');
  sheetOpen({eye:'Прохождение закона · '+dateLabel(),title:t.name,
    body:billPath(b,low,null,null,false,cl)+
      `<p class="hint">Меньшинству не нужно большинство — достаточно ${SEN_SEATS-need+1} голосов,
        чтобы говорить бесконечно. Это и есть главная арифметика палаты.</p>`,
    acts:[{label:'Закрыть'}]});
  render();
}
/* выкуп: обещания колеблющимся, деньги субъектам, надзору — след */
function filiBuy(b,low,lack){
  const price=Math.max(6,lack*2);
  if(!payCap(capCost(FILI_CAP,'lobby'))){render();return;}
  if(!payGold(price)){addCap(capCost(FILI_CAP,'lobby'));render();return;}
  // деньги идут не всем подряд, а тем, кому до «да» остаётся один шаг:
  // считаем счёт по клотуру и работаем с ближайшими к нулю снизу
  const tl=senTally(b);
  const score=x=>{ const own=x.d.party===(b.by||PL)||inCoal(x.d.party);
    return x.v*0.65+(own?24:-18)+(x.d.rel-50)*0.2+(senRank(x.d)>=4?6:0); };
  // берут не всех, а столько, на сколько хватает рук: приём закрывает
  // последние несколько голосов, а не разрыв в тридцать
  const near=tl.list.filter(x=>{const v=score(x); return v<=0&&v>-15;})
    .sort((a,c)=>score(c)-score(a)).slice(0,Math.min(lack+2,10));
  let n=0;
  near.forEach(x=>{
    if(Math.random()<x.d.integ/145)return;          // неподкупный не берёт
    const g=inCoal(x.d.party)?ri(8,18):ri(4,14);
    x.d.spledge=(x.d.spledge||0)+g; x.d.spledgeNo=b.id; x.d.deals++; n++;
  });
  addTrail(ri(5,11),'выкуп голосов в Сенате');
  bumpRep('honest',-2);
  logMsg('Работа с сенаторами перед клотуром: обработано '+n+', казна минус '+price+' млрд.');
  filiVote(b,low);
}
/* тот же выкуп без оплаты — служит замеру силы приёма */
function filiBuyProbe(b,lack){
  const tl=senTally(b);
  const score=x=>{ const own=x.d.party===(b.by||PL)||inCoal(x.d.party);
    return x.v*0.65+(own?24:-18)+(x.d.rel-50)*0.2+(senRank(x.d)>=4?6:0); };
  tl.list.filter(x=>{const v=score(x); return v<=0&&v>-15;})
    .sort((a,c)=>score(c)-score(a)).slice(0,Math.min(lack+2,10))
    .forEach(x=>{ if(Math.random()<x.d.integ/145)return;
      x.d.spledge=inCoal(x.d.party)?ri(8,18):ri(4,14); x.d.spledgeNo=b.id; });
}
/* уступка: текст сдвигается к медиане палаты — закон слабее, но живой */
function filiSoften(b,low,soft){
  if(!payCap(CONF_CAP)){render();return;}
  const t=T(b.topic), was=b.stance;
  b.stance=soft;
  shiftAll(-0.3); bumpRep('firm',-2); bumpRep('comp',1);
  logMsg('«'+t.name+'» смягчён с «'+STEP[was+2]+'» до «'+STEP[soft+2]+'» ради клотура.',1);
  chron('Проект по «'+t.name.toLowerCase()+'» смягчили ради Сената.','');
  filiVote(b,low,'текст смягчён до «'+STEP[soft+2]+'»');
}
/* ядерный вариант: регламент меняют простым большинством — один раз
   и навсегда, потому что следующий состав палаты им же и воспользуется */
function askNuke(b,low){
  sheetOpen({eye:'Регламент Сената',title:'Опустить порог клотура?',
    body:`<p class="lead">Председатель ставит вопрос о толковании регламента, и палата решает его
        простым большинством. С этого дня прения прекращаются ${SEN_MAJ} голосами, а не ${cloture()}.</p>
      <div class="res"><span>У коалиции в Сенате</span><b class="good">${senCoalSeats()}</b>
        <span>Нужно</span><b>${NUKE_MIN}</b>
        <span>Председатель</span><b class="w">${S.vp?S.vp.name:'—'}</b>
        <span>Цена</span><b>вес ${NUKE_COST}</b></div>
      <p class="hint">Обратного хода нет. Правило останется и тогда, когда большинство будет чужим —
        и тогда уже вам нечем будет тянуть прения.</p>`,
    opts:[
      {label:'Опустить порог',hint:'вес '+NUKE_COST+' · навсегда',fn(){ doNuke(); filiVote(b,low,'регламент изменён'); }},
      {label:'Не трогать регламент',hint:'вернуться к прениям',fn(){ senateDebate(b,low); }}]});
}
function doNuke(){
  if(!payCap(NUKE_COST))return false;
  S.senRules={cloture:SEN_MAJ, nuked:true, nukedBy:PL, nukedQ:S.q};
  shiftAll(-1.8); shiftMood('intel',-6); shiftMood('urban',-3);
  bumpRep('firm',6); bumpRep('honest',-5);
  S.presRel=clamp(S.presRel+3,0,100);
  pressAll(-9);
  career('Порог клотура в Сенате опущен до простого большинства.');
  logMsg('Регламент Сената изменён: прения теперь закрываются '+SEN_MAJ+' голосами.',1);
  chron('Порог клотура в Сенате опущен.','b');
  cover({ax:'order',stance:2,
    good:'Палату наконец заставили работать',
    bad:'Регламент Сената сломан ради одного закона',
    flat:'Сенат опустил порог прекращения прений'});
  return true;
}

/* ─── голосование по существу и согласительная комиссия ──────── */
function senateFloor(b,low,cl,note){
  const t=T(b.topic);
  const up=resolveSenVote(b);
  S.votes.unshift({no:S.billNo,q:S.q,name:t.name,stance:b.stance,yes:up.yes,no:up.no,pass:up.pass,house:'сен'});
  if(!up.pass){
    const lack=SEN_MAJ-up.yes;
    const med=senMedian(t.ax);
    const soft=Math.round(clamp((b.stance+med*2)/3,-2,2));
    // проигранный на несколько голосов проект не хоронят, а переписывают
    if(lack<=CONF_GAP&&soft!==b.stance&&!b.conf){
      askConference(b,low,up,cl,soft,lack);
      return;
    }
    addCap(-3); shiftAll(-0.4);
    logMsg('Сенат отклонил «'+t.name+'» ('+up.yes+' против '+up.no+'), хотя Собрание его приняло.',1);
    chron('Сенат остановил «'+t.name.toLowerCase()+'».','b');
    sheetOpen({eye:'Прохождение закона · '+dateLabel(),title:t.name,
      body:billPath(b,low,up,null,false,cl)+
        '<p class="hint">Палата субъектов не пропустила проект. Сенату важнее регионы, чем фракции: смотрите, кого задевает текст.</p>',
      acts:[{label:'Закрыть'}]});
    render(); return;
  }
  presStage(b,low,up,cl,note);
}
/* согласительная комиссия: палаты сходятся на среднем тексте, и
   Собрание должно принять его заново — уже без права поправок */
function askConference(b,low,up,cl,soft,lack){
  const t=T(b.topic);
  sheetOpen({eye:'Согласительная комиссия',title:'Сенат готов сойтись на среднем',
    body:`<p class="lead">«${t.name}» не хватило ${lack} голосов. Сенаторы предлагают комиссию:
        текст сдвинется с «${STEP[b.stance+2]}» на «${STEP[soft+2]}», и палата его пропустит.
        Собранию придётся принять согласованный текст целиком, без поправок.</p>
      ${voteBar(up.yes,up.no)}
      <div class="res"><span>Медиана Сената по оси</span><b>${senMedian(t.ax).toFixed(1)}</b>
        <span>Ваш текст</span><b>${STEP[b.stance+2]}</b>
        <span>Согласованный</span><b class="w">${STEP[soft+2]}</b>
        <span>Цена комиссии</span><b>вес ${CONF_CAP}</b></div>`,
    opts:[
      {label:'Созвать комиссию',hint:'закон слабее, но он будет',
       fn(){ if(!payCap(CONF_CAP)){render();return;} runConference(b,low,cl,soft); }},
      {label:'Настоять на своём тексте',hint:'проект умирает здесь',
       fn(){ addCap(-3); shiftAll(-0.4); bumpRep('firm',3);
         logMsg('Комиссия отклонена: «'+t.name+'» снят с рассмотрения.',1);
         chron('Сенат остановил «'+t.name.toLowerCase()+'».','b'); render(); }}]});
}
function runConference(b,low,cl,soft){
  const t=T(b.topic), was=b.stance;
  b.stance=soft; b.conf=true;
  // Собрание голосует по согласованному тексту заново
  const re=resolveVote(b);
  S.votes.unshift({no:S.billNo,q:S.q,name:t.name+' · согласовано',stance:soft,
    yes:re.yes,no:re.no,pass:re.pass,house:'соб'});
  if(!re.pass){
    addCap(-5); shiftAll(-0.8);
    logMsg('Собрание не приняло согласованный текст «'+t.name+'» ('+re.yes+':'+re.no+').',1);
    sheetOpen({eye:'Согласительная комиссия',title:'Собрание не приняло компромисс',
      body:voteBar(re.yes,re.no)+
        `<p>Текст, устроивший Сенат, оказался слишком мягок для Собрания: за него ${re.yes} при нужных ${MAJ}.
          Проект похоронен между палатами — самая обидная из смертей закона.</p>`,
      acts:[{label:'Закрыть'}]});
    render(); return;
  }
  const up=resolveSenVote(b);
  S.votes.unshift({no:S.billNo,q:S.q,name:t.name+' · согласовано',stance:soft,
    yes:up.yes,no:up.no,pass:up.pass,house:'сен'});
  bumpRep('comp',2); bumpRep('firm',-2);
  logMsg('Согласительная комиссия свела «'+t.name+'» с «'+STEP[was+2]+'» на «'+STEP[soft+2]+'».',1);
  chron('Палаты сошлись на компромиссе по «'+t.name.toLowerCase()+'».','');
  if(!up.pass){
    addCap(-4);
    sheetOpen({eye:'Согласительная комиссия',title:'Сенат отступил от своего же текста',
      body:billPath(b,re,up,null,false,cl)+'<p class="hint">Так бывает: комиссия договаривается, а палата — нет.</p>',
      acts:[{label:'Закрыть'}]});
    render(); return;
  }
  presStage(b,re,up,cl,'через согласительную комиссию');
}

/* ─── подпись президента ─────────────────────────────────────── */
function presStage(b,low,up,cl,note){
  const t=T(b.topic);
  const veto=Math.random()<vetoChance(b);
  if(veto){
    S.pres.vetoes++;
    S.vetoed={bill:{...b,riders:[...(b.riders||[])]}, q:S.q, low, up, tries:0};
    S.presRel=clamp(S.presRel-4,0,100);
    addCap(-2);
    cover({ax:t.ax,stance:b.stance,
      good:'Президент остановил спорный закон',

/* преодоление вето: две трети Собрания, одно действие и 14 веса */
function overrideVeto(){
  const v=S.vetoed; if(!v){toast('Отклонённых законов нет');return;}
  if(!useAP(1)||!payCap(capCost(14,'veto')))return;
  const b=v.bill, t=T(b.topic);
  const res=resolveVote(b,SUPER);
  v.tries++;
  S.votes.unshift({no:S.billNo,q:S.q,name:t.name+' · вето',stance:b.stance,yes:res.yes,no:res.no,pass:res.pass,house:'соб'});
  if(res.pass){
    enact(b); S.termLaws=(S.termLaws||0)+1;
    addCap(12); shiftAll(0.9);
    S.presRel=clamp(S.presRel-8,0,100);
    S.vetoed=null;
    logMsg('Вето преодолено: «'+t.name+'» стал законом ('+res.yes+' из '+SEATS+').',1);
    chron('Собрание преодолело вето по «'+t.name.toLowerCase()+'».','g');
    sheetOpen({eye:'Преодоление вето · '+dateLabel(),title:'Вето преодолено',
      body:voteBar(res.yes,res.no)+
        `<p>Нужно было ${SUPER}, собрано ${res.yes}. Закон вступает в силу через голову президента — такое не забывают.</p>`,
      acts:[{label:'Закрыть'}]});
  } else {
    addCap(-6); shiftAll(-1);
    logMsg('Вето устояло: за преодоление '+res.yes+' при нужных '+SUPER+'.',1);
    if(v.tries>=2){ S.vetoed=null; chron('Закон окончательно похоронен вето.','b'); }
    sheetOpen({eye:'Преодоление вето · '+dateLabel(),title:'Вето устояло',
      body:voteBar(res.yes,res.no)+
        `<p>Нужно было ${SUPER}, собрано ${res.yes}.</p>`+
        (v.tries>=2?'<p class="hint">Две неудачные попытки подряд — проект снят с рассмотрения окончательно.</p>'
                   :'<p class="hint">Остаётся одна попытка. Между ними имеет смысл поработать с колеблющимися.</p>'),
      acts:[{label:'Закрыть'}]});
  }
  render();
}

/* ─── годовой бюджет ─────────────────────────────────────────── */
function submitBudget(){
  if(!isPM()){toast('Бюджет вносит правительство');return;}
  if(!budgetDue()){toast('Бюджет вносят в последнем квартале года');return;}
  if(S.budget.submitted){toast('Бюджет на этот год уже рассматривали');return;}
  if(!useAP(1)||!payCap(6))return;
  S.budget.submitted=true;
  const t=budgetTally();
  let yes=0,no=0;
  t.list.forEach(x=>{ if(x.st==='yes')yes++; else if(x.st==='no')no++;
    else { (Math.random()<0.5+x.v/30?yes++:no++); } });
  const pass=yes>no;
  if(pass){
    S.lastBudget=snapshotBudget(); S.budget.fails=0;
    addCap(8); shiftAll(0.8);
    coalition().filter(x=>x!==PL).forEach(id=>{ if(S.partners[id])S.partners[id].anger=Math.max(0,S.partners[id].anger-1); });
    logMsg('Бюджет на '+budgetYear()+' год принят ('+yes+' против '+no+').',1);
    chron('Собрание утвердило бюджет на '+budgetYear()+' год.','g');
  } else {
    S.budget.fails++;
    if(S.lastBudget){ S.tax={...S.lastBudget.tax}; S.spend={...S.lastBudget.spend}; }
    addCap(-10); shiftAll(-2); S.noConfCool=0;
    coalition().filter(x=>x!==PL).forEach(id=>{ if(S.partners[id])S.partners[id].anger=clamp(S.partners[id].anger+1,0,6); });
    logMsg('Бюджет на '+budgetYear()+' год провален ('+no+' против '+yes+'). Страна живёт по прошлогодним цифрам.',1);
    chron('Собрание отклонило бюджет на '+budgetYear()+' год.','b');
  }
  sheetOpen({eye:'Народное собрание · бюджет '+budgetYear(),title:pass?'Бюджет принят':'Бюджет провален',
    body:voteBar(yes,no)+`<div style="text-align:center;margin:14px 0 4px">
      <span class="stamp ${pass?'y':'n'}">${pass?'утверждён':'отклонён'}</span></div>`+
      (pass?'<p class="hint">Ставки и статьи закреплены на год. Менять их до следующего бюджета можно, но защищать придётся снова.</p>'
           :'<p>Ставки и статьи откатились к прошлогодним. Оппозиция получила повод для вотума недоверия'+
            (S.budget.fails>=2?', а второй провал подряд означает отставку кабинета.':'.')+'</p>'),
    acts:[{label:'Дальше'}]});
  if(!pass&&S.budget.fails>=2){
    logMsg('Второй провал бюджета подряд: правительство отправлено в отставку.',1);
    chron('Кабинет пал из-за бюджета.','b');
    fallGovernment();
  }
  render();
}
function budgetTick(){
  if(!isPM()){ S.budget.submitted=false; return; }
  if(budgetDue()&&!S.budget.submitted){
    S.budget.fails++;
    if(S.lastBudget){ S.tax={...S.lastBudget.tax}; S.spend={...S.lastBudget.spend}; }
    addCap(-8); shiftAll(-1.6); S.noConfCool=0;
    logMsg('Правительство не внесло бюджет на '+budgetYear()+' год: страна живёт по прошлогодним цифрам.',1);
    sheetOpen({eye:'Бюджетный кризис',title:'Бюджет не внесён',
      body:'<p>Год закончился, а проект бюджета так и не дошёл до Собрания. Ставки и статьи откатились к прошлогодним, оппозиция получила повод для вотума.</p>',
      acts:[{label:'Принять к сведению'}]});
  }
  if(budgetDue())S.budget.submitted=false;      // следующий год — новый проект
}

/* ═══ ПЕЧАТЬ ══════════════════════════════════════════════════════
   Издания пишут о том, что произошло на самом деле: заголовок
   собирается из события, а тон — из того, как издание к нему
   относится и как относится к вам. */
function head(o,text,kind){
  S.press.heads.unshift({q:S.q,o:o.id,t:text,k:kind||''});
  if(S.press.heads.length>40)S.press.heads.pop();
}
/* одно событие — пять разных заголовков */
function cover(ev){
  if(!S.press)return;
  PRESS.forEach(o=>{
    const st=pressOf(o.id); if(!st||st.banned)return;
    const view=ev.ax?pressView(o,ev.ax,ev.stance||0):0;
    const warm=(st.rel-50)/50;
    const good=view+warm>0.35, bad=view+warm<-0.35;
    const t=good?ev.good:bad?ev.bad:ev.flat;
    head(o,t,good?'hg':bad?'hb':'');
    // издание сдвигает своих читателей — тем сильнее, чем ему верят
    const k=(good?1:bad?-1:0)*pressTrust()*o.reach*2.2;
    if(k)o.base.forEach(g=>shiftMood(g,k,true));
    st.rel=clamp(st.rel+(good?0.8:bad?-0.8:0),0,100);
  });
}
function pressTick(){
  if(!S.press)return;
  const free=pressFree();
  PRESS.forEach(o=>{
    const st=pressOf(o.id); if(!st)return;
    if(st.banned){ st.rel=clamp(st.rel-1.5,0,100); return; }
    // отношение тянется к близости курса, а под надзором — к власти
    let want=clamp(56-axDist(o.st,me().st)*12,8,92);
    if(free<0)want=want*(1+free*-0.18)+(isPM()?12:-4)*(-free)*0.5;
    st.rel=clamp(st.rel+(want-st.rel)*0.12+rnd(-2,2),0,100);
  });
}
function pressTalk(id){
  const o=PRS(id), st=pressOf(id);
  if(st.banned){toast('Это издание с вами не разговаривает');return;}
  if(!useAP(1)||!payCap(PRESS_TALK))return;
  const k=hasTrait('orator')?1.5:1;
  st.rel=clamp(st.rel+ri(8,15)*k,0,100);
  o.base.forEach(g=>shiftMood(g,ri(1,3)*k,true));
  bumpRep('folk',0.6);
  head(o,'Интервью: «'+me().name+'» отвечает на вопросы','');
  logMsg('Интервью «'+o.name+'»: отношение издания выросло.');
  toast('Интервью вышло');
  render();
}
function pressLeak(pid){
  const p=P(pid);
  if(!useAP(1)||!payCap(PRESS_LEAK))return;
  const bite=ri(3,7);
  p.mom=clamp(p.mom-bite,-14,14);
  S.deputies.filter(d=>d.party===pid).forEach(d=>d.rel=clamp(d.rel-2,0,100));
  addTrail(ri(6,12),'утечка против «'+p.name+'»');
  bumpRep('honest',-3);
  const o=PRESS.slice().sort((a,b)=>pressOf(b.id).rel-pressOf(a.id).rel)[0];
  head(o,'Что скрывает «'+p.name+'»: документы в редакции','b');
  logMsg('Утечка против «'+p.name+'»: их разбор в печати.',1);
  toast('Материал вышел');
  render();
}
function pressBan(id){
  const o=PRS(id), st=pressOf(id);
  if(pressFree()>0){toast('При свободной печати издание не закрыть');return;}
  if(!useAP(1)||!payCap(PRESS_BAN))return;
  st.banned=true; st.rel=clamp(st.rel-30,0,100);
  PRESS.forEach(x=>{ if(x.id!==id)pressOf(x.id).rel=clamp(pressOf(x.id).rel-6,0,100); });
  shiftMood('intel',-5,true); shiftMood('urban',-3,true); shiftMood('youth',-3,true);
  bumpRep('honest',-8); bumpRep('firm',5);
  addTrail(ri(8,14),'отлучение «'+o.name+'»');
  career('Издание «'+o.name+'» лишено доступа.');
  logMsg('«'+o.name+'» лишено доступа к правительству. Остальные редакции насторожились.',1);
  chron('Власть закрыла доступ изданию «'+o.name+'».','b');
  render();
}
function askPress(){
  sheetOpen({eye:'Работа с печатью',title:'Что сделать',

/* ═══ КОНСТИТУЦИОННЫЙ СУД ═════════════════════════════════════════
   Судьи сидят дольше, чем правит любой президент, поэтому состав —
   это наследство. Суд отменяет то, что зашло дальше устройства. */
function judgeTick(){
  if(!S.court)return;
  const gone=S.court.filter(j=>S.q>=j.until);
  if(!gone.length)return;
  const j=gone[0];
  S.court=S.court.filter(x=>x!==j);
  const by=S.pres?S.pres.party:S.gov.lead;
  const cand=makeJudge(by,S.q);
  // Сенат утверждает: кресло пожизненное, и палата это знает
  const ok=confirmSenate('judge',cand,by);
  if(ok){
    S.court.push(cand);
    logMsg('В суд назначен '+cand.name+' ('+P(by).short+'), Сенат утвердил.',by===PL?0:1);
  } else {
    const alt=makeJudge(S.gov.lead===by?bigOpp().id:S.gov.lead,S.q);
    S.court.push(alt);
    logMsg('Сенат отклонил кандидатуру в суд. Кресло занял компромиссный судья '+alt.name+'.',1);
  }
  chron('Смена в Конституционном суде.','');
}
/* запрос в суд: оспорить действующий закон или указ */
function petition(topic){
  const law=lawOn(topic); if(!law){toast('По этой теме ничего не действует');return;}
  if(!useAP(1)||!payCap(PETITION))return;
  const n=courtStrike(law), t=T(topic);
  S.court.forEach(j=>{});
  if(n>=COURT_MAJ){
    S.laws=S.laws.filter(l=>l!==law);
    addCap(law.by===PL?-6:10);
    if(law.by!==PL)bumpRep('comp',2);
    logMsg('Конституционный суд отменил «'+t.name+'»: '+n+' голосов из '+COURT_SIZE+'.',1);
    chron('Суд отменил закон «'+t.name.toLowerCase()+'».',law.by===PL?'b':'g');
    cover({ax:t.ax,stance:law.stance,
      good:'Суд остановил «'+t.name.toLowerCase()+'»: закон отменён',
      bad:'Суд отменил «'+t.name.toLowerCase()+'» — власть теряет опору',
      flat:'Конституционный суд отменил «'+t.name.toLowerCase()+'»'});
  } else {
    addCap(-4);
    logMsg('Суд не нашёл нарушения в «'+t.name+'»: за отмену '+n+' из '+COURT_SIZE+'.');
  }
  sheetOpen({eye:'Конституционный суд · '+dateLabel(),title:n>=COURT_MAJ?'Закон отменён':'Закон устоял',
    body:voteBar(n,COURT_SIZE-n)+
      `<p>За отмену ${n} судей из ${COURT_SIZE}, нужно ${COURT_MAJ}.</p>
       <div class="res"><span>Оспаривался</span><b class="w">${t.name}</b>
         <span>Автор</span><b class="w">${P(law.by).name}</b>
         <span>Вид</span><b class="w">${law.decree?'указ':'закон'}</b>
         <span>Независимость суда</span><b class="w">${courtFree()>0?'высокая':courtFree()<0?'низкая':'обычная'}</b></div>`,
    acts:[{label:'Закрыть'}]});
  render();
}
function askPetition(){
  const list=S.laws.filter(l=>T(l.topic));
  if(!list.length){toast('Оспаривать нечего');return;}
  sheetOpen({eye:'Запрос в суд · '+PETITION+' веса',title:'Что оспорить',
    body:'<p class="lead">Суд смотрит не на пользу закона, а на то, как далеко он зашёл. Указы отменяют охотнее законов.</p>',
    opts:list.map(l=>{const n=courtStrike(l);
      return {label:l.name+(l.decree?' (указ)':''),
        hint:'автор '+P(l.by).short+' · '+STEP[l.stance+2]+' · прогноз отмены '+n+' из '+COURT_SIZE,
        fn:()=>petition(l.topic)};})});
}

/* ═══ УТВЕРЖДЕНИЕ СЕНАТОМ ═════════════════════════════════════════
   Палата подтверждает кадры. Голосование идёт молча и попадает
   в журнал; лист открывается только если Сенат отказал. */
function confirmSenate(kind,who,byParty){
  if(!S.senate||!S.senate.length)return true;
  const c=CONFIRM[kind]||{name:'назначение',cost:3};
  let yes=0,no=0;
  S.senate.forEach(s=>{
    let v=(s.party===byParty?24:inCoal(s.party)?10:-14);
    v+=(s.rel-50)*0.22;
    if(who&&who.st)v+=(1.4-axDist(who.st,P(s.party).st))*10;
    // старейшина взвешивает кадровый вопрос строже: он этих людей переживёт
    if(senRank(s)>=4)v+=(s.party===byParty?4:-5);
    v+=noise(s.id+'conf'+kind+S.q,12);
    (v>0?yes++:no++);
  });
  // лидер большинства ведёт и кадровые голосования
  if(S.senLead){ const f=(leadFavour()-50)/50; const n=Math.round(f*4);
    if(S.senLead.party===byParty||inCoal(S.senLead.party)){ yes+=Math.max(0,n); no-=Math.max(0,n); }
    else { yes+=Math.min(0,n); no-=Math.min(0,n); } }
  yes=clamp(yes,0,SEN_SEATS); no=SEN_SEATS-yes;
  // председатель уговаривает так же, как и по законам
  const m=vpMargin(), gap=no-yes;
  if(S.vp&&gap>0&&gap<=m&&(S.vp.party===byParty||inCoal(S.vp.party))){ yes+=gap; no-=gap; }
  if(yes===no&&S.vp){ (S.vp.party===byParty?yes++:no++); S.vp.ties=(S.vp.ties||0)+1; }
  const ok=yes>=SEN_MAJ;
  logMsg('Сенат '+(ok?'утвердил':'отклонил')+' '+c.name+(who&&who.name?' — '+who.name:'')+
    ' ('+yes+':'+no+').',ok?0:1);
  if(!ok)addCap(-c.cost);
  return ok;
}

/* ═══ РАБОТА С ПАЛАТОЙ ════════════════════════════════════════════
   Сенаторов вдвое меньше депутатов, и каждый весит вчетверо: сотня
   человек решает судьбу всего, что прошло Собрание. Поэтому здесь
   работают не с фракциями, а с людьми и с их субъектами. */
function senLobby(senId,kind){
  const s=S.senate.find(x=>x.id===senId), l=SENLOB.find(x=>x.id===kind);
  if(!s||!l)return;
  if(!useAP(1))return;
  if(l.cap&&!payCap(capCost(l.cap,'lobby'))){S.ap++;return;}
  if(l.gold&&!payGold(l.gold)){S.ap++;return;}
  s.deals++;
  if(kind==='talk'){
    // старейшину уговаривать труднее: он пересидел четверых на вашем месте
    const g=senElder(s)?ri(4,9):ri(7,14);
    s.rel=clamp(s.rel+g,0,100); s.note='беседовал с вами';
    if(S.vp&&S.vp.job==='senate')s.rel=clamp(s.rel+Math.round(vpSkill()*0.05),0,100);
  }
  if(kind==='proj'){
    s.rel=clamp(s.rel+ri(13,22),0,100); s.note='получил стройку в субъект';
    S.rmod[s.region]=clamp(S.rmod[s.region]+2.4,-22,22);
    S.unrest[s.region]=clamp(S.unrest[s.region]-ri(2,5),0,100);
    // земляки по делегации замечают, кому досталось
    S.senate.filter(x=>x.region===s.region&&x.id!==s.id).forEach(x=>x.rel=clamp(x.rel+3,0,100));
    addTrail(s.integ*0.1,'стройка в субъекте '+s.name);
  }
  if(kind==='comm'){
    s.rel=clamp(s.rel+ri(16,26),0,100); s.note='возглавил комитет палаты';
    const mate=S.senate.filter(x=>x.party===s.party&&x.id!==s.id&&senRank(x)>=senRank(s));
    if(mate.length){ const m=pick(mate); m.rel=clamp(m.rel-ri(6,12),0,100); m.note='обойдён по старшинству'; }
    addTrail(3,'комитет для '+s.name);
  }
  if(kind==='join'){
    const from=s.party;
    const ch=clamp((s.rel-60)/56+(70-s.loyal)/160-senRank(s)*0.04,0.06,0.72);
    if(Math.random()<ch){
      s.party=PL; s.rel=clamp(s.rel+5,0,100); s.loyal=ri(52,78); s.note='перешёл к вам';
      S.senSeats[from]--; S.senSeats[PL]=(S.senSeats[PL]||0)+1;
      S.senate.filter(x=>x.party===from).forEach(x=>x.rel=clamp(x.rel-5,0,100));
      if(S.partners[from])S.partners[from].anger=clamp(S.partners[from].anger+1.5,0,6);
      addTrail(ri(5,10),'переход сенатора '+s.name);
      seatSenLeader();
      logMsg('Сенатор '+s.name+' перешёл из «'+P(from).name+'» в вашу фракцию.',1);
      chron('Сенатор '+s.name+' сменил фракцию на вашу.','g');
    } else {
      s.rel=clamp(s.rel-14,0,100); s.note='отказал вам';
      logMsg('Сенатор '+s.name+' отказался переходить.',1);
    }
    render(); return;
  }
  logMsg('Работа с сенатором: '+s.name+' ('+P(s.party).short+'), отношение '+Math.round(s.rel)+'.');
  toast('Отношение: '+Math.round(s.rel));
  render();
}

/* ═══ ВИЦЕ-ПРЕЗИДЕНТ ══════════════════════════════════════════════
   Второе кресло страны и первое по бесполезности — ровно до того
   дня, когда оно становится первым во всём. Между этими днями вице
   ведёт порученное дело или тихо копит обиду. */

/* поручение работает каждый квартал и тем сильнее, чем он способнее */
function vpTick(){
  const v=S.vp; if(!v)return;
  const k=vpSkill()/100, own=v.party===PL||inCoal(v.party);
  if(v.job==='senate'&&own){
    const pool=S.senate.filter(s=>s.party===v.party||inCoal(s.party)||s.rel>44);
    pool.forEach(s=>{ if(Math.random()<0.3)s.rel=clamp(s.rel+1+k*2,0,100); });
    if(S.senLead&&(S.senLead.party===v.party||inCoal(S.senLead.party)))
      S.senLead.favour=clamp((S.senLead.favour||0)+0.8,-40,40);
  }
  if(v.job==='region'&&own){
    const worst=REGIONS.slice().sort((a,b)=>(S.unrest[b.id]||0)-(S.unrest[a.id]||0)).slice(0,2);
    worst.forEach(r=>S.unrest[r.id]=clamp(S.unrest[r.id]-(1.2+k*2.2),0,100));
    if(v.region)S.rmod[v.region]=clamp(S.rmod[v.region]+0.4,-22,22);
  }
  if(v.job==='world'&&own&&S.nb){
    Object.values(S.nb).forEach(n=>{ n.rel=clamp(n.rel+0.5+k*1.1,0,100); });
  }
  if(v.job==='party'&&own){
    S.deputies.filter(d=>d.party===PL).forEach(d=>{ if(Math.random()<0.22)d.rel=clamp(d.rel+1,0,100); });
    S.funds=r1(S.funds+1.5+(v.pop||40)*0.05);
  }
  // известный вице подтягивает и вас, если он ваш
  if(own&&v.pop>=60&&Math.random()<0.2)shiftAll(0.25);
  // честолюбие: без дела оно растёт, с делом — гаснет
  v.amb=clamp((v.amb||40)+((v.job||'none')==='none'?0.9:-0.45),0,100);
  if(vpRestless()){ v.restless=(v.restless||0)+1; if(v.restless>=4&&Math.random()<0.3)vpRevolt(); }
  else v.restless=0;
}
/* вице, которому нечего делать, начинает делать себе имя */
function vpRevolt(){
  const v=S.vp; v.restless=0;
  const own=v.party===PL;
  v.amb=clamp(v.amb+4,0,100);
  if(own){
    shiftAll(-0.8); S.deputies.filter(d=>d.party===PL).forEach(d=>{ if(Math.random()<0.3)d.rel=clamp(d.rel-3,0,100); });
    bumpRep('firm',-3);
    logMsg('Вице-президент '+v.name+' выступил со своей программой, не согласовав её с вами.',1);
    chron('Вице-президент повёл свою игру.','b');
    sheetOpen({eye:'Второе кресло',title:'Вице-президент заговорил сам',
      body:`<p class="lead">${v.name} дал большое интервью и изложил взгляды, которые расходятся с вашими
          в мелочах и совпадают в главном — ровно так, как говорят те, кто готовится наследовать.</p>
        <div class="res"><span>Честолюбие</span><b class="bad">${Math.round(v.amb)}</b>
          <span>Известность</span><b>${Math.round(v.pop)}</b>
          <span>Поручение</span><b class="w">${vpJob().name}</b></div>
        <p class="hint">Занятому вице некогда собирать сторонников. Свободному — некуда девать время.</p>`,
      opts:[
        {label:'Дать ему дело',hint:'выбрать поручение',fn:()=>askVPJob(true)},
        {label:'Оставить как есть',hint:'пусть говорит',fn(){}}]});
  } else {
    S.presRel=clamp(S.presRel+ri(2,6),0,100);
    logMsg('Вице-президент '+v.name+' публично разошёлся с президентом.',1);
    chron('Раскол в паре президент — вице.','');
  }
}

  if(v.party!==PL&&!inCoal(v.party)){toast('Поручения вице даёт его президент, не вы');return;}

/* снять напарника со списка: дорого, обидно и не всегда помогает */
function dropVP(){
  const v=S.vp; if(!v){toast('Кресло и так пусто');return;}
  if(v.party!==PL){toast('Это не ваш вице-президент');return;}
  if(!useAP(1)||!payCap(VP_DROP))return;
  const old=v.name;
  const fresh=makeVP(PL);
  if(!confirmSenate('vp',fresh,PL)){
    logMsg('Сенат не утвердил нового вице-президента. '+old+' остаётся в кресле.',1);
    v.amb=clamp(v.amb+10,0,100);
    toast('Сенат отклонил замену'); render(); return;
  }
  fresh.dropped=(v.dropped||0)+1;
  S.vp=fresh;
  shiftAll(-0.6); bumpRep('firm',3); bumpRep('honest',-2);
  logMsg('Вице-президент сменён: вместо '+old+' — '+fresh.name+'.',1);
  chron('Смена вице-президента.','');
  render();
}
/* кресло вице пустеет отдельно от президентского */
function vpVacancy(){
  const v=S.vp; if(!v)return;
  if(S.q-(v.since||0)<6)return;
  const risk=0.008+(v.amb>=VP_AMB?0.008:0);
  if(Math.random()>=risk)return;
  const old=v.name, party=v.party;
  const cand=makeVP(party);
  const ok=confirmSenate('vp',cand,party);
  S.vp=ok?cand:null;
  logMsg('Вице-президент '+old+' оставил пост. '+(ok?'Палата утвердила '+cand.name+'.':'Кресло осталось пустым.'),1);
  chron('Смена вице-президента.','');
  sheetOpen({eye:'Второе кресло',title:'Вице-президент ушёл',
    body:`<p class="lead">${old} прекратил полномочия. Президент вносит новую кандидатуру, и утверждает её Сенат —
        та самая палата, которой вице потом будет председательствовать.</p>
      ${ok?`<div class="res"><span>Новый вице</span><b class="w">${cand.name}</b>
          <span>Тип</span><b class="w">${(VP_KIND.find(k=>k.id===cand.kind)||{}).name}</b>
          <span>Палата</span><b>${cand.sen}</b><span>Честолюбие</span><b>${cand.amb}</b></div>`

/* напарник по списку: выбор перед выборами, если идёте вы */

/* прибавка списку от напарника: свой край и своё имя */
function mateBonus(pid){
  if(pid!==PL||!S.mate)return 0;
  return r2(0.4+(S.mate.pop-40)*0.02);

/* ═══ НАДЗОР ══════════════════════════════════════════════════════
   След копится сам, дело заводят не сразу и не всегда. */
function probeTick(){
  if(S.probe){                                  // дело уже идёт
    S.probe.left--;
    if(S.probe.left<=0)probeVerdict();
    return;
  }
  if(Math.random()>probeRisk())return;
  const targets=[];
  if(isPM())POSTS.forEach(x=>targets.push({k:'министр',name:minOf(x.id).name,post:x.id}));
  REGIONS.forEach(r=>{const g=govOf(r.id); if(g&&(g.party===PL||inCoal(g.party)))
    targets.push({k:'глава края',name:g.name,region:r.id});});
  targets.push({k:'ваше окружение',name:S.you.name});
  const t=pick(targets);
  S.probe={...t,q:S.q,left:2,buried:false};
  logMsg('Прокуратура начала проверку: '+t.k+' '+t.name+'.',1);
  cover({good:'Проверка в правительстве: власть не мешает следствию',
    bad:'Прокуратура пришла к своим: '+t.k+' под проверкой',
    flat:'Начата проверка: '+t.k+' '+t.name});
  sheetOpen({eye:'Надзор · '+dateLabel(),title:'Начата проверка',
    body:`<p class="lead">Прокуратура взялась за ${t.k}а — ${t.name}. Через два квартала будет результат.</p>
      <div class="res"><span>След от сделок</span><b class="${trail()>55?'bad':''}">${Math.round(trail())} · ${trailWord()}</b>
        <span>Независимость надзора</span><b>${r1(prosFree())}</b></div>
      <p class="hint">Дело можно свернуть, пока оно идёт, — но это стоит веса, пачкает честность
        и добавляет к следу вдвое больше, чем сняло.</p>`,
    acts:[{label:'Принять к сведению'}]});
}
function probeVerdict(){
  const pr=S.probe; if(!pr)return;
  const guilty=Math.random()<clamp(trail()/120+0.18,0.15,0.85);
  S.probe=null;
  if(!guilty){
    addTrail(-8);
    bumpRep('honest',3);
    logMsg('Проверка окончена: нарушений не нашли.',1);
    cover({good:'Проверка ничего не нашла: обвинения не подтвердились',
      bad:'Проверка свёрнута без выводов — вопросы остались',
      flat:'Проверка завершена без последствий'});
    return;
  }
  addTrail(-16);
  bumpRep('honest',-11); bumpRep('comp',-3);
  shiftAll(-3);
  addCap(-9);
  if(pr.post&&isPM()){ S.ministers[pr.post]=makeMinister(pr.post,minOf(pr.post).party);
    logMsg('Министр отправлен в отставку по итогам проверки.',1); }
  if(pr.region){ const g=govOf(pr.region); if(g)g.rel=clamp(g.rel-22,0,100); }
  career('Скандал: '+pr.k+' '+pr.name+' под следствием.');
  chron('Коррупционный скандал: '+pr.k+' '+pr.name+'.','b');
  cover({good:'Власть сама вычистила своих: виновный отстранён',
    bad:'Скандал: '+pr.k+' '+pr.name+' попался',
    flat:'По итогам проверки '+pr.k+' '+pr.name+' отстранён'});
  sheetOpen({eye:'Надзор · приговор',title:'Скандал',
    body:`<p class="lead">Проверка подтвердилась. ${pr.k[0].toUpperCase()+pr.k.slice(1)} ${pr.name} отстранён.</p>
      <p>Честность просела, страна недовольна, политический вес потерян. След от прошлых сделок
        уменьшился — часть его сгорела в этом деле.</p>`,
    acts:[{label:'Принять'}]});
}
function buryProbe(){
