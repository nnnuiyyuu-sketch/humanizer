<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>КАБИНЕТ — Республика Новария</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBEEE7; --surface:#FFFFFF; --surface2:#F5F7F1;
  --ink:#161A15; --ink2:#5C6459; --ink3:#8E968A;
  --line:#DBDFD3; --line2:#EAEDE4;
  --pnv:#B07A16; --pos:#2E7D4F; --neg:#B3352A;
  --sea:#101A2E;
  --shadow:0 1px 2px rgba(22,26,21,.05), 0 8px 24px -14px rgba(22,26,21,.22);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body.opp{--pnv:#8C3B2E}
body{background:var(--bg);color:var(--ink);font-family:'Golos Text',system-ui,sans-serif;font-size:15px;line-height:1.45;min-height:100vh;overscroll-behavior-y:none}
.num{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;font-weight:600}

#app{max-width:660px;margin:0 auto;padding:0 14px calc(96px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px}
.brandbox{display:flex;align-items:center;gap:9px;min-width:0}
.flag{width:34px;height:22px;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.28);flex:none}
.emblem{width:74px;height:80px;display:block;margin:0 auto 8px}
.emblem.big{width:96px;height:104px}
.wordmark{font-family:'Unbounded',sans-serif;font-weight:800;font-size:16px;letter-spacing:.02em;margin:0;line-height:1.1}
.wordmark span{color:var(--pnv)}
.wordmark small{display:block;font-family:'Golos Text';font-weight:500;font-size:10.5px;color:var(--ink3);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.topmeta{display:flex;align-items:center;gap:8px}
.season{font-size:11.5px;color:var(--ink2);text-align:right;line-height:1.25}
.season b{display:block;color:var(--ink);font-size:12.5px}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.iconbtn:active{transform:translateY(1px)}

.power{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px 12px;box-shadow:var(--shadow);margin-bottom:10px}
.pw-row+.pw-row{margin-top:9px}
.pw-head{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--ink2);margin-bottom:5px}
.ribbon{position:relative;height:9px;border-radius:5px;overflow:hidden;display:flex;background:var(--line2)}
.ribbon i{display:block;height:100%}
.ribbon .mark{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.75;border-radius:1px}
.maj.ok{color:var(--pos);font-weight:600}
.maj.no{color:var(--neg);font-weight:600}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px;margin-bottom:10px}
.card.gov{background:linear-gradient(180deg,#FBF6EE,#F7F8F4);border-color:#E6DFC8}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px;box-shadow:var(--shadow)}
.stat .k{font-size:10.5px;color:var(--ink2);white-space:nowrap}
.stat .v{font-size:18px;margin-top:1px;letter-spacing:-.02em}
.stat .v u{text-decoration:none;font-size:11px;font-family:'Golos Text';font-weight:500;color:var(--ink2)}
.stat .d{font-size:10.5px;color:var(--ink3)}
.stat.alert{border-color:#E8C4BF;background:#FDF4F2}
.stat.alert .v{color:var(--neg)}
.pips{display:flex;gap:3px;margin-top:6px}
.pip{width:100%;height:5px;border-radius:3px;background:var(--line2)}
.pip.on{background:var(--pnv)}

.termbar{display:flex;gap:3px;margin-bottom:11px}
.tseg{flex:1;height:6px;border-radius:3px;background:var(--line2);position:relative}
.tseg.past{background:var(--ink3)}
.tseg.now{background:var(--pnv)}
.tseg[data-m]::after{content:'';position:absolute;left:15%;right:15%;bottom:-5px;height:2px;border-radius:1px;background:var(--ink2)}
.termlabels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3);margin-bottom:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:18px 2px 9px}
.sec h2{font-size:13px;font-weight:600;margin:0}
.sec .note{font-size:11.5px;color:var(--ink3)}
.lead{font-size:13px;color:var(--ink2);margin:0 0 2px}
.hint{font-size:12px;color:var(--ink3);margin:8px 0 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.kv:last-child{border-bottom:none}
.pos{color:var(--pos)} .neg{color:var(--neg)}

.advice{background:#F4F1E6;border:1px solid #E6DFC8;border-radius:var(--r);padding:12px 13px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start}
.advice .dot{width:7px;height:7px;border-radius:50%;background:var(--pnv);margin-top:6px;flex:none}
.advice b{font-size:12px;display:block;color:var(--ink2);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.advice p{margin:2px 0 0;font-size:13.5px}

.act{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line2)}
.act:last-child{border-bottom:none}
.act .txt{flex:1;min-width:0}
.act .txt b{font-size:14px;font-weight:600;display:block}
.act .txt span{font-size:12px;color:var(--ink2);display:block;margin-top:1px}
.act .cost{font-size:11.5px;color:var(--ink3);margin-top:3px;display:block}

.btn{font-family:'Golos Text',sans-serif;font-size:13.5px;font-weight:600;background:var(--ink);color:#F7F9F4;border:1px solid var(--ink);border-radius:10px;padding:9px 15px;cursor:pointer;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn[disabled]{background:var(--surface2);color:var(--ink3);border-color:var(--line);cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost[disabled]{color:var(--ink3)}
.btn.wide{width:100%;padding:14px;font-size:15px;border-radius:12px}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.btn.on{background:var(--pnv);border-color:var(--pnv);color:#fff}
.btn:focus-visible{outline:2px solid var(--pnv);outline-offset:2px}
.btnrow{display:flex;gap:7px;flex-wrap:wrap}

.pchip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px}
.pchip i{width:9px;height:9px;border-radius:3px;flex:none}
.prow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.prow:last-child{border-bottom:none}
.prow .pname{flex:1;min-width:0}
.prow .pname b{font-size:13.5px;font-weight:600;display:block}
.prow .pname span{font-size:11.5px;color:var(--ink3)}
.meter{width:76px;height:6px;border-radius:3px;background:var(--line2);overflow:hidden;flex:none}
.meter i{display:block;height:100%}
.tagline{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.tg{font-size:10px;letter-spacing:.03em;text-transform:uppercase;border-radius:5px;padding:2px 6px;font-weight:600}
.tg.coal{background:#E7F1EA;color:var(--pos)}
.tg.split{background:#FBEBE9;color:var(--neg)}
.tg.prog{background:#F4EFE0;color:var(--pnv)}
.tg.unrest{background:#FBEBE9;color:var(--neg)}

/* карта */
.mapwrap{background:var(--sea);border-radius:var(--r);padding:6px;overflow:hidden;position:relative}
.mapsvg{width:100%;display:block;touch-action:manipulation}
.rgn{cursor:pointer;stroke:#0B1220;stroke-width:1.6;stroke-linejoin:round;transition:filter .15s}
.rgn:hover{filter:brightness(1.15)}
.rgn.sel{stroke:#fff;stroke-width:3}
.cap{fill:#fff;pointer-events:none}
.caplbl{fill:#fff;font:600 17px 'Golos Text',sans-serif;pointer-events:none;paint-order:stroke;stroke:rgba(11,18,32,.9);stroke-width:4px;stroke-linejoin:round}
.modebar{display:flex;gap:6px;overflow-x:auto;margin:10px 0 0;scrollbar-width:none}
.modebar::-webkit-scrollbar{display:none}
.scale{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink3);margin-top:9px;flex-wrap:wrap}
.scale i{width:14px;height:9px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:-1px}

.axis{margin:2px 0 14px}
.axis .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-bottom:6px}
.axis .steps{display:flex;gap:4px}
.axis .steps button{flex:1;height:34px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;cursor:pointer;font:600 11px 'Golos Text';color:var(--ink3);padding:0}
.axis .steps button.on{background:var(--pnv);border-color:var(--pnv);color:#fff}
.axis .now{font-size:12.5px;color:var(--ink2);margin-top:6px;text-align:center}
.blocrow{padding:11px 0;border-bottom:1px solid var(--line2)}
.btop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.btop b{font-size:14.5px;font-weight:600}
.bval{font-size:15px;white-space:nowrap}
.bsub{font-size:11.5px;color:var(--ink3);margin-top:1px}
.bbot{display:flex;align-items:center;gap:7px;margin-top:8px;flex-wrap:wrap}
.blocrow:last-child{border-bottom:none}

.wt{font:600 10px 'JetBrains Mono';color:var(--ink3);background:var(--surface2);border:1px solid var(--line2);border-radius:5px;padding:1px 5px}
.hemi{width:100%;display:block}
.seat.anim{opacity:0;animation:seatin .28s ease forwards}
@keyframes seatin{to{opacity:1}}
.tally{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 6px;font-size:13px}
.tally .y{color:var(--pos);font-weight:700}
.tally .n{color:var(--neg);font-weight:700}
.votebar{position:relative;height:10px;border-radius:5px;background:var(--line2);overflow:hidden;display:flex}
.votebar i{height:100%}
.votebar .thr{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
.thrlabel{font-size:10.5px;color:var(--ink3);text-align:center;margin-top:5px}

.bill{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.bill .edge{height:3px;width:100%}
.bill .in{padding:13px 14px 14px}
.bill h3{margin:0;font-size:15px;font-weight:600}
.bill .desc{font-size:12.5px;color:var(--ink2);margin:5px 0 9px}
.efftags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.eff{font-size:11.5px;border-radius:6px;padding:3px 7px;background:var(--surface2);border:1px solid var(--line2)}
.eff.p{color:var(--pos)} .eff.m{color:var(--neg)}
.odds{display:grid;grid-template-columns:auto 1fr auto;gap:5px 8px;align-items:center;font-size:11.5px;color:var(--ink2);margin-bottom:11px}
.odds .obar{height:5px;border-radius:3px;background:var(--line2);overflow:hidden;position:relative}
.odds .obar i{display:block;height:100%;background:var(--ink2)}
.odds .obar::after{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;width:1.5px;background:var(--ink);opacity:.55}
.stanceline{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:11px}
.st{font-size:11px;border-radius:6px;padding:2px 7px;border:1px solid var(--line);display:inline-flex;gap:5px;align-items:center}
.st i{width:7px;height:7px;border-radius:2px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.93);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(7,1fr);padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
.navbtn{background:none;border:none;cursor:pointer;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font:500 10px 'Golos Text',sans-serif;border-radius:10px}
.navbtn.on{color:var(--ink)}
.navbtn.on svg{color:var(--pnv)}

#scrim{position:fixed;inset:0;background:rgba(20,24,19,.45);z-index:40;display:none;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
#scrim.show{display:flex}
.sheet{background:var(--surface);border-radius:20px;max-width:520px;width:100%;padding:20px;box-shadow:0 30px 80px -20px rgba(20,24,19,.5);animation:rise .22s cubic-bezier(.2,.8,.3,1);max-height:92vh;overflow-y:auto}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.sheet .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.sheet h2{font-family:'Unbounded',sans-serif;font-weight:600;font-size:19px;line-height:1.2;margin:5px 0 10px}
.sheet p{font-size:14px;margin:0 0 9px}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.sheet textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:10px;font:12px 'JetBrains Mono',monospace;resize:vertical;background:var(--surface2);color:var(--ink)}
.picks{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.verdict{font-family:'Unbounded',sans-serif;font-weight:800;font-size:15px;letter-spacing:.06em;text-align:center;padding:11px;border-radius:12px;margin-top:14px}
.verdict.yes{background:#E7F1EA;color:var(--pos)}
.verdict.no{background:#FBEBE9;color:var(--neg)}
.result{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:13.5px;margin:10px 0}
.result b{font-family:'JetBrains Mono',monospace;text-align:right;font-weight:600}
.result b.w{font-family:'Golos Text';font-weight:600}
.rank{text-align:center;font-family:'Unbounded',sans-serif;font-weight:600;font-size:16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line2)}
.logline{padding:9px 0;border-bottom:1px solid var(--line2);font-size:13px}
.logline .t{font-size:10.5px;color:var(--ink3);display:block}

.sparkbox{padding:10px 0;border-bottom:1px solid var(--line2)}
.sparkbox:last-child{border-bottom:none}
.sparkhead{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink2)}
.sparkhead b{font-size:14px;color:var(--ink)}
.spark{width:100%;height:64px;display:block;margin-top:4px;overflow:visible}
.sparkfoot{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3)}
.chron{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px}
.chron:last-child{border-bottom:none}
.chron .cy{color:var(--ink3);font-size:11.5px;flex:none;width:38px;padding-top:1px}
.chron.good{color:var(--pos)}
.chron.bad{color:var(--neg)}

#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));z-index:35;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:90vw}
.toast{background:var(--ink);color:#F7F9F4;border-radius:10px;padding:8px 14px;font-size:12.5px;font-weight:500;box-shadow:var(--shadow);animation:tin .2s ease, tout .35s ease 2.3s forwards}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet,.toast,.seat.anim{animation:none;opacity:1}}
@media(max-width:400px){.stats{grid-template-columns:repeat(3,1fr)}.stat .v{font-size:16px}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brandbox">
      <img class="flag" id="flagimg" alt="Флаг Республики Новария">
      <h1 class="wordmark">КАБИНЕТ<span>.</span><small>Республика Новария</small></h1>
    </div>
    <div class="topmeta">
      <div class="season" id="season"></div>
      <button class="iconbtn" id="logbtn" aria-label="Журнал">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h6"/></svg>
      </button>
    </div>
  </div>
  <div id="power"></div>
  <div id="stats" class="stats"></div>
  <div class="termbar" id="termbar"></div>
  <div class="termlabels" id="termlabels"></div>
  <div id="view"></div>
</div>
<nav class="nav" id="nav"></nav>
<div id="scrim"></div>
<div id="toasts"></div>
<script>

/* Мандаты распределяются по населению методом наибольших остатков и
   пересматриваются на каждых выборах: регион, куда едут люди, получает больше. */

function apportion(total,base){
  const tp=totalPop(), out={}, rem=[]; let used=0;
  REGIONS.forEach(r=>{ const ex=base+(total-base*REGIONS.length)*popOf(r.id)/tp;
    out[r.id]=Math.floor(ex); used+=out[r.id]; rem.push([r.id,ex-Math.floor(ex)]); });
  rem.sort((a,b)=>b[1]-a[1]);
  for(let i=0;used<total;i++,used++) out[rem[i%rem.length][0]]++;
  return out;
}

function econTick(){
  const e=S.econ;
  const taxPress=[1.0,0,-1.1][S.taxes];                  // низкие налоги разгоняют вложения
  const lawInv=S.lawsPassed.includes('dereg')?1.2:0;
  const lawEco=S.lawsPassed.includes('eco')?-0.5:0;
  const stab=(S.stability-50)*0.03;
  const ind=S.industries.reduce((a,x)=>a+x.level,0);
  // инвестиции реагируют быстро, ВВП — с задержкой в сезон
  e.invest=clamp(e.invest+taxPress*1.6+lawInv+lawEco+stab+ind*0.25-e.infl*0.20+rnd(-1.2,1.2),40,200);
  const growth=((e.invest-100)*0.035+ind*0.10+(50-e.unemp*4)*0.01-e.infl*0.07+rnd(-0.35,0.35))/100;
  e.gdp=Math.max(40,r1(e.gdp*(1+growth)));
  // безработица тянется к равновесию, зависящему от роста и отраслей
  const uEq=8.2-growth*100*0.55-ind*0.32+(S.taxes===2?0.5:0);
  e.unemp=r1(clamp(e.unemp+(uEq-e.unemp)*0.28+rnd(-0.25,0.25),1.5,26));
  // инфляция: дефицит бюджета и долг разгоняют цены, высокие налоги гасят
  const inc=incomeBreakdown();
  const deficit=Math.max(0,-inc.net);
  const iEq=2.4+deficit*0.06+Math.max(0,debtRatio()-45)*0.05+(S.taxes===0?1.4:S.taxes===2?-0.7:0)+(e.invest-100)*0.012;
  e.infl=r1(clamp(e.infl+(iEq-e.infl)*0.32+rnd(-0.3,0.3),0,40));
  // долг: дефицит уходит в долг, профицит гасит
  e.debt=Math.max(0,r1(e.debt+deficit*0.55-Math.max(0,inc.net)*0.30+e.debt*e.infl*0.0006));
  // обратная связь на людей
  shiftBloc('work',(6.5-e.unemp)*0.16,false);
  shiftBloc('urban',((e.gdp/e.gdp0-1)*100*0.10-(e.infl-5)*0.12),false);
  shiftBloc('agr',-(e.infl-5)*0.12,false);
  shiftBloc('intel',((e.gdp/e.gdp0-1)*100*0.04),false);
  shiftApproval(-Math.max(0,e.infl-7)*0.10-Math.max(0,e.unemp-9)*0.09);
  if(debtRatio()>70&&Math.random()<0.25){ S.treasury-=14;
    logMsg('Обслуживание госдолга съело 14 млрд: долг '+debtRatio()+'% ВВП.'); }
  // стройка идёт на деньги промышленности: без вложений в отрасль дорог не будет
  const indLvl=S.industries.find(x=>x.id==='ind').level;
  e.rail=Math.round(e.rail+indLvl*22+(growth>0?8:2));
  // те же цифры под именами, которыми пользуются экраны экономики и летописи
  e.inf=e.infl; e.growth=r1(growth*100);
  REGIONS.forEach(r=>{ const q=rs(r.id);
    q.unrest=clamp(q.unrest+Math.max(0,e.unemp-8)*0.10+Math.max(0,e.infl-7)*0.08-0.2,0,100); });
}

/* ─────────── распределение Народной палаты ─────────── */
/* Каждый регион шлёт свою делегацию: места делятся по поддержке президента
   и по отношениям остальных фракций, с бонусом партии губернатора. */

function regionDelegation(r,seatsCount,govBonus){
  const q=rs(r.id), out={};
  const N=seatsCount!==undefined?seatsCount:seatsOf(r.id);
  const w={};
  const sup=support(r.id);
  w[PLAYER]=Math.max(3,sup);
  PARTIES.filter(p=>p.id!==PLAYER).forEach(p=>{
    let v=Math.max(3,(100-sup)*0.34+((S.relations[p.id]??50)-50)*0.35);
    if(blocAffinity(p.id,r.id))v*=1.2;
    if(p.id===q.gov.party) v*=1.5;
    if(sectorAffinity(p.id,r.sector)) v*=1.25;
    if(S.discipline[p.id]<0.8) v*=0.85;
    w[p.id]=v;
  });
  const sum=PARTIES.reduce((s,p)=>s+w[p.id],0);
  let used=0;
  const rem=[];
  PARTIES.forEach(p=>{ const ex=N*w[p.id]/sum; const n=Math.floor(ex);
    out[p.id]=n; used+=n; rem.push([p.id,ex-n]); });
  rem.sort((a,b)=>b[1]-a[1]);
  for(let i=0;used<N;i++,used++) out[rem[i%rem.length][0]]++;
  return out;
}
/* Сенат: та же логика, но партия губернатора имеет вдвое больший вес —
   верхняя палата всегда консервативнее нижней. */

const PARTY_BLOC={trud:'work',zev:'agr',svk:'urban',derzh:'patr',pnv:null};

function allocateHouse(init){
  const tot={}; PARTIES.forEach(p=>tot[p.id]=0);
  REGIONS.forEach(r=>{ const d=regionDelegation(r); PARTIES.forEach(p=>tot[p.id]+=d[p.id]); });
  if(init){ // на старте у президента чуть больше — наследие прошлой кампании
    const move=Math.max(0,Math.round(HOUSE_SEATS*0.30)-tot.pnv);
    if(move>0){ let left=move;
      PARTIES.filter(p=>p.id!==PLAYER).forEach(p=>{ const take=Math.min(left,Math.floor(tot[p.id]*0.25)); tot[p.id]-=take; tot.pnv+=take; left-=take; }); }
  }
  S.houseSeats=tot;
}

  return `<div class="pw-row"><div class="pw-head"><span>${label}</span>
    <span class="maj ${cs>=need?'ok':'no'}">${isOpp()?'ПНВ':'коалиция'} <span class="num" style="font-size:11.5px">${isOpp()?(seats.pnv||0):cs}</span> из ${total} · нужно ${need}</span></div>

}

/* Второй ресурс рядом с действиями: время ограничивает, сколько дел успеть,
   капитал — сколько из них по-настоящему тяжёлых. */

/* ═══════════ Экономика ═══════════ */
/* Решения действуют не сразу: налоги и законы двигают инвестиции,
   инвестиции через сезон-два двигают ВВП, ВВП — занятость и налоговую базу. */

function spark(key,color,title,fmt){
  const d=S.hist.map(h=>h[key]); if(d.length<2)return '';
  const W=300,H=64,mn=Math.min.apply(null,d),mx=Math.max.apply(null,d),rg=(mx-mn)||1;
  const pts=d.map((v,i)=>[8+i/(d.length-1)*(W-16),H-8-(v-mn)/rg*(H-20)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=path+` L${pts[pts.length-1][0].toFixed(1)} ${H} L${pts[0][0].toFixed(1)} ${H} Z`;
  return `<div class="sparkbox"><div class="sparkhead"><span>${title}</span>
      <b class="num">${fmt?fmt(d[d.length-1]):d[d.length-1]}</b></div>
    <svg viewBox="0 0 ${W} ${H}" class="spark"><path d="${area}" fill="${color}" opacity=".13"/>
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3" fill="${color}"/></svg>
    <div class="sparkfoot"><span>${seasonLabel(S.hist[0].s)}</span><span>${seasonLabel(S.season)}</span></div></div>`;
}

  const ch=S.chron.slice().reverse().map(c=>`<div class="chron ${c.kind}"><span class="cy num">${c.y}</span><span>${c.text}</span></div>`).join('');

  return `<div class="card">
      <div class="sec" style="margin:0 0 8px"><h2>Состояние экономики</h2><span class="note">${econWord()}</span></div>
      <div class="kv"><span>ВВП, индекс</span><b class="num">${E.gdp}</b></div>

      <div class="kv"><span>Безработица</span><b class="num ${E.unemp>9?'neg':''}">${E.unemp}%</b></div>

      <p class="hint">Налоги и законы двигают инвестиции, инвестиции через сезон-другой — ВВП, а ВВП уже занятость и налоговую базу. Быстрых решений здесь не бывает.</p></div>
    <div class="sec"><h2>Графики правления</h2><span class="note">${S.hist.length} сезонов</span></div>
    <div class="card">
      ${spark('ap','#B07A16','Одобрение президента',v=>Math.round(v)+'%')}
      ${spark('gdp','#2E7D4F','ВВП')}
      ${spark('un','#B3352A','Безработица',v=>v+'%')}

    <div class="card">${ch||'<p class="lead">История ещё не написана.</p>'}</div>`;

/* ─────────── советник ─────────── */

function advice(){
  const D=DIFFS[S.diff],inc=incomeBreakdown(),ap=approval();
  if(isOpp()){
    if(S.treasury<15)return['Касса пустеет','Пожертвования зависят от настроения блоков и поддержки организаций. Встречи во вкладке «Курс» кормят партию вернее митингов.'];
    if(S.govApproval>60)return['Власть на подъёме','Пока кабинет популярен, лобовые атаки дают мало. Работайте с блоками и регионами, ждите провала правительства.'];
    if(S.govApproval<32)return['Правительство шатается','Рейтинг кабинета обвалился. Сейчас самое время бить: атаки и законопроекты оппозиции работают вдвойне.'];
    const foe0=BLOCS.filter(b=>orgStance(b.id)<0).sort((a,b)=>blocWeight(b.id)-blocWeight(a.id))[0];
    if(foe0)return['Организация против вас','«'+foe0.org+'» работает на власть, а это '+Math.round(blocWeight(foe0.id))+'% страны.'];
    if(inTerm()>=13)return['Скоро выборы','Вернуться можно, если ваш рейтинг выше, а рейтинг кабинета ниже. Считается по регионам с весом населения.'];
    return['Оппозиция набирает вес','Стройте поддержку в крупных регионах и держите СМИ: кампания начнётся раньше, чем объявят дату.'];
  }
  if(S.treasury<=D.bankrupt+70)return['Казна тает','Поднимите налоги во вкладке «Бюджет» или проведите приватизацию либо амнистию капитала. Дефолт наступит на '+D.bankrupt+' млрд.'];
  if(ap<=D.resign+12)return['Рейтинг у красной черты','Митинг и эфир поднимают страну целиком, визит президента — один регион. При '+D.resign+'% вас снимут.'];
  const hot=REGIONS.filter(r=>rs(r.id).unrest>32);
  if(hot.length)return['Напряжённость растёт',hot.map(r=>r.name).join(', ')+' на грани. Откройте карту в режиме «Напряжённость» и гасите очаги, пока они не ударили по бюджету.'];
  if(S.stability<35)return['Стабильность падает','Закон о госбезопасности или министр внутренних дел удержат порядок.'];
  if(!S.vp)return['Нет преемника','Назначьте вице-президента: свой человек страхует от отставки, чужой приводит голоса фракции.'];
  if((senateOf().pnv||0)<SENATE_SEATS*0.3)return['Сенат не ваш','В Сенате решает партия губернатора: её вес в делегации региона удвоен. Берите регионы — придёт и верхняя палата.'];
  if(inc.net<0)return['Бюджет в минусе','Вкладывайтесь в отрасли — они кормят регионы своей специализации, — или заключайте торговые договоры.'];
  const weak=REGIONS.filter(r=>support(r.id)<45).sort((a,b)=>popOf(b.id)-popOf(a.id))[0];
  if(weak&&inTerm()>=8)return['Слабый регион',weak.name+' даёт '+seatsOf(weak.id)+' депутатов и голосует против вас. Визиты и программа развития разворачивают такие территории.'];
  const foe=BLOCS.filter(b=>orgStance(b.id)<0).sort((a,b)=>blocWeight(b.id)-blocWeight(a.id))[0];
  if(foe)return['Организация против вас','«'+foe.org+'» ведёт кампанию против президента, а это '+Math.round(blocWeight(foe.id))+'% страны. Встреча во вкладке «Курс» или законы в их интересах исправят дело.'];
  const drift=BLOCS.filter(b=>blocAlign(b.id)<-0.8).sort((a,b)=>blocWeight(b.id)-blocWeight(a.id))[0];
  if(drift&&inTerm()>=4)return['Курс не по душе большинству','Блок «'+drift.name+'» ('+Math.round(blocWeight(drift.id))+'% страны) далёк от вашей платформы и утекает каждый сезон. Либо сместите курс, либо компенсируйте законами.'];
  if(inTerm()>=13)return['Скоро выборы','Побеждает тот, кто наберёт больше половины по стране. Голоса считаются по регионам с весом населения.'];
  return['Курс устойчив','Хороший момент для спорного закона или вложений в отрасли на будущее.'];
}

function forecast(){
  const inc=incomeBreakdown();
  let s=8+approval()*0.55+friendlyRegions()*1.4+(S.stability-50)*0.15+(inc.net>0?3:-3)+DIFFS[S.diff].shareMod;
  if(S.vp&&S.vp.party===PLAYER)s+=2;
  return clamp(Math.round(s),5,95);
}

function actionBtn(act,arg,label,ap,cost){
  cost=Math.round(cost*costMod());
  const noAp=S.ap<ap,noMoney=S.treasury<cost,dis=noAp||noMoney||S.over;
  const why=S.over?'партия окончена':noAp?'нет действий':noMoney?'не хватает '+(cost-S.treasury)+' млрд':'';
  return `<button class="btn sm ${dis?'':'ghost'}" data-act="${act}" ${arg!==undefined?`data-arg="${arg}"`:''} ${dis?'disabled':''} title="${why}">${label}</button>`;
}

/* ─────────── вкладка: Курс ─────────── */

function setPlatform(axis,val){
  const pl=platform(), cur=axis==='m'?pl.market:pl.state;
  if(cur===val) return;
  if(S.ap<1||S.over){ toast('Нужно свободное действие'); return; }
  const dist=Math.abs(cur-val);
  sheet({eyebrow:'Смена курса · 1 действие',title:'Объявить новый курс',
    body:`<p>Вы меняете позицию на ${dist} ${dist===1?'шаг':'шага'}. Резкие развороты стоят доверия: пресса напомнит прежние обещания.</p>
      <div class="result"><span>Издержки разворота</span><b>−${r1(dist*2.2)} поддержки у всех блоков</b>
      <span>Ваша фракция</span><b class="w">${dist>=2?'заметно занервничает':'переживёт'}</b></div>
      <p class="hint">Зато блоки, к которым вы приблизились, будут прибавлять каждый сезон.</p>`,
    buttons:[{label:'Объявить',fn:()=>{
      S.ap--; if(axis==='m')pl.market=val; else pl.state=val;
      shiftApproval(-dist*2.2); S.flips+=dist;
      S.discipline[PLAYER]=clamp(0.92-Math.abs(pl.market-pl.baseM)*0.05-Math.abs(pl.state-pl.baseS)*0.05,0.6,0.92);
      logMsg('Объявлен новый курс: '+courseName()+'. Издержки разворота — доверие.');
      toast('Курс изменён');}},{label:'Отмена',ghost:true}]});
}

function axisRow(axis,list,cur,left,right){
  return `<div class="axis"><div class="lbl"><span>${left}</span><span>${right}</span></div>
    <div class="steps">${list.map(a=>`<button data-axis="${axis}" data-val="${a[0]}" class="${a[0]===cur?'on':''}">${a[0]===cur?'●':''}</button>`).join('')}</div>
    <div class="now">${(list.find(a=>a[0]===cur)||list[2])[1]}</div></div>`;
}

function hemicycle(seats,opt){
  opt=opt||{};
  const total=PARTIES.reduce((a,p)=>a+(seats[p.id]||0),0);
  const rows=opt.rows||(total<=26?1:total<=60?3:total<=120?5:total<=220?7:total<=380?9:11);
  const W=340,H=182,cx=W/2,cy=H-6,Rr=158;
  const order=PARTIES.slice().sort((a,b)=>ideo(a.id).market-ideo(b.id).market);
  const units=[];
  order.forEach(p=>{const n=seats[p.id]||0;const y=opt.votes?(opt.votes.yesBy[p.id]||0):n;
    for(let i=0;i<n;i++)units.push({c:p.color,yes:opt.votes?i<y:true});});
  const n=units.length;if(!n)return '';
  const inner=rows<=2?0.68:rows>=9?0.42:0.52;
  const radii=rows>1?Array.from({length:rows},(_,i)=>inner+(1-inner)*i/(rows-1)):[0.88];
  const sum=radii.reduce((a,b)=>a+b,0);
  const counts=radii.map(r=>Math.max(1,Math.floor(n*r/sum)));
  let rest=n-counts.reduce((a,b)=>a+b,0),k=rows-1;
  while(rest>0){counts[k]++;rest--;k=(k-1+rows)%rows;}
  while(rest<0){if(counts[k]>1){counts[k]--;rest++;}k=(k-1+rows)%rows;}
  const slots=[];
  counts.forEach((cnt,row)=>{for(let j=0;j<cnt;j++){const a=Math.PI-(j+0.5)/cnt*Math.PI;
    slots.push({a,x:cx+Rr*radii[row]*Math.cos(a),y:cy-Rr*radii[row]*Math.sin(a)});}});
  slots.sort((p,q)=>q.a-p.a);
  const rad=rows>=11?2.3:rows===9?2.8:rows===7?3.4:rows===5?4.2:rows===3?5.4:(total>18?6.2:8);
  let g=`<svg class="hemi" viewBox="0 0 ${W} ${H}" role="img" aria-label="Схема мест">`;
  slots.forEach((s,i)=>{const u=units[i];if(!u)return;
    const an=opt.animate?` class="seat anim" style="animation-delay:${Math.round(i*(900/n))}ms"`:' class="seat"';
    g+=u.yes?`<circle${an} cx="${s.x.toFixed(1)}" cy="${s.y.toFixed(1)}" r="${rad}" fill="${u.c}"/>`
            :`<circle${an} cx="${s.x.toFixed(1)}" cy="${s.y.toFixed(1)}" r="${Math.max(1.2,rad-0.6)}" fill="none" stroke="${u.c}" stroke-width="${rad<3?0.9:1.4}" opacity=".6"/>`;});
  return g+'</svg>';
}

/* ─────────── законы ─────────── */

function partyYesProb(pid,law,senate){
  if(pid===PLAYER)return 0.93;
  let p=0.55-0.13*ideoDist(pid,law)+((S.relations[pid]??50)-50)/130;
  if(inCabinet(pid))p+=0.07;
  if(S.lobby===pid)p+=0.22;
  if(senate)p+=0.02;
  return clamp(p,0.04,0.96);
}

function houseVote(law){
  const yesBy={},noBy={};let yes=0,no=0,total=0;
  PARTIES.forEach(p=>{const n=S.houseSeats[p.id]||0;if(!n)return;total+=n;
    const d=S.discipline[p.id];let pr=partyYesProb(p.id,law,false);pr=pr*d+0.5*(1-d);
    let y=0;for(let i=0;i<n;i++)if(Math.random()<pr)y++;
    yesBy[p.id]=y;noBy[p.id]=n-y;yes+=y;no+=n-y;});
  return {yes,no,total,yesBy,noBy,passed:yes>total/2};
}

function senateVote(law){
  const sen=senateOf(),yesBy={},noBy={};let yes=0,no=0,total=0;
  PARTIES.forEach(p=>{const n=sen[p.id]||0;if(!n){yesBy[p.id]=0;noBy[p.id]=0;return;}total+=n;
    const d=S.discipline[p.id];let pr=partyYesProb(p.id,law,true);pr=pr*d+0.5*(1-d);
    pr=clamp(pr+progShare()*0.06,0.04,0.97);
    let y=0;for(let i=0;i<n;i++)if(Math.random()<pr)y++;
    yesBy[p.id]=y;noBy[p.id]=n-y;yes+=y;no+=n-y;});
  return {yes,no,total,yesBy,noBy,passed:yes>total/2};
}

function voteView(res,seats,chamber){
  const need=Math.floor(res.total/2)+1;
  return `<p class="lead">${chamber}</p>
    <div class="tally"><span class="y">За — <span class="num">${res.yes}</span></span><span class="n"><span class="num">${res.no}</span> — против</span></div>
    <div class="votebar"><i style="width:${res.yes/res.total*100}%;background:var(--pos)"></i><i style="width:${res.no/res.total*100}%;background:var(--neg);opacity:.35"></i><span class="thr"></span></div>
    <div class="thrlabel">для принятия нужно ${need} голосов</div>
    ${hemicycle(seats,{votes:res,animate:true})}
    <p class="hint" style="text-align:center;margin-top:0">закрашенные места — «за», контуром — «против»</p>`;
}

function issueLawBonus(law){
  switch(S.issue){
    case 'econ':   return (law.eff.income>0||law.eff.treasury>0)?3:0;
    case 'secure': return law.state>0.8?3:(law.state<-0.8?-2:0);
    case 'social': return law.state<-0.6?3:(law.state>0.8?-2:0);
    case 'corrupt':return (law.id==='court'||law.id==='media')?4:0;
    default:return 0;
  }
}

function openLaw(id){
  const law=LAWS.find(l=>l.id===id);if(S.ap<1||S.treasury<5)return;
  const b=issueLawBonus(law);
  const items=[{v:'none',l:'Внести как есть · 5 млрд'}].concat(
    S.treasury>=17?PARTIES.filter(p=>p.id!==PLAYER).map(p=>({v:p.id,l:'Лоббировать '+p.short+' · 17 млрд'})):[]);
  chooser(law.name,'Внесение закона · 1 действие',
    `<p class="lead">${law.desc}</p><p class="hint" style="margin:6px 0 0">${b?('Тема сезона даёт '+sign(b)+' к поддержке. '):''}Лоббирование резко поднимает шансы выбранной фракции — и в палате, и в сенате.</p>`,
    items,v=>{const lobby=v==='none'?null:v,cost=5+(lobby?12:0);
      if(!spend(1,cost))return false;
      S.lobby=lobby;if(lobby)logMsg('Лоббисты работают с фракцией '+P(lobby).short+' по закону '+law.name+'.');
      stageHouse(law);});
}

function stageHouse(law){
  const res=houseVote(law);
  if(!res.passed){shiftApproval(-1.5);S.lawsLeft=S.lawsLeft.filter(x=>x!==law.id);S.lobby=null;
    logMsg('Народная палата отклонила закон «'+law.name+'»: '+res.yes+' за.');
    sheet({eyebrow:'Первое чтение · '+law.name,title:'Палата против',body:voteView(res,S.houseSeats,'Народная палата, '+HOUSE_SEATS+' мест')+'<div class="verdict no">ОТКЛОНЁН</div>'});return;}
  sheet({eyebrow:'Первое чтение · '+law.name,title:'Палата за',body:voteView(res,S.houseSeats,'Народная палата, '+HOUSE_SEATS+' мест')+'<div class="verdict yes">ПРИНЯТ</div>',
    buttons:[{label:'Передать в Сенат',fn:()=>stageSenate(law)}]});
}

function stageSenate(law){
  const sen=senateOf(),res=senateVote(law);S.lawsLeft=S.lawsLeft.filter(x=>x!==law.id);
  if(!res.passed){shiftApproval(-1);S.lobby=null;
    logMsg('Сенат провалил закон «'+law.name+'»: '+res.yes+' из '+SENATE_SEATS+'.');
    sheet({eyebrow:'Второе чтение · '+law.name,title:'Сенат против',
      body:voteView(res,sen,'Сенат, '+SENATE_SEATS+' мест')+'<div class="verdict no">ОТКЛОНЁН</div><p class="hint">Сенат берут через губернаторов: свои регионы и программы развития.</p>'});return;}
  sheet({eyebrow:'Второе чтение · '+law.name,title:'Сенат за',body:voteView(res,sen,'Сенат, '+SENATE_SEATS+' мест')+'<div class="verdict yes">ОДОБРЕН</div>',
    buttons:[{label:'Подписать',fn:()=>enactLaw(law)}]});
}

function applyLaw(law,byRef,quiet){
  S.lawsPassed.push(law.id);S.lobby=null;const e=law.eff;
  if(e.treasury)S.treasury+=e.treasury;
  const b=issueLawBonus(law),appr=(e.approval||0)+b;
  if(appr)shiftApproval(appr);
  if(e.stability)S.stability=clamp(S.stability+e.stability,0,100);
  if(law.rel)Object.entries(law.rel).forEach(([pid,v])=>S.relations[pid]=clamp(S.relations[pid]+v,0,100));
  Object.entries(law.bl||{}).forEach(([bid,v])=>shiftBloc(bid,v));
  // эффект по регионам считается из их демографии
  const impact={},winners=[],losers=[];
  REGIONS.forEach(r=>{ let v=0;
    Object.entries(law.bl||{}).forEach(([bid,d])=>v+=MIX[r.id][bid]*d/100);
    impact[r.id]=v;
    rs(r.id).unrest=clamp(rs(r.id).unrest-v*0.7,0,100);
    if(v>1.2)winners.push(r.name.replace(/ (регион|область|край)$/,''));
    if(v<-1.2)losers.push(r.name.replace(/ (регион|область|край)$/,'')); });
  logMsg('Подписан закон «'+law.name+'».'+(winners.length?' Довольны: '+winners.join(', ')+'.':'')+(losers.length?' Недовольны: '+losers.join(', ')+'.':''));
  chronicle('Принят закон «'+law.name+'».','good');
  toast('Закон подписан');
  const regLine=(winners.length||losers.length)?
    `<div class="result"><span>Регионы «за»</span><b class="w pos">${winners.join(', ')||'—'}</b><span>Регионы «против»</span><b class="w neg">${losers.join(', ')||'—'}</b></div>`:'';
  sheet({eyebrow:'Указ президента',title:law.name,
    body:'<p>'+law.desc+'</p>'+regLine+mapSVG({labels:false,fill:r=>{const v=(law.sect||{})[r.sector]||0;return v>0?'#2E7D4F':v<0?'#B3352A':'#3A4553';}})+
      '<p class="hint" style="text-align:center">зелёным — выигравшие регионы, красным — проигравшие</p><div class="verdict yes">ЗАКОН ВСТУПИЛ В СИЛУ</div>'});
}

function mediaTick(){
  MEDIA.forEach(m=>{
    const st=S.media[m.id];
    const pull=(st.loyal-50)/100*(m.reach/22);
    shiftBloc(m.bloc,pull*1.1,false);
    S.bloc[m.bloc].mood=clamp(S.bloc[m.bloc].mood+pull*0.6,0,100);
    // редакции дрейфуют к настроению своего читателя
    st.loyal=clamp(st.loyal+(S.bloc[m.bloc].support-st.loyal)*0.10+(st.subsidy?1.6:-0.6)+rnd(-1.5,1.5),0,100);
    if(st.subsidy&&Math.random()<0.06){
      st.subsidy=false;shiftBloc('intel',-4);shiftBloc('urban',-2);
      logMsg('Утечка: госконтракт с изданием '+m.name+' попал в прессу. Скандал вокруг покупки лояльности.');
      sheet({eyebrow:'Скандал',title:'Купленная редакция',body:'<p>Документы о госконтракте с изданием '+m.name+' опубликованы. Интеллигенция и горожане в ярости.</p>'});
    }
  });
}

/* ═══════════ Референдум ═══════════ */

function refSupport(ref){
  let for_=0,tot=0;
  BLOCS.forEach(b=>{const w=blocWeight(b.id),k=ref.bl[b.id]||0;
    const q=S.bloc[b.id];
    for_+=w*clamp(50+k*22+(q.support-50)*0.35,2,98); tot+=w;});
  return for_/tot;
}

function openReferendum(){
  const avail=REFERENDA.filter(r=>S.refDone.indexOf(r.id)<0&&S.lawsLeft.indexOf(r.law)>=0);
  if(!avail.length){sheet({title:'Референдум невозможен',body:'<p class="lead">Все вопросы, которые можно вынести на всенародное голосование, уже решены парламентом или народом.</p>'});return;}
  chooser('Всенародный референдум','1 действие · 25 млрд',
    '<p class="lead">Референдум обходит обе палаты: одобренный народом закон вступает в силу сразу. Но провал бьёт по вашему авторитету, а кампания стоит дорого.</p><p class="hint">Прогноз считается по настроениям блоков — без свежей социологии он приблизителен.</p>',
    avail.map(r=>({v:r.id,l:r.q+' · ~'+Math.round(refSupport(r)+(polled()?0:noise(r.id+S.season)*8))+'%'})),
    v=>{ if(!spend(1,25))return false; runReferendum(REFERENDA.find(r=>r.id===v)); });
}

function runReferendum(ref){
  S.refDone.push(ref.id);
  const base=refSupport(ref);
  const turnout=clamp(48+approval()*0.25+rnd(-6,6),25,85);
  const yes=clamp(base+rnd(-6,6)+(mediaBacking()*3),3,97);
  const law=LAWS.find(l=>l.id===ref.law);
  const map=mapSVG({labels:false,fill:r=>{let v=0;BLOCS.forEach(b=>v+=MIX[r.id][b.id]*(ref.bl[b.id]||0)/100);
    return v>0.35?'#2E7D4F':v>0.05?'#8FBF9A':v<-0.35?'#B3352A':v<-0.05?'#D98C6A':'#3A4553';}});
  const body=`<div class="votebar" style="height:14px;border-radius:7px">
      <i style="width:${yes}%;background:var(--pos)"></i><i style="width:${100-yes}%;background:var(--neg);opacity:.4"></i><span class="thr"></span></div>
    <div class="result"><span>За</span><b class="pos">${r1(yes)}%</b><span>Против</span><b class="neg">${r1(100-yes)}%</b>
      <span>Явка</span><b>${Math.round(turnout)}%</b></div>${map}`;
  if(yes>50){
    S.lawsLeft=S.lawsLeft.filter(x=>x!==law.id);
    shiftApproval(3);
    applyLaw(law,true);
    logMsg('Референдум «'+ref.q+'» выигран: '+r1(yes)+'% за. Закон вступил в силу через голову парламента.');
    sheet({eyebrow:'Референдум',title:'Народ сказал «да»',body:body+'<div class="verdict yes">РЕШЕНИЕ ПРИНЯТО НАРОДОМ</div>'});
  } else {
    shiftApproval(-5);S.stability=clamp(S.stability-4,0,100);
    logMsg('Референдум «'+ref.q+'» проигран: всего '+r1(yes)+'% за. Удар по авторитету власти.');
    sheet({eyebrow:'Референдум',title:'Народ сказал «нет»',body:body+'<div class="verdict no">ПОРАЖЕНИЕ ВЛАСТИ</div><p class="hint">Проигранный референдум стоит поддержки и стабильности: страна увидела слабость.</p>'});
  }
}

function programsTick(){
  S.programs.forEach(id=>{const P=PROGRAMS.find(x=>x.id===id);
    Object.entries(P.eff).forEach(([b,v])=>shiftBloc(b,v*0.16,false));
    if(P.stability)S.stability=clamp(S.stability+P.stability*0.12,0,100);
    const c=S.dip.find(d=>d.id===P.country); if(c)c.rel=clamp(c.rel+0.6,0,100);});
}

function joinProgram(id){
  const P=PROGRAMS.find(x=>x.id===id),c=S.dip.find(d=>d.id===P.country);
  if(!spend(1,P.cost))return;
  S.programs.push(id);
  Object.entries(P.eff).forEach(([b,v])=>shiftBloc(b,v));
  if(P.stability)S.stability=clamp(S.stability+P.stability,0,100);
  if(P.tech){const t=S.industries.find(i=>i.id==='tech');if(t&&t.level<3)t.level++;}
  c.rel=clamp(c.rel+6,0,100);
  logMsg('Новария вошла в программу «'+P.name+'» вместе со страной '+c.name+'.');
  sheet({eyebrow:'Международная программа',title:P.name,
    body:'<p>'+P.desc+'</p><div class="result"><span>Партнёр</span><b class="w">'+c.name+'</b>'+
      '<span>Разовые вложения</span><b>'+P.cost+' млрд</b>'+
      (P.upkeep?'<span>Содержание</span><b>'+P.upkeep+' млрд в сезон</b>':'')+
      (P.income?'<span>Отдача</span><b class="pos">+'+P.income+' млрд в сезон</b>':'')+'</div>'});
  render();
}

/* ═══════════ Законы от фракций ═══════════ */

function partyBill(){
  const pool=S.lawsLeft.map(id=>LAWS.find(l=>l.id===id));
  if(!pool.length)return false;
  const opp=PARTIES.filter(p=>p.id!==PLAYER);
  const author=pick(opp);
  const law=pool.slice().sort((a,b)=>ideoDist(author.id,a)-ideoDist(author.id,b))[0];
  if(!law)return false;
  let mine=0;BLOCS.forEach(b=>mine+=blocWeight(b.id)*(law.bl&&law.bl[b.id]||0)/100);
  const good=mine>0.3;
  S.partyBills++;
  sheet({eyebrow:'Инициатива фракции · '+author.short,title:'«'+author.name+'» вносит закон',
    body:`<p>${S.leaders[author.id]} внёс${author.id==='trud'||author.id==='svk'?'ла':''} законопроект «${law.name}».</p>
      <p class="lead">${law.desc}</p>
      <div class="result"><span>Для вашей коалиции</span><b class="w ${good?'pos':'neg'}">${good?'скорее выгоден':'скорее вреден'}</b>
      <span>Шансы в палате</span><b>${Math.round(oddsHouse(law)*100)}%</b></div>`,
    buttons:[
      {label:'Поддержать',fn:()=>{S.relations[author.id]=clamp(S.relations[author.id]+8,0,100);
        S.lobby=author.id;billVote(law,author,true);}},
      {label:'Не вмешиваться',ghost:true,fn:()=>{S.lobby=null;billVote(law,author,false);}},
      {label:'Заблокировать · 12 млрд',ghost:true,fn:()=>{
        if(S.treasury<12){toast('Не хватает денег');return false;}
        S.treasury-=12;S.relations[author.id]=clamp(S.relations[author.id]-10,0,100);
        S.lawsLeft=S.lawsLeft.filter(x=>x!==law.id);
        logMsg('Инициатива «'+author.name+'» о законе «'+law.name+'» снята с рассмотрения кулуарно.');
        sheet({eyebrow:'Кулуары',title:'Законопроект похоронен',body:'<p>Законопроект «'+law.name+'» не дошёл до чтения. '+author.name+' этого не забудет: отношения −10.</p>'});}}]});
  return true;
}

function billVote(law,author,backed){
  const h=houseVote(law);S.lobby=null;
  if(!h.passed){S.lawsLeft=S.lawsLeft.filter(x=>x!==law.id);
    logMsg('Палата отклонила законопроект фракции '+author.short+' «'+law.name+'».');
    sheet({eyebrow:'Инициатива '+author.short,title:'Палата против',body:voteView(h,S.houseSeats,'Народная палата, '+HOUSE_SEATS+' мест')+'<div class="verdict no">ОТКЛОНЁН</div>'});return;}
  const sv=senateVote(law);S.lawsLeft=S.lawsLeft.filter(x=>x!==law.id);
  if(!sv.passed){logMsg('Сенат отклонил законопроект фракции '+author.short+'.');
    sheet({eyebrow:'Инициатива '+author.short,title:'Сенат против',body:voteView(sv,senateOf(),'Сенат, '+SENATE_SEATS+' мест')+'<div class="verdict no">ОТКЛОНЁН</div>'});return;}
  sheet({eyebrow:'Инициатива '+author.short,title:'Закон принят парламентом',
    body:voteView(sv,senateOf(),'Сенат, '+SENATE_SEATS+' мест')+'<div class="verdict yes">ПРИНЯТ ОБЕИМИ ПАЛАТАМИ</div><p class="hint">Президент может подписать закон или наложить вето. Вето стоит поддержки и злит автора.</p>',
    buttons:[
      {label:'Подписать',fn:()=>{applyLaw(law,false);
        logMsg('Подписан закон «'+law.name+'», внесённый фракцией '+author.short+'.');}},
      {label:'Вето',ghost:true,fn:()=>{shiftApproval(-3);S.relations[author.id]=clamp(S.relations[author.id]-14,0,100);
        S.stability=clamp(S.stability-2,0,100);
        logMsg('Президент наложил вето на закон «'+law.name+'». '+author.name+' в ярости.');
        sheet({eyebrow:'Вето президента',title:'Закон отклонён',body:'<p>Вы остановили закон, принятый обеими палатами. Поддержка −3, отношения с '+author.name+' −14.</p>'});}}]});
}


/* ═══════════ Губернаторы как самостоятельные игроки ═══════════ */

function governorsTick(){
  REGIONS.forEach(r=>{
    const q=rs(r.id),g=q.gov;
    g.loyal=clamp(g.loyal+(g.party===PLAYER?1.0:-0.5)+(q.program?0.8:0)+(support(r.id)-50)*0.05-q.unrest*0.02+rnd(-2,2),0,100);
    g.rel=clamp(g.rel+(g.loyal-50)*0.05+rnd(-2,2),0,100);
    g.pop=clamp(g.pop+(support(r.id)-g.pop)*0.10-q.unrest*0.03+rnd(-2,2),0,100);
    g.corrupt=clamp(g.corrupt+(q.program?0.6:0.2)+rnd(-1,1.4),0,100);
    if(g.defiant>0)g.defiant--;
    if(isOpp())return;
    // коррупционный скандал
    if(g.corrupt>62&&Math.random()<0.10){
      g.corrupt-=25;g.pop=clamp(g.pop-18,0,100);q.unrest+=8;
      if(g.party===PLAYER){shiftApproval(-1.6);pcAdd(-4);}
      else {shiftRegion(r.id,1.5);}
      logMsg('Коррупционный скандал: губернатор '+g.name+' ('+R(r.id).name+') под следствием.',true);
      queueCrisis({type:'corrupt',region:r.id,name:g.name});
      return;
    }
    // саботаж решений центра
    if(govMood(g)<32&&Math.random()<0.14){
      g.defiant=3;q.unrest+=5;
      logMsg(R(r.id).name+': губернатор '+g.name+' отказался исполнять решение центра.',true);
      sheet({eyebrow:'Конфликт с центром · '+R(r.id).cap,title:'Губернатор саботирует решения',
        body:`<p>${g.name} публично заявил, что регион будет действовать по-своему. Три сезона ваши программы здесь работают вполсилы.</p>
          <div class="result"><span>Лояльность центру</span><b class="neg">${Math.round(g.loyal)}</b>
          <span>Популярность в регионе</span><b>${Math.round(g.pop)}</b></div>`,
        buttons:[
          {label:'Надавить · 12 ПК',fn:()=>{ if(!pcPay(12)){toast('Не хватает капитала');return false;}
            g.defiant=0;g.loyal=clamp(g.loyal+16,0,100);g.pop=clamp(g.pop-8,0,100);shiftRegion(r.id,-2);
            logMsg('Центр сломил сопротивление губернатора '+g.name+'.');}},
          {label:'Договориться · 20 млрд',fn:()=>{ if(S.treasury<20){toast('Нет денег');return false;}
            S.treasury-=20;g.defiant=0;g.rel=clamp(g.rel+18,0,100);g.loyal=clamp(g.loyal+10,0,100);
            logMsg('С губернатором '+g.name+' договорились по-хорошему: 20 млрд региону.');}},
          {label:'Стерпеть',ghost:true,fn:()=>{shiftApproval(-1);S.stability=clamp(S.stability-2,0,100);
            logMsg('Центр проглотил демарш губернатора '+g.name+'.');}}]});
      return;
    }
    // переход в другую партию
    if(g.party===PLAYER&&g.loyal<26&&Math.random()<0.12){
      const to=PARTIES.filter(p=>p.id!==PLAYER).sort((a,b)=>(S.relations[b.id]||0)-(S.relations[a.id]||0))[0];
      g.party=to.id;g.loyal=ri(35,55);allocateSenate();
      logMsg('Губернатор '+g.name+' ('+R(r.id).name+') вышел из ПНВ и перешёл к «'+to.name.replace(/[«»]/g,'')+'».',true);
      sheet({eyebrow:'Раскол',title:'Губернатор сменил партию',
        body:'<p>'+g.name+' объявил о выходе из «Возрождения» и вступлении в '+to.name+'. Регион уводит своих сенаторов.</p>'});
    }
  });
}
/* сильный и популярный оппозиционный губернатор идёт в президенты */

'use strict';
/* ══════════ КАБИНЕТ · Республика Новария ══════════ */


function popOf(id){ return S.pop?S.pop[id]:R(id).pop; }

function totalPop(){ return REGIONS.reduce((s,r)=>s+popOf(r.id),0); }

function houseQuota(){ return apportion(HOUSE_SEATS,10); }

function senateQuota(){ return apportion(SENATE_SEATS,5); }

function seatsOf(id){ return (S.quotaH||houseQuota())[id]; }

function senSeatsOf(id){ return (S.quotaS||senateQuota())[id]; }

function seasonLabel(n){return SEASONS[(n-1)%4]+' '+(2026+Math.floor((n-1)/4));}

function inTerm(){return S.season-S.termStart+1;}            // сезон текущего срока, 1..16

function isOpp(){return S.mode==='opp';}

function rulingParty(){return isOpp()?(S.gov?S.gov.party:'derzh'):PLAYER;}

function oppLeaderParty(){
  return PARTIES.filter(p=>p.id!==rulingParty())
    .sort((a,b)=>(S.houseSeats[b.id]||0)-(S.houseSeats[a.id]||0))[0];
}

function issueObj(){return ISSUES.find(i=>i.id===S.issue);}

/* Поддержка региона не хранится: она собирается из настроений электоральных
   блоков по демографии региона плюс местная надбавка (визиты, губернатор). */

function support(id){
  const m=MIX[id]; let v=0;
  BLOCS.forEach(b=>v+=m[b.id]*S.bloc[b.id].support/100);
  return clamp(v+rs(id).local,0,100);
}

function approval(){ let s=0; REGIONS.forEach(r=>s+=popOf(r.id)*support(r.id)); return s/totalPop(); }

function shiftApproval(d){ BLOCS.forEach(b=>{const q=S.bloc[b.id];q.support=clamp(q.support+d,0,100);}); }

function shiftBloc(id,d,mood){ const q=S.bloc[id];
  q.support=clamp(q.support+d,0,100);
  if(mood!==false) q.mood=clamp(q.mood+d*1.4,0,100); }

function shiftRegion(id,d){ const q=rs(id); q.local=clamp(q.local+d,-22,22); }
/* организация блока: публичная поддержка или кампания против */

function orgStance(id){ const m=S.bloc[id].mood; return m>=70?1:m<=27?-1:0; }

function platform(){ return S.ideology[PLAYER]; }

function blocAlign(id){ const b=B(id),pl=platform();
  return 2.4-(Math.abs(b.market-pl.market)+Math.abs(b.state-pl.state)); }
/* опрос: без свежей социологии цифры по регионам показываются с погрешностью */

function noise(seed){ let h=2166136261;
  for(let i=0;i<seed.length;i++){h^=seed.charCodeAt(i);h=Math.imul(h,16777619);}
  return ((h>>>0)%1000)/1000-0.5; }

function polled(){ return S.pollSeason===S.season; }

function shownSupport(id){
  const v=support(id);
  return polled()?v:clamp(v+noise(id+'|'+S.season)*7,0,100);
}

function senateOf(){ return S.senSeats||{}; }

function allocateSenate(){
  const tot={}; PARTIES.forEach(p=>tot[p.id]=0);
  REGIONS.forEach(r=>{ const d=senateDelegation(r); PARTIES.forEach(p=>tot[p.id]+=d[p.id]); });
  S.senSeats=tot;
}

function friendlyRegions(){ return REGIONS.filter(r=>rs(r.id).gov.party===PLAYER).length; }

function avgUnrest(){ let s=0; REGIONS.forEach(r=>s+=popOf(r.id)*rs(r.id).unrest); return s/totalPop(); }

function inCabinet(pid){ return Object.values(S.ministers).some(m=>m&&m.party===pid)||(S.vp&&S.vp.party===pid); }

function coalitionIds(){ return PARTIES.filter(p=>p.id===PLAYER||inCabinet(p.id)).map(p=>p.id); }

function coalitionSeats(seats){ return coalitionIds().reduce((s,id)=>s+(seats[id]||0),0); }

function sectorLevel(sec){ const x=S.industries.find(i=>i.id===sec); return x?x.level*(S.ministers.eco?1.35:1):0; }

/* доход региона: население + отрасль + программа − напряжённость */

function logMsg(t,key){S.log.unshift({t:seasonLabel(S.season),text:t,key:!!key});if(S.log.length>200)S.log.pop();}

function toast(t){const b=document.getElementById('toasts');if(!b)return;
  const e=document.createElement('div');e.className='toast';e.textContent=t;b.appendChild(e);setTimeout(()=>e.remove(),2900);}

function pcAdd(v){ S.pc=clamp(S.pc+v,0,PC_MAX); }

function pcPay(v){ if(S.pc<v) return false; S.pc-=v; return true; }
/* ═══════════ Экономика 2.0 ═══════════ */

function debtRatio(){ return r1(S.econ.debt/S.econ.gdp*100); }

function econField(f){ return f==='debtRatio'?debtRatio():S.econ[f]; }

function sheet(m){queue.push(m);if(!modalOpen)nextSheet();}

function clearQueue(){queue.length=0;}

function scaleColor(v,sc){ for(const [t,c] of sc) if(v<t) return c; return sc[sc.length-1][1]; }

function senateDelegation(r){ return regionDelegation(r,senSeatsOf(r.id),2.4); }
/* фракция сильна там, где живёт её электорат */

function blocAffinity(pid,rid){
  const b=PARTY_BLOC[pid]; if(!b) return false;

}

function sectorAffinity(pid,sec){

/* ═══════════ Требования фракций ═══════════ */

function pc(){ return Math.round(S.pc); }

/* ═══════════ Экономика ═══════════ */
/* Решения действуют не сразу: налоги и законы двигают инвестиции,
   инвестиции через сезон-два двигают ВВП, ВВП — занятость и налоговую базу. */

function debtCost(){ return Math.round(S.econ.debt*0.06); }

function econWord(){ const E=S.econ;
  if(E.growth>3.5&&E.unemp<7)return'подъём';
  if(E.growth>1.2)return'рост';
  if(E.growth>-0.5)return'застой';
  if(E.growth>-3)return'спад';
  return'кризис'; }

function chronicle(text,kind){ S.chron.push({s:S.season,y:2026+Math.floor((S.season-1)/4),text,kind:kind||''}); }
/* ─────────── советник ─────────── */
/* ─────────── вкладка: Кабинет ─────────── */
/* ─────────── вкладка: Курс ─────────── */

function alignWord(v){ return v>1.4?'ядро поддержки':v>0.6?'скорее за вас':v>-0.4?'колеблется':v>-1.2?'скорее против':'враждебен'; }

function blocWeight(id){ let w=0; REGIONS.forEach(r=>w+=popOf(r.id)*MIX[r.id][id]/100); return w*100/totalPop(); }

function courseName(){ const pl=platform();
  return (AXIS_M.find(a=>a[0]===pl.market)||AXIS_M[2])[1]+' · '+(AXIS_S.find(a=>a[0]===pl.state)||AXIS_S[2])[1]; }
/* ─────────── вкладка: Карта ─────────── */

function unrestWord(u){ return u<10?'спокойно':u<22?'ропот':u<35?'тревожно':'на грани бунта'; }

function partyStance(pid,law){let pr=partyYesProb(pid,law,false);return Math.round((pr*S.discipline[pid]+0.5*(1-S.discipline[pid]))*100);}

function oddsHouse(law){let e=0,t=0;PARTIES.forEach(p=>{const n=S.houseSeats[p.id]||0;t+=n;e+=n*(partyStance(p.id,law)/100);});return t?e/t:0;}

function nearestParty(law){return PARTIES.slice().sort((a,b)=>ideoDist(a.id,law)-ideoDist(b.id,law))[0];}

/* ─────────── действия ─────────── */

function spend(ap,m){m=Math.round(m*costMod());if(S.ap<ap||S.treasury<m)return false;S.ap-=ap;S.treasury-=m;return true;}
/* ─────────── законы ─────────── */

function ideo(pid){return S.ideology[pid];}

function ideoDist(pid,l){const I=ideo(pid);return Math.abs(I.market-l.market)+Math.abs(I.state-l.state);}

function progShare(){ return REGIONS.filter(r=>rs(r.id).program).length/REGIONS.length; }

function enactLaw(law){ applyLaw(law,false,true); }

    if(!m.demand&&m.tenure>2&&Math.random()<0.16){

          <span>Популярность</span><b>${Math.round(m.pop)}</b><span>Отношения с вами</span><b>${Math.round(m.rel)}</b></div>`,
        buttons:[
          {label:m.demand.cost?('Удовлетворить · '+m.demand.cost+' млрд'):'Удовлетворить · 6 ПК',
           fn:()=>{ if(m.demand.cost){ if(S.treasury<m.demand.cost){toast('Нет денег');return false;} S.treasury-=m.demand.cost; }
             else if(!pcPay(6)){toast('Не хватает капитала');return false;}
             m.loyal=clamp(m.loyal+18,0,100);m.rel=clamp(m.rel+14,0,100);m.demand=null;
             logMsg(po.name+' '+m.name+': требование удовлетворено, лояльность выросла.');}},
          {label:'Отказать',ghost:true,fn:()=>{m.loyal=clamp(m.loyal-16,0,100);m.rel=clamp(m.rel-12,0,100);m.demand=null;
             logMsg(po.name+' '+m.name+' получил отказ и затаил обиду.');}},
          {label:'Отправить в отставку · 10 ПК',ghost:true,fn:()=>{ if(!pcPay(10)){toast('Не хватает капитала');return false;}
             S.ministers[post]=null;shiftApproval(-1);
             if(m.party!==PLAYER)S.relations[m.party]=clamp(S.relations[m.party]-8,0,100);
             logMsg(po.name+' '+m.name+' отправлен в отставку.',true);}}]});
    }
    if(m.loyal<25&&Math.random()<0.22){
      S.ministers[post]=null;shiftApproval(-2);pcAdd(-5);

        body:'<p>'+m.name+' покинул кабинет, дав разгромное интервью. Поддержка −2, политический капитал −5.</p>'});
    }

}

/* ═══════════ Требования фракций ═══════════ */

function newDemand(pid){
  const pool=(DEMANDS[pid]||[]).filter(d=>S.lawsLeft.indexOf(d.law)>=0);
  if(!pool.length)return null;
  const d=pick(pool);
  return {t:d.t,law:d.law,since:S.season};
}

function demandsTick(){
  PARTIES.filter(p=>p.id!==PLAYER).forEach(p=>{
    const d=S.demand[p.id];
    if(d){
      if(S.lawsPassed.indexOf(d.law)>=0){
        S.relations[p.id]=clamp(S.relations[p.id]+16,0,100);
        S.discipline[p.id]=Math.min(0.92,S.discipline[p.id]+0.04);
        pcAdd(6);S.demand[p.id]=null;
        logMsg('«'+p.name.replace(/[«»]/g,'')+'» получили своё: требование «'+d.t+'» выполнено. Отношения +16.',true);
      } else if(S.season-d.since>=5){
        S.relations[p.id]=clamp(S.relations[p.id]-10,0,100);
        S.demand[p.id]=newDemand(p.id);
        logMsg('Фракция '+p.short+' устала ждать по требованию «'+d.t+'»: отношения −10.');
      }
    } else if(Math.random()<0.3) S.demand[p.id]=newDemand(p.id);
  });
}

/* ─────────── дрейф и лидеры ─────────── */

function driftIdeology(){
  const PL=ideo(PLAYER),moved=[];
  PARTIES.filter(p=>p.id!==PLAYER).forEach(p=>{const I=ideo(p.id);
    let dm=(I.baseM-I.market)*0.05,ds=(I.baseS-I.state)*0.05;
    if(inCabinet(p.id)){dm+=(PL.market-I.market)*0.05;ds+=(PL.state-I.state)*0.05;}
    if((S.relations[p.id]??50)<30){dm+=(I.market-PL.market>0?1:-1)*0.05;ds+=(I.state-PL.state>0?1:-1)*0.05;}
    if((S.houseSeats[p.id]||0)<10){dm+=(-I.market)*0.04;ds+=(-I.state)*0.04;}
    dm+=rnd(-0.05,0.05);ds+=rnd(-0.05,0.05);
    const before=Math.abs(I.market)+Math.abs(I.state);
    I.market=clamp(I.market+dm,I.baseM-1.2,I.baseM+1.2);
    I.state=clamp(I.state+ds,I.baseS-1.2,I.baseS+1.2);
    if(Math.abs(Math.abs(I.market)+Math.abs(I.state)-before)>0.18)moved.push(p);});
  if(moved.length&&Math.random()<0.5){const p=pick(moved),I=ideo(p.id);
    logMsg(p.name+(I.market>I.baseM||I.state>I.baseS?' ужесточает риторику.':' смягчает позиции, охотясь за центристами.'));}
}

function leadershipChanges(){
  PARTIES.filter(p=>p.id!==PLAYER).forEach(p=>{
    if(S.discipline[p.id]<0.7&&Math.random()<0.5){
      const old=S.leaders[p.id];S.leaders[p.id]=pick(LEADER_NAMES);
      S.discipline[p.id]=Math.min(0.9,S.discipline[p.id]+0.15);
      S.relations[p.id]=clamp((S.relations[p.id]+45)/2,0,100);
      const I=ideo(p.id);I.market=clamp(I.market+rnd(-0.4,0.4),I.baseM-1.2,I.baseM+1.2);I.state=clamp(I.state+rnd(-0.4,0.4),I.baseS-1.2,I.baseS+1.2);
      logMsg(p.name+': '+old+' смещён(а), фракцию возглавил(а) '+S.leaders[p.id]+'.');
      sheet({eyebrow:p.name,title:'Смена лидера',body:'<p>Раскол довёл фракцию до бунта. '+old+' уходит, партию возглавляет '+S.leaders[p.id]+'. Дисциплина восстановлена, отношения сброшены к нейтральным, курс сместился.</p>'});}});
}

const STRATEGIES=[
  {id:'base', name:'Мобилизация ядра',   desc:'Работа там, где вас уже любят: явка сторонников растёт, колеблющиеся остаются равнодушны.'},

  {id:'attack',name:'Кампания против соперника',desc:'Бить по оппоненту, а не рассказывать о себе. Работает, но часть избирателей устанет от грязи.'},
  {id:'unity',name:'Широкая коалиция',   desc:'Договориться со всеми фракциями сразу. Ровный прирост везде и союзники в новой палате.'},
];

function campActive(){ return !isOpp()&&!S.over&&inTerm()>=12&&inTerm()<=16; }

function campInit(){ if(!S.camp) S.camp={strategy:null,ads:0,debate:null,spent:0}; return S.camp; }
/* итоговая прибавка кампании к результату, в процентных пунктах */

function campBonus(rid){
  if(!S.camp) return 0;
  const c=S.camp; let v=0;
  const sup=rid?support(rid):approval();
  if(c.strategy==='base')   v+= sup>53? 3.4 : sup>47? 0.6 : -0.4;
  if(c.strategy==='swing')  v+= (sup>44&&sup<56)? 4.2 : sup>=56? -0.8 : 0.3;
  if(c.strategy==='attack') v+= 2.0;
  if(c.strategy==='unity')  v+= 1.9;
  v += Math.sqrt(c.ads)*1.35;                 // отдача рекламы падает с каждым траншем
  if(c.debate==='win') v+=3.2; else if(c.debate==='lose') v-=2.6;
  return v;
}

function campBlock(){
  if(!campActive()) return '';
  const c=campInit(), left=16-inTerm()+1;
  const strat=STRATEGIES.map(x=>`<button class="btn sm ${c.strategy===x.id?'on':'ghost'}" data-act="campStrat" data-arg="${x.id}">${x.name}</button>`).join('');
  const cur=STRATEGIES.find(x=>x.id===c.strategy);
  return `<div class="sec"><h2>Предвыборный штаб</h2><span class="note">до выборов ${left} сез.</span></div>

function debateResult(res,line){

function findRival(){
  const cand=REGIONS.map(r=>({r,g:rs(r.id).gov}))
    .filter(x=>x.g.pop>=63&&(x.g.loyal<45||x.g.party!==PLAYER)&&x.g.rating>=55)
    .sort((a,b)=>b.g.pop-a.g.pop)[0];
  if(!cand) return null;
  return {name:cand.g.name,region:cand.r.id,party:cand.g.party,pop:cand.g.pop};
}

/* ═══════════ Обещания президента ═══════════ */

function promiseValue(pr){
  const e=S.econ;
  if(pr.kind==='build')return e.rail;
  if(pr.kind==='below')return econField(pr.field);
  if(pr.kind==='growth')return r1((e.gdp/e.gdp0-1)*100);
  if(pr.kind==='programs')return REGIONS.filter(r=>rs(r.id).program).length;
  return 0;
}

function promiseDone(pr){
  const v=promiseValue(pr);
  return pr.kind==='below'?v<=pr.target:v>=pr.target;
}

/* Карточка обещаний на вкладке «Кабинет»: сколько уже сделано и сколько
   осталось до выборов, когда за каждое обещание спросят. */
function promiseCard(){
  if(isOpp()||!S.promises.length)return '';
  const left=Math.max(0,16-inTerm());
  const rows=S.promises.map(pp=>{
    const pr=PROMISES.find(p=>p.id===pp.id),v=promiseValue(pr),ok=promiseDone(pr),w=Math.round(promiseProgress(pr));
    return `<div class="blocrow"><div class="btop"><b>${pr.name}</b>
        <span class="bval num ${ok?'pos':'neg'}">${r1(v)}${pr.unit}</span></div>
      <div class="bsub">${ok?'обещание выполнено':'нужно '+(pr.kind==='below'?'не выше ':'')+pr.target+pr.unit}</div>
      <div class="meter" style="width:100%;margin-top:7px"><i style="width:${w}%;background:${ok?'var(--pos)':'var(--pnv)'}"></i></div></div>`;}).join('');
  return `<div class="sec"><h2>Обещания стране</h2><span class="note">спросят через ${left} ${left===1?'сезон':left<5?'сезона':'сезонов'}</span></div>
    <div class="card">${rows}<p class="hint">Выполненное обещание на выборах даёт поддержку и капитал, проваленное бьёт вдвое сильнее.</p></div>`;
}

function promiseProgress(pr){
  const v=promiseValue(pr);
  if(pr.kind==='below')return clamp(100-(v-pr.target)*12,0,100);
  return clamp(v/pr.target*100,0,100);
}

function choosePromises(){
  const chosen=[];
  const ask=()=>{
    const avail=PROMISES.filter(p=>chosen.indexOf(p.id)<0);
    sheet({eyebrow:'Инаугурация · обещание '+(chosen.length+1)+' из 2',title:'Что вы обещаете стране',
      body:'<p class="lead">Выполненное обещание перед выборами даёт поддержку и капитал, проваленное бьёт по доверию сильнее. Выберите два.</p>'+
        '<div class="picks">'+avail.map(p=>`<button class="btn sm ghost" data-pr="${p.id}">${p.name}</button>`).join('')+'</div>',
      buttons:chosen.length?[{label:'Хватит одного',ghost:true}]:[],
      after(){ document.querySelectorAll('[data-pr]').forEach(el=>el.onclick=()=>{
        chosen.push(el.dataset.pr);
        S.promises=chosen.map(id=>({id,given:S.season}));
        clearQueue();
        if(chosen.length<2){nextSheet();ask();}
        else {logMsg('Президент огласил программу: '+chosen.map(id=>PROMISES.find(p=>p.id===id).name).join('; ')+'.',true);nextSheet();}
      });}});
  };
  ask();
}

function checkPromises(){
  if(!S.promises.length)return '';
  let out='';
  S.promises.forEach(pp=>{
    const pr=PROMISES.find(p=>p.id===pp.id),ok=promiseDone(pr);
    if(ok){shiftApproval(4);pcAdd(12);}
    else {shiftApproval(-6);pcAdd(-8);}
    logMsg('Обещание «'+pr.name+'»: '+(ok?'выполнено':'провалено')+'.',true);
    chronicle('Обещание «'+pr.name.toLowerCase()+'»: '+(ok?'выполнено':'провалено')+'.',ok?'good':'bad');
    out+=`<span>${pr.name}</span><b class="w ${ok?'pos':'neg'}">${ok?'выполнено':'провалено'} · ${r1(promiseValue(pr))}${pr.unit}</b>`;
  });
  return '<div class="result">'+out+'</div>';
}

function fireEvent(){
  if(S.scandal.oligarch&&Math.random()<0.18){S.scandal.oligarch=false;shiftApproval(-6);
    logMsg('Сделка с олигархом раскрыта: поддержка −6.');
    sheet({eyebrow:'Скандал',title:'Расписка всплыла',body:'<p>Пресса опубликовала вашу договорённость с медиамагнатом.</p>'});return;}
  if(S.scandal.family&&Math.random()<0.15){S.scandal.family=false;shiftApproval(-5);
    logMsg('Расследование о семье вышло вместе с историей о договорённости.');
    sheet({eyebrow:'Скандал',title:'Черновик опубликован',body:'<p>Редакция выпустила материал о вашей семье — и о попытке его выкупить.</p>'});return;}
  if(regionCrisis())return;
  if(!isOpp()&&S.partyBills<9&&Math.random()<0.30&&partyBill())return;
  const yr=(S.season-1)%4;
  if(Math.random()<0.36){const ev=pick(CHOICE_EVENTS);
    sheet({eyebrow:'Событие сезона · '+SEASONS[yr].toLowerCase(),title:ev.t,body:'<p>'+ev.b+'</p>',buttons:ev.opts.map(o=>({label:o.l,fn:o.fn}))});return;}
  // мешок: события не повторяются, пока не кончатся подходящие сезону
  let bag=EVENTS.filter(e=>(e.season===null||e.season===yr)&&S.eventBag.indexOf(e.t)<0);
  if(!bag.length){S.eventBag=[];bag=EVENTS.filter(e=>e.season===null||e.season===yr);}
  const ev=pick(bag);S.eventBag.push(ev.t);
  const out=ev.fn();logMsg(ev.t+': '+out);
  sheet({eyebrow:'Событие сезона · '+SEASONS[yr].toLowerCase(),title:ev.t,
    body:'<p>'+ev.b+'</p><div class="result"><span>Последствия</span><b class="w">'+out+'</b></div>'});
}

function oppElection(){

  const bonus=(S.stability-50)*0.06+(50-S.govApproval)*0.38+mediaBacking()*7;

  const share=r1(mine/tot),oppSh=r1(theirs/tot);
  const map=mapSVG({fill:x=>{const e=res.find(z=>z.r.id===x.id);return e.sh>e.os?P(PLAYER).color:opp.color;},
    label:x=>Math.round(res.find(z=>z.r.id===x.id).sh)+'%'});
  const bars=`<div class="votebar" style="height:14px;border-radius:7px">
      <i style="width:${share}%;background:${P(PLAYER).color}"></i><i style="width:${oppSh}%;background:${opp.color}"></i><span class="thr"></span></div>

    S.mode='gov';S.termStart=S.season+1;S.termWon=true;S.gov=null;
    S.treasury=Math.max(S.treasury,90);S.govApproval=50;

    chronicle('Оппозиция вернулась в кабинет: '+share+'% на выборах.','good');

      buttons:[{label:'Принять присягу',fn:()=>{refreshOppLeader();S.promises=[];S.econ.gdp0=S.econ.gdp;S.econ.rail=0;choosePromises();}}]});
  } else {
    gameOver(false,'Второе поражение подряд: '+share+'% против '+oppSh+'%. Фракция ищет нового лидера.'+bars+map);
  }
}

function governorElections(){
  const flips=[];
  REGIONS.forEach(r=>{const q=rs(r.id);
    const sup=support(r.id);
    const incS=q.gov.rating+rnd(0,22)+(q.program?6:0)+(q.gov.party===PLAYER?(sup-50)*0.35:0);
    const others=PARTIES.filter(p=>p.id!==q.gov.party);
    const w=others.map(p=>{let v=(S.houseSeats[p.id]||5)+8;
      v+=p.id===PLAYER?(sup-48)*1.1:((S.relations[p.id]??50)-50)/4;
      if(sectorAffinity(p.id,r.sector))v+=6;return v;});
    let sum=w.reduce((a,b)=>a+Math.max(1,b),0),roll=Math.random()*sum,ch=others[0];
    for(let i=0;i<others.length;i++){roll-=Math.max(1,w[i]);if(roll<=0){ch=others[i];break;}}
    const chS=38+rnd(0,26)+(ch.id===PLAYER?(sup-50)*0.7:((S.relations[ch.id]??50)-50)/5)+q.unrest*0.15;
    if(chS>incS){const old=q.gov;q.gov=newGov(ch.id);
      flips.push(`<span>${r.name.replace(/ (регион|область|край)$/,'')}</span><b class="w">${P(old.party).short} → <span style="color:${ch.color}">${ch.short}</span></b>`);}
    else q.gov.rating=clamp(q.gov.rating+rnd(-6,8),25,90);});
  sheet({eyebrow:seasonLabel(S.season),title:'Губернаторские выборы',
    body:(flips.length?'<div class="result">'+flips.join('')+'</div>':'<p class="lead">Все действующие губернаторы удержали кресла.</p>')+
      mapSVG({labels:false})+'<p class="hint" style="text-align:center">новая карта губернаторов · Сенат обновлён</p>'});
  allocateSenate();
  logMsg('Губернаторские выборы: '+(flips.length?flips.length+' регион(ов) сменили партию.':'без перемен.'));
}
