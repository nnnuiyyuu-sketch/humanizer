<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>НОВАРИЯ — правительственный терминал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans+Narrow:wght@400;700&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Serif:wght@700&family=PT+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E4DED0; --sheet:#FAF7EF; --sheet2:#F1ECE0; --band:#1D1A15;
  --ink:#191510; --ink2:#57503f; --ink3:#8b8371;
  --rule:#C7BEA8; --rule2:#DED6C3;
  --red:#94271F; --green:#2A6144; --blue:#28496F; --gold:#9A7211; --violet:#5C3A6E;
  --hl:#EFE7D2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font:400 14px/1.42 'PT Sans',system-ui,sans-serif;
  background-image:repeating-linear-gradient(180deg,rgba(0,0,0,.014) 0 1px,transparent 1px 4px);
  min-height:100vh;
}
b,strong{font-weight:700}
.n{font-family:'PT Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.up{font-family:'PT Sans Narrow',sans-serif;text-transform:uppercase;letter-spacing:.09em}
.pos{color:var(--green)} .neg{color:var(--red)} .dim{color:var(--ink3)}

/* ── шапка ───────────────────────────────── */
#top{position:sticky;top:0;z-index:40;background:var(--band);color:#EDE6D4;
  display:flex;align-items:stretch;gap:14px;padding:0 12px;border-bottom:3px solid var(--gold);min-height:52px}
#top .brand{display:flex;align-items:center;gap:9px;padding:6px 0;flex:none}
#top .brand img{width:26px;height:29px;display:block;filter:saturate(.2) brightness(1.6)}
#top .brand b{font:700 15px/1.05 'PT Serif',serif;letter-spacing:.06em;display:block}
#top .brand span{font:400 9.5px/1.2 'PT Sans Narrow',sans-serif;text-transform:uppercase;letter-spacing:.14em;color:#A99C7C}
#strip{margin-left:auto;display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none}
#strip::-webkit-scrollbar{display:none}
.sv{padding:7px 13px;border-left:1px solid #3a352a;display:flex;flex-direction:column;justify-content:center;min-width:74px;flex:none}
.sv i{font:400 9px/1.2 'PT Sans Narrow',sans-serif;text-transform:uppercase;letter-spacing:.12em;color:#A99C7C;font-style:normal}
.sv b{font-family:'PT Mono',monospace;font-size:15px;font-weight:400;color:#F3ECD9;letter-spacing:-.03em;white-space:nowrap}
.sv b.warn{color:#E5A24A} .sv b.bad{color:#DE7B6C} .sv b.good{color:#8FC0A0}

/* ── каркас ──────────────────────────────── */
#shell{display:flex;align-items:flex-start;gap:0;max-width:1360px;margin:0 auto}
#side{position:sticky;top:52px;width:186px;flex:none;padding:10px 0 40px;
  border-right:1px solid var(--rule);min-height:calc(100vh - 52px);background:rgba(255,255,255,.22)}
.navb{display:flex;align-items:baseline;gap:7px;width:100%;text-align:left;background:none;border:0;
  border-left:3px solid transparent;padding:7px 12px 7px 13px;cursor:pointer;color:var(--ink2);
  font:400 13px 'PT Sans Narrow',sans-serif;text-transform:uppercase;letter-spacing:.08em}
.navb:hover{background:var(--hl);color:var(--ink)}
.navb.on{background:var(--sheet);border-left-color:var(--red);color:var(--ink);font-weight:700}
.navb u{margin-left:auto;text-decoration:none;font-family:'PT Mono',monospace;font-size:11px;letter-spacing:-.03em;color:var(--ink3)}
.navb.on u{color:var(--red)}
.navsec{font:400 9.5px 'PT Sans Narrow',sans-serif;text-transform:uppercase;letter-spacing:.16em;color:var(--ink3);
  padding:14px 13px 5px;border-bottom:1px solid var(--rule2);margin-bottom:4px}
#view{flex:1;min-width:0;padding:14px 16px 90px}

/* ── листы и заголовки ───────────────────── */
.sh{background:var(--sheet);border:1px solid var(--rule);margin-bottom:12px}
.sh>.hd{display:flex;align-items:center;gap:10px;padding:7px 11px;border-bottom:1px solid var(--rule);
  background:var(--sheet2)}
.sh>.hd h2{margin:0;font:700 12.5px 'PT Sans Narrow',sans-serif;text-transform:uppercase;letter-spacing:.1em}
.sh>.hd .note{margin-left:auto;font-size:11.5px;color:var(--ink3);text-align:right}
.sh>.bd{padding:11px}
.sh.acc{border-top:3px solid var(--red)}
.sh.accg{border-top:3px solid var(--green)}
.sh.accb{border-top:3px solid var(--blue)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
h3.rule{font:700 11px 'PT Sans Narrow',sans-serif;text-transform:uppercase;letter-spacing:.12em;color:var(--ink2);
  margin:14px 0 6px;padding-bottom:3px;border-bottom:1px solid var(--rule2)}
h3.rule:first-child{margin-top:0}
p{margin:0 0 8px} p:last-child{margin-bottom:0}
.lead{font-size:13.5px;color:var(--ink2)}
.hint{font-size:12px;color:var(--ink3);line-height:1.4}
.pin{border-left:3px solid var(--gold);background:#F3EBD6;padding:8px 10px;font-size:13px;margin-bottom:10px}
.pin b{font:700 10px 'PT Sans Narrow',sans-serif;text-transform:uppercase;letter-spacing:.12em;display:block;color:var(--ink2)}

/* ── таблицы ─────────────────────────────── */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:700 9.5px 'PT Sans Narrow',sans-serif;text-transform:uppercase;letter-spacing:.11em;color:var(--ink2);
  text-align:left;padding:4px 7px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--sheet2)}
td{padding:5px 7px;border-bottom:1px solid var(--rule2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--hl)}
td.r,th.r{text-align:right}
td.num{font-family:'PT Mono',monospace;text-align:right;font-size:12.5px;letter-spacing:-.03em;white-space:nowrap}
table.tight td,table.tight th{padding:3px 6px}
.scrollx{overflow-x:auto}

/* ── кнопки ──────────────────────────────── */
.b{font:400 12.5px 'PT Sans Narrow',sans-serif;text-transform:uppercase;letter-spacing:.08em;
  background:var(--sheet);color:var(--ink);border:1px solid var(--ink2);padding:5px 11px;cursor:pointer}
.b:hover{background:var(--ink);color:var(--sheet)}
.b:active{transform:translate(1px,1px)}
.b.p{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.b.p:hover{background:#000}
.b.d{border-color:var(--red);color:var(--red)}
.b.d:hover{background:var(--red);color:#fff}
.b.on{background:var(--red);border-color:var(--red);color:#fff}
.b[disabled]{border-color:var(--rule);color:var(--ink3);background:var(--sheet2);cursor:not-allowed;transform:none}
.b.sm{font-size:11px;padding:3px 7px}
.b.wide{width:100%;padding:9px;font-size:14px}
.brow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.b:focus-visible{outline:2px solid var(--gold);outline-offset:1px}

/* ── индикаторы ──────────────────────────── */
.bar{height:9px;background:var(--rule2);display:flex;position:relative;border:1px solid var(--rule)}
.bar i{display:block;height:100%}
.bar .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--ink)}
.mini{height:6px;background:var(--rule2);border:1px solid var(--rule);width:70px;display:inline-block;vertical-align:middle}
.mini i{display:block;height:100%;background:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
.chip s{width:9px;height:9px;flex:none;display:inline-block;text-decoration:none}
.tag{font:700 9px 'PT Sans Narrow',sans-serif;text-transform:uppercase;letter-spacing:.1em;
  border:1px solid currentColor;padding:1px 4px;white-space:nowrap}
.tag.g{color:var(--green)} .tag.r{color:var(--red)} .tag.b{color:var(--blue)} .tag.y{color:var(--gold)}
.stamp{display:inline-block;font:700 15px 'PT Sans Narrow',sans-serif;text-transform:uppercase;letter-spacing:.16em;
  border:2px solid currentColor;padding:4px 12px;transform:rotate(-4deg);opacity:.88;box-shadow:inset 0 0 0 1px currentColor}
.stamp.y{color:var(--green)} .stamp.n{color:var(--red)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px dotted var(--rule);font-size:13px}
.kv:last-child{border-bottom:none}
.kv b{font-family:'PT Mono',monospace;font-weight:400;letter-spacing:-.03em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}

/* ── шкала позиции ───────────────────────── */
.ax{margin-bottom:11px}
.ax .axh{display:flex;justify-content:space-between;font:400 10px 'PT Sans Narrow',sans-serif;
  text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);margin-bottom:3px}
.ax .axr{display:flex;gap:2px}
.ax .axr button{flex:1;height:26px;border:1px solid var(--rule);background:var(--sheet2);cursor:pointer;
  font:400 11px 'PT Mono',monospace;color:var(--ink3);padding:0}
.ax .axr button:hover{background:var(--hl)}
.ax .axr button.on{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.ax .now{font-size:11.5px;color:var(--ink2);margin-top:3px}

/* ── карта ───────────────────────────────── */
.mapbox{background:#141C26;border:1px solid var(--rule);padding:4px;max-width:860px;margin:0 auto}
.mapsvg{width:100%;display:block}
.rgn{stroke:#0C1219;stroke-width:1.4;cursor:pointer}
.rgn:hover{stroke:#F0E6CC;stroke-width:2.4}
.rgn.sel{stroke:#fff;stroke-width:2.8}
.caplbl{fill:#fff;font:700 15px 'PT Sans Narrow',sans-serif;pointer-events:none;
  paint-order:stroke;stroke:rgba(10,14,20,.92);stroke-width:4px;stroke-linejoin:round;letter-spacing:.04em}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--ink2);margin-top:7px}

/* ── парламент ───────────────────────────── */
.hemi{width:100%;display:block;max-height:270px}
.dep{cursor:pointer}
.dep:hover{stroke:var(--ink);stroke-width:1.4}
.whip{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--rule);margin-bottom:9px}
.whip div{padding:6px 9px;border-right:1px solid var(--rule)}
.whip div:last-child{border-right:none}
.whip i{display:block;font:400 9.5px 'PT Sans Narrow',sans-serif;text-transform:uppercase;letter-spacing:.12em;color:var(--ink3);font-style:normal}
.whip b{font-family:'PT Mono',monospace;font-size:19px;font-weight:400}

/* ── диалог ──────────────────────────────── */
#modal{position:fixed;inset:0;z-index:60;background:rgba(20,17,12,.55);display:none;
  align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto}
#modal.show{display:flex}
#modal .sheet{background:var(--sheet);border:1px solid var(--ink2);box-shadow:0 18px 50px rgba(0,0,0,.35);
  width:100%;max-width:620px;border-top:4px solid var(--red)}
#modal .sheet .mh{padding:9px 14px;border-bottom:1px solid var(--rule);background:var(--sheet2)}
#modal .sheet .mh i{font:400 9.5px 'PT Sans Narrow',sans-serif;text-transform:uppercase;letter-spacing:.14em;
  color:var(--ink3);font-style:normal;display:block}
#modal .sheet .mh h2{margin:1px 0 0;font:700 19px 'PT Serif',serif;line-height:1.15}
#modal .sheet .mb{padding:13px 14px;font-size:13.5px}
#modal .sheet .mf{padding:10px 14px;border-top:1px solid var(--rule);display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;background:var(--sheet2)}
.res{display:grid;grid-template-columns:1fr auto;gap:3px 14px;font-size:13px;margin:9px 0;
  border-top:1px solid var(--rule2);border-bottom:1px solid var(--rule2);padding:7px 0}
.res b{font-family:'PT Mono',monospace;font-weight:400;text-align:right;letter-spacing:-.03em}
.res b.w{font-family:'PT Sans',sans-serif;font-weight:700}
.opt{display:block;width:100%;text-align:left;background:var(--sheet2);border:1px solid var(--rule);
  padding:8px 10px;margin-bottom:6px;cursor:pointer;font:400 13px 'PT Sans',sans-serif;color:var(--ink)}
.opt:hover{border-color:var(--ink2);background:var(--hl)}
.opt b{display:block;font:700 13px 'PT Sans',sans-serif}
.opt span{font-size:11.5px;color:var(--ink3)}
input[type=text]{font:400 14px 'PT Sans',sans-serif;background:#fff;border:1px solid var(--rule);
  padding:6px 8px;color:var(--ink);width:100%}
input[type=text]:focus{outline:2px solid var(--gold);outline-offset:-1px}

/* ── журнал ──────────────────────────────── */
.log{font-size:12.5px}
.log div{padding:4px 0;border-bottom:1px dotted var(--rule)}
.log div:last-child{border-bottom:none}
.log s{text-decoration:none;font-family:'PT Mono',monospace;font-size:10.5px;color:var(--ink3);margin-right:7px}
.log div.k{background:#F3EBD6;padding:4px 6px;margin:0 -6px;border-bottom:1px dotted var(--rule)}

#toasts{position:fixed;right:12px;bottom:12px;z-index:70;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.toast{background:var(--band);color:#F0E9D7;padding:6px 11px;font-size:12.5px;border-left:3px solid var(--gold);
  animation:tin .15s ease, tout .3s ease 2.4s forwards}
@keyframes tin{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0}}

/* ── мобильная раскладка ─────────────────── */
@media(max-width:860px){
  #top{flex-wrap:wrap;padding:0 8px;gap:0}
  #top .brand{min-height:44px}
  #strip{width:100%;margin-left:0;order:3;border-top:1px solid #3a352a}
  .sv{padding:5px 10px;min-width:0}
  .sv:first-child{padding-left:0}
  .sv b{font-size:13.5px}
  #side{top:auto}
  #shell{display:block}
  #side{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;min-height:0;display:flex;overflow-x:auto;
    border-right:none;border-top:1px solid var(--rule);background:var(--sheet);padding:0;z-index:35;scrollbar-width:none}
  #side::-webkit-scrollbar{display:none}
  .navsec{display:none}
  .navb{flex:none;border-left:none;border-top:3px solid transparent;padding:9px 10px;white-space:nowrap;font-size:12px;letter-spacing:.05em}
  .navb.on{border-left:none;border-top-color:var(--red)}
  .navb u{display:none}
  #view{padding:11px 10px 74px}
  .cols,.cols3{grid-template-columns:1fr}
  #top .brand span{display:none}
}
@media(max-width:520px){
  .grid2{grid-template-columns:1fr}
  #modal{padding:10px 6px}
  .hide-s{display:none}
}
</style>
</head>
<body>
<header id="top">
  <div class="brand"><img id="emb" alt="Герб Республики Новария"><div>
    <b>НОВАРИЯ</b><span id="subtitle">правительственный терминал</span></div></div>
  <div id="strip"></div>
</header>
<div id="shell">
  <nav id="side"></nav>
  <main id="view"></main>
</div>
<div id="modal"><div class="sheet" id="msheet"></div></div>
<div id="toasts"></div>

/* ════════════════════════════════════════════════════════════════
   Ядро: состояние, экономика, настроения, парламент.
   ════════════════════════════════════════════════════════════════ */

let S = null;
const rnd  = (a,b)=>a+Math.random()*(b-a);
const ri   = (a,b)=>Math.round(rnd(a,b));
const pick = a=>a[Math.floor(Math.random()*a.length)];
const clamp= (v,a,b)=>v<a?a:v>b?b:v;
const r1   = v=>Math.round(v*10)/10;
const r2   = v=>Math.round(v*100)/100;
const sign = v=>(v>0?'+':'')+v;

/* устойчивый шум: один и тот же депутат по одному и тому же вопросу
   думает одинаково, пока не изменились обстоятельства */
function hash(str){ let h=2166136261;
  for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}
  return ((h>>>0)%10000)/10000; }
const noise = (str,amp)=>(hash(str)-0.5)*2*amp;

/* ─── партии ─────────────────────────────────────────────────── */
const PL = 'you';
function parties(){ return S.parties; }
function P(id){ return S.parties.find(p=>p.id===id); }
function me(){ return P(PL); }
function isPM(){ return S.gov.lead===PL; }
function coalition(){ return S.gov.coal; }
function inCoal(id){ return S.gov.coal.indexOf(id)>=0; }

/* ─── расстояние по осям ─────────────────────────────────────── */
function axDist(a,b,w){
  let s=0,tw=0;
  AX.forEach(k=>{ const ww=w?w[k]:1; s+=Math.abs((a[k]||0)-(b[k]||0))*ww; tw+=ww; });
  return s/tw;                               // 0…4
}
/* насколько группе нравится набор позиций: 100 — идеально */
function fitOf(g,st){ return clamp(100-axDist(g.pref,st,g.w)*34,2,100); }

/* ─── стартовое состояние ────────────────────────────────────── */
function initState(pl){
  REGIONS.forEach(r=>{ const s=Object.values(r.mix).reduce((a,b)=>a+b,0);
    r.share={}; GROUPS.forEach(g=>r.share[g.id]=(r.mix[g.id]||0)/s); });

  const player={id:PL,name:pl.name,short:pl.short,color:pl.color,st:{...pl.st},leader:pl.leader,
                base:[],funds:pl.funds!==undefined?pl.funds:60,mom:0};
  S={
    q:1, term:1, termStart:1, over:false, ended:null,
    parties:[player,...AIPARTIES.map(p=>({...p,st:{...p.st},funds:ri(40,90),mom:0}))],
    ap:3, cap:52, funds:60,
    treasury:45, debt:130,
    tax:{inc:2,corp:2,vat:2},
    spend:{def:2,pol:2,med:2,edu:2,soc:2,inf:2},
    econ:{gdp:100,gdp0:100,growth:1.2,inf:4.2,unemp:8.1,invest:100},
    cyc:{ph:Math.random(),len:ri(13,19)},      // фаза хозяйственного цикла
    world:{demand:100,res:100},                // внешний спрос и цены на сырьё
    comm:{}, rec:0,                            // комитеты и длина спада
    stab:58,
    mood:{}, rmod:{}, unrest:{},
    deputies:[], seats:{}, regSeats:{},
    gov:{lead:PL,coal:[PL],posts:{}},
    partners:{},                       // терпение союзников
    bill:null, billNo:0, laws:[], votes:[],
    pending:[], log:[], chron:[], hist:[],
    poll:0, camp:null, tab:'brief', sel:null, filter:'all',
    ev:{seen:[],cool:0}, shockCool:0, role:'pm', noConfCool:0, moodShock:{}, fatigue:0, govAge:0,
  };
  GROUPS.forEach(g=>S.mood[g.id]=clamp(fitOf(g,player.st)*0.5+20+rnd(-4,4),20,70));
  REGIONS.forEach(r=>{ S.rmod[r.id]=r1((r.dev-2)*1.5+rnd(-3,3)); S.unrest[r.id]=ri(6,18); });

  apportion();
  seedParliament();
  formCoalition(true);
  snapshot();
  logMsg('Правительство сформировано. Собрание созвано на '+dateLabel()+'.',1);
  chron('«'+player.name+'» формирует правительство.','g');
}

/* места по субъектам — метод наибольших остатков */
function apportion(){
  const tot=REGIONS.reduce((a,r)=>a+r.pop,0), q={}, rem=[];
  let used=0;
  REGIONS.forEach(r=>{ const ex=r.pop/tot*SEATS, n=Math.max(2,Math.floor(ex)); q[r.id]=n; used+=n;
    rem.push([r.id,ex-Math.floor(ex)]); });
  rem.sort((a,b)=>b[1]-a[1]);
  for(let i=0;used<SEATS;i++,used++) q[rem[i%rem.length][0]]++;
  S.regSeats=q;
}

/* доли голосов из «привлекательности»: мягкий степенной перевод,
   иначе мелкие фракции вымирают за один цикл */
function shareFrom(score){
  const out={},k=Object.keys(score);let sum=0;
  k.forEach(x=>{ out[x]=Math.pow(Math.max(score[x]-24,0.6),1.35); sum+=out[x]; });
  k.forEach(x=>out[x]=out[x]/sum*100);
  return out;
}

/* распределение мандатов по методу Д'Ондта */
function dhondt(shares,n){
  const out={},key=Object.keys(shares);
  key.forEach(k=>out[k]=0);
  for(let i=0;i<n;i++){
    let best=null,bv=-1;
    key.forEach(k=>{ const v=shares[k]/(out[k]+1); if(v>bv){bv=v;best=k;} });
    out[best]++;
  }
  return out;
}

function depName(){
  const used=S.deputies?S.deputies.map(d=>d.name):[];
  for(let i=0;i<40;i++){
    const f=Math.random()<0.34;
    const n=f?pick(NAME_F)+' '+pick(SURN_F):pick(NAME_M)+' '+pick(SURN_M);
    if(used.indexOf(n)<0)return n;
  }
  return pick(NAME_M)+' '+pick(SURN_M);
}
function makeDep(party,region,i){
  const p=P(party), st={};
  AX.forEach(k=>st[k]=clamp(r1((p.st[k]||0)+rnd(-0.7,0.7)),-2,2));
  return {id:party+'-'+region+'-'+i, name:depName(), party, region, st,
    loyal:ri(46,93), integ:ri(18,92), rel:clamp(Math.round(60-axDist(st,me().st)*11+rnd(-8,8)),8,92),
    deals:0, note:''};
}

/* первый созыв: голоса считаются по чистой идеологии */
function seedParliament(){
  S.deputies=[];
  const tot={}; S.parties.forEach(p=>tot[p.id]=0);
  REGIONS.forEach(r=>{
    const sh={};
    S.parties.forEach(p=>{
      let v=0; GROUPS.forEach(g=>v+=r.share[g.id]*fitOf(g,p.st));
      if(p.id===PL)v*=1.10;                       // премия действующей власти
      sh[p.id]=v;
    });
    const seats=dhondt(shareFrom(sh),S.regSeats[r.id]);
    Object.entries(seats).forEach(([pid,n])=>{
      tot[pid]+=n;
      for(let i=0;i<n;i++)S.deputies.push(makeDep(pid,r.id,i));
    });
  });
  S.seats=tot;
}
function seatsOf(id){ return S.seats[id]||0; }
function coalSeats(){ return coalition().reduce((a,id)=>a+seatsOf(id),0); }
const MAJ = Math.floor(SEATS/2)+1;

/* ─── формирование правительства ─────────────────────────────── */
function partyPrice(id){                     // сколько портфелей просит партия
  const s=seatsOf(id);
  return s>=30?3:s>=20?2:s>=10?2:1;
}
function formCoalition(initial){
  if(initial){
    // старт: игрок — первая партия, берёт в союзники ближайшую подходящую
    const order=S.parties.filter(p=>p.id!==PL).sort((a,b)=>axDist(a.st,me().st)-axDist(b.st,me().st));
    S.gov={lead:PL,coal:[PL],posts:{}};
    POSTS.forEach(p=>S.gov.posts[p.id]=PL);
    for(const p of order){
      if(coalSeats()>=MAJ)break;
      if(axDist(p.st,me().st)<1.9){
        S.gov.coal.push(p.id);
        const give=POSTS.slice(0,partyPrice(p.id)).map(x=>x.id);
        give.forEach((x,i)=>S.gov.posts[POSTS[POSTS.length-1-i].id]=p.id);
        S.partners[p.id]={patience:3,anger:0};
      }
    }
  }
}

/* ─── экономика ──────────────────────────────────────────────── */
function taxLoad(){ return (S.tax.inc+S.tax.corp+S.tax.vat)/3; }
function resIncome(){ return r1(((S.world?S.world.res:100)-100)*0.11*S.econ.gdp/100); }
function revenue(){
  const g=S.econ.gdp/100;
  let v=TAXES.reduce((a,t)=>a+t.yield*(S.tax[t.id]/2),0)*g+resIncome();
  if(S.gov.posts.fin===PL||inCoal(S.gov.posts.fin))v*=1.06;
  v*=clamp(1-avgUnrest()*0.004,0.7,1);
  return r1(v);
}
function outlay(){
  const g=0.55+S.econ.gdp/100*0.45;
  return r1(SPEND.reduce((a,s)=>a+s.base*(S.spend[s.id]/2),0)*g);
}
function interest(){ return r1(S.debt*0.016); }
function balance(){ return r1(revenue()-outlay()-interest()+lawSum('money')); }
function avgUnrest(){ let s=0,t=0; REGIONS.forEach(r=>{s+=S.unrest[r.id]*r.pop;t+=r.pop;}); return s/t; }
function lawSum(key){ return S.laws.reduce((a,l)=>a+(l.sum[key]||0),0); }

function cycleImpulse(){ return Math.sin((S.cyc?S.cyc.ph:0)*Math.PI*2)*2.0; }
function cyclePhase(){
  const v=cycleImpulse();
  return v>0.7?'подъём':v>0.2?'оживление':v>-0.2?'ровно':v>-0.7?'охлаждение':'спад';
}
function econTick(){
  const e=S.econ, W=S.world;
  // хозяйственный цикл идёт сам по себе, что бы вы ни делали
  S.cyc.ph+=1/S.cyc.len; if(S.cyc.ph>1){S.cyc.ph-=1;S.cyc.len=ri(13,19);}
  W.demand=clamp(W.demand+(100-W.demand)*0.06+rnd(-6.5,6.5),55,142);
  W.res=clamp(W.res+(100-W.res)*0.05+rnd(-9,9),45,168);
  const cyc=cycleImpulse();
  const invT = 100 + (W.demand-100)*0.16 + cyc*7 + (2-S.tax.corp)*9 + (2-S.tax.inc)*3 + (S.stab-55)*0.45
             + lawSum('invest') + S.spend.inf*3 - e.inf*1.6 - avgUnrest()*0.35;
  e.invest = clamp(e.invest+(invT-e.invest)*0.3+rnd(-2,2),25,190);
  const gT = 0.5 + cyc + (W.demand-100)*0.014 + (e.invest-100)*0.016 - (S.tax.corp-2)*0.16 + S.spend.inf*0.14 + S.spend.edu*0.05
           + lawSum('growth') - Math.max(0,e.inf-6)*0.12 - avgUnrest()*0.018
           - (e.gdp/100-1)*0.55;               // догоняющий рост выдыхается
  e.growth = r2(clamp(e.growth+(gT-e.growth)*0.4+rnd(-0.2,0.2),-6,7));
  e.gdp = r1(Math.max(45,e.gdp*(1+e.growth/100)));
  const uT = 8.4 - e.growth*1.05 - S.spend.inf*0.35 - S.spend.edu*0.1 + (S.tax.inc-2)*0.22 + lawSum('unemp')*4
           + (S.rec>1?1.4:0);                  // затяжной спад ломает рынок труда
  e.unemp = r1(clamp(e.unemp+(uT-e.unemp)*0.3+rnd(-0.2,0.2),2.5,26));
  const bal=balance(), defc=Math.max(0,-bal);
  const iT = 2.6 + Math.max(0,cyc)*0.55 + defc*0.10 + (S.tax.vat-2)*0.45 + (W.res-100)*0.022 + Math.max(0,(e.invest-130))*0.025
           + Math.max(0,e.growth-2)*0.55 + lawSum('inf') - (S.tax.corp-2)*0.05;
  e.inf = r1(clamp(e.inf+(iT-e.inf)*0.34+rnd(-0.25,0.25),0,32));
  S.treasury = r1(S.treasury+bal);
  if(S.treasury<0){ S.debt=r1(S.debt-S.treasury); S.treasury=0; }
  else if(S.treasury>90&&S.debt>0){ const pay=Math.min(S.debt,(S.treasury-90)*0.5);
    S.debt=r1(S.debt-pay); S.treasury=r1(S.treasury-pay); }
  S.rec = e.growth<0 ? (S.rec||0)+1 : 0;
  if(S.rec===2){ logMsg('Второй квартал падения подряд: в стране рецессия.',1);
    chron('Началась рецессия.','b'); shiftAll(-2.2); }
  S.stab = clamp(S.stab+(52-S.stab)*0.07-avgUnrest()*0.05+lawSum('stab')*0.6+rnd(-1.2,1.2),0,100);
}

/* ─── настроения ─────────────────────────────────────────────── */
function perfOf(g){
  const e=S.econ,c=g.care;let v=0;
  if(c.unemp) v+=c.unemp*(e.unemp-8)*2.1;
  if(c.inf)   v+=c.inf*(e.inf-4)*1.7;
  if(c.growth)v+=c.growth*(e.growth-1)*3.4;
  if(c.taxload)v+=c.taxload*(taxLoad()-2)*5.5;
  if(c.unrest)v+=c.unrest*(avgUnrest()-14)*0.55;
  ['def','pol','med','edu','soc'].forEach(k=>{ if(c[k])v+=c[k]*(S.spend[k]-2)*4.2; });
  if(c.infr)  v+=c.infr*(S.spend.inf-2)*4.2;
  return clamp(v,-30,30);
}
function moodTarget(g){
  // курс, дела и усталость от власти: чем дольше правите, тем меньше кредита
  const base=0.55*fitOf(g,me().st)+0.45*(52+perfOf(g))-(S.fatigue||0);
  return clamp(base+(S.moodShock&&S.moodShock[g.id]||0),3,97);
}
function moodTick(){
  GROUPS.forEach(g=>{ const t=moodTarget(g);
    S.mood[g.id]=clamp(S.mood[g.id]+(t-S.mood[g.id])*0.28+rnd(-1.1,1.1),2,98); });
  REGIONS.forEach(r=>{
    const t=(r.dev-2)*1.6-S.unrest[r.id]*0.16+(S.spend.inf-2)*0.8;
    S.rmod[r.id]=r1(clamp(S.rmod[r.id]+(t-S.rmod[r.id])*0.16,-22,22));
  });
}
function shiftMood(gid,v){ S.mood[gid]=clamp(S.mood[gid]+v,2,98); }
function shiftAll(v){ GROUPS.forEach(g=>shiftMood(g.id,v)); }
function approvalIn(gid,rid){ return clamp(S.mood[gid]+S.rmod[rid],0,100); }
function approval(){
  let s=0,t=0;
  REGIONS.forEach(r=>GROUPS.forEach(g=>{
    const w=r.pop*r.share[g.id]; s+=w*approvalIn(g.id,r.id); t+=w; }));
  return s/t;
}
function regApproval(rid){
  const r=R(rid);let s=0;
  GROUPS.forEach(g=>s+=r.share[g.id]*approvalIn(g.id,rid));
  return s;
}
/* без свежего опроса цифры показываются с погрешностью */
function polled(){ return S.poll===S.q; }
function shown(v,key){ return polled()?v:v+noise(key+S.q,3.2); }

/* ─── депутаты и голосование ─────────────────────────────────── */
function bigOpp(){
  return S.parties.filter(p=>p.id!==PL&&!inCoal(p.id)).sort((a,b)=>seatsOf(b.id)-seatsOf(a.id))[0];
}
function leaderLine(pid,bill){
  const p=P(pid), d=Math.abs((p.st[T(bill.topic).ax]||0)-bill.stance);
  if(pid===PL) return d>2.3?-1:1;
  let line = d<1.15?1:d>2.25?-1:0;
  if(inCoal(pid)&&line<1) line++;
  // оппозиционные фракции, стоящие рядом, держатся вместе против правительства
  if(!inCoal(pid)&&(bill.by||PL)===PL){
    const lead=bigOpp();
    if(lead&&lead.id!==pid&&axDist(lead.st,p.st)<1.3){
      const ld=Math.abs((lead.st[T(bill.topic).ax]||0)-bill.stance);
      if(ld>2.25)line=Math.min(line,0)-1;
    }
  }
  return clamp(line,-1,1);
}
function riderPull(dep,bill){
  let v=0;
  bill.riders.forEach(rd=>{
    if(rd==='money') v+= dep.region===bill.regTarget?16:-1.5;
    if(rd==='biz')   v+= (dep.st.econ+dep.st.tax)*3.2;
    if(rd==='work')  v+= -(dep.st.econ+dep.st.tax)*3.2;
    if(rd==='soft')  v+= 5-Math.abs(dep.st[T(bill.topic).ax]-bill.stance)*1.6;
  });
  return v;
}
function support(dep,bill){
  const ax=T(bill.topic).ax;
  let v=(0.95-Math.abs(dep.st[ax]-bill.stance))*22;
  v+=leaderLine(dep.party,bill)*dep.loyal*0.32;
  v+=(dep.rel-50)*0.30;
  v+=riderPull(dep,bill);
  if(inCoal(dep.party))v+=5;
  // профильный комитет: его председатель ведёт за собой однопартийцев
  const ch=S.comm&&S.comm[ax]?S.deputies.find(d=>d.id===S.comm[ax]):null;
  if(ch){ if(ch.id===dep.id)v+=7;
    if(ch.party===dep.party)v+=leaderLine(ch.party,bill)>=0?7:-3; }
  // чужой проект — повод его завалить, кто бы его ни вносил
  const mine=(bill.by||PL)===PL;
  if(mine&&!inCoal(dep.party))v-=9;
  if(!mine&&dep.party===PL)v-=9;
  if(!mine&&inCoal(dep.party)&&dep.party!==PL)v-=4;
  if(dep.pledge&&bill.id&&dep.pledgeNo===bill.id)v+=dep.pledge;
  v+=noise(dep.id+'|'+bill.topic+bill.stance+bill.riders.join('')+S.billNo,7);
  if(T(bill.topic).local&&bill.stance>0&&R(dep.region).capital)v-=6;
  return v;
}
function tally(bill){
  const t={yes:0,no:0,und:0,list:[]};
  S.deputies.forEach(d=>{
    const v=support(d,bill), st=v>10?'yes':v<-10?'no':'und';
    t[st]++; t.list.push({d,v,st});
  });
  return t;
}
function resolveVote(bill){
  const t=tally(bill);let yes=0,no=0;
  t.list.forEach(x=>{
    if(x.st==='yes')yes++; else if(x.st==='no')no++;
    else { const p=0.5+x.v/30; (Math.random()<p?yes++:no++); }
  });
  return {yes,no,pass:yes>no&&yes>=Math.ceil((yes+no)/2)+0};
}

/* ─── эффект принятого закона ────────────────────────────────── */
function billSum(bill){
  const t=T(bill.topic), k=bill.stance*(bill.riders.indexOf('soft')>=0?0.66:1), sum={};
  Object.entries(t.eff||{}).forEach(([key,v])=>sum[key]=r2(v*k));
  sum.gr={};
  Object.entries(t.gr||{}).forEach(([g,v])=>sum.gr[g]=r2(v*k));
  bill.riders.forEach(rd=>{
    if(rd==='biz'){ sum.gr.biz=(sum.gr.biz||0)+1.6; sum.gr.work=(sum.gr.work||0)-1; sum.once=(sum.once||0)-6; }
    if(rd==='work'){ sum.gr.work=(sum.gr.work||0)+1.6; sum.gr.biz=(sum.gr.biz||0)-1.2; sum.once=(sum.once||0)-7; }
    if(rd==='money'){ sum.once=(sum.once||0)-9; }
  });
  return sum;
}
function enact(bill){
  const sum=billSum(bill), t=T(bill.topic);
  // по каждой теме действует только последняя редакция
  const prev=S.laws.findIndex(l=>l.topic===bill.topic);
  if(prev>=0)S.laws.splice(prev,1);
  S.laws.push({no:++S.billNo, topic:bill.topic, stance:bill.stance, riders:[...bill.riders],
    q:S.q, sum, name:t.name, by:bill.by||PL});
  if(sum.once)S.treasury=r1(S.treasury+sum.once);
  if(t.rate&&Math.abs(bill.stance)>0)
    S.tax[t.rate]=clamp(S.tax[t.rate]-Math.round(bill.stance/1.4),0,4);
  Object.entries(sum.gr||{}).forEach(([g,v])=>shiftMood(g,v*1.5));
  if(sum.unrest)REGIONS.forEach(r=>S.unrest[r.id]=clamp(S.unrest[r.id]+sum.unrest*2,0,100));
  if(bill.regTarget){ S.rmod[bill.regTarget]=clamp(S.rmod[bill.regTarget]+3,-22,22);
    S.unrest[bill.regTarget]=clamp(S.unrest[bill.regTarget]-5,0,100); }
  // партия, чью позицию закон отражает, чувствует себя победителем
  S.parties.forEach(p=>{ if(p.id!==PL&&Math.abs(p.st[t.ax]-bill.stance)<0.9)p.mom=clamp(p.mom+1.5,-12,12); });
}

function lawOn(topic){ return S.laws.find(l=>l.topic===topic); }
/* постоянные эффекты законов пересчитываются каждый квартал через lawSum */

/* ─── журнал и летопись ──────────────────────────────────────── */
function dateLabel(q){ q=q||S.q; return SEASONS[(q-1)%4]+' '+(2029+Math.floor((q-1)/4)); }
function shortDate(q){ q=q||S.q; return (2029+Math.floor((q-1)/4))+'/'+QUARTERS[(q-1)%4]; }
function logMsg(t,key){ S.log.unshift({d:shortDate(),t,key:!!key}); if(S.log.length>240)S.log.pop(); }
function chron(t,kind){ S.chron.push({y:2029+Math.floor((S.q-1)/4),t,kind:kind||''}); }
function snapshot(){
  S.hist.push({q:S.q,ap:r1(approval()),gdp:r1(S.econ.gdp),gr:S.econ.growth,tr:Math.round(S.treasury),
    un:S.econ.unemp,inf:S.econ.inf,seats:seatsOf(PL),debt:Math.round(S.debt)});
  if(S.hist.length>90)S.hist.shift();
}
function toast(t){
  const b=document.getElementById('toasts');if(!b)return;
  const e=document.createElement('div');e.className='toast';e.textContent=t;b.appendChild(e);
  setTimeout(()=>e.remove(),2750);
}
/* ════════════════════════════════════════════════════════════════
   Ход игры: действия, события, коалиция, выборы.
   ════════════════════════════════════════════════════════════════ */

function useAP(n){ if(S.ap<n){toast('Не осталось действий на квартал');return false;} S.ap-=n; return true; }
function payCap(n){ if(S.cap<n){toast('Не хватает политического веса');return false;} S.cap-=n; return true; }
function payGold(n){ if(S.treasury<n){toast('В казне нет таких денег');return false;} S.treasury=r1(S.treasury-n); return true; }
function payFunds(n){ if(S.funds<n){toast('Партийная касса пуста');return false;} S.funds=r1(S.funds-n); return true; }
function addCap(n){ S.cap=clamp(S.cap+n,0,100); }

function capIncome(){
  let v=2.6+(approval()-46)*0.09+(seatsOf(PL)/SEATS)*7;
  if(!isPM())v=1.8+(approval()-42)*0.07+(seatsOf(PL)/SEATS)*5;
  v-=avgUnrest()*0.03;
  if(S.role==='junior')v+=1;
  return r1(clamp(v,-2,11));
}
function fundIncome(){
  let v=6+seatsOf(PL)*0.14+S.mood.biz*0.05;
  if(isPM())v+=3;
  return r1(v);
}

/* ─── действия кабинета ──────────────────────────────────────── */
const ACT = {
  visit(rid){
    if(!useAP(1)||!payGold(6))return;
    const r=R(rid);
    S.rmod[rid]=clamp(S.rmod[rid]+ri(3,6),-22,22);
    S.unrest[rid]=clamp(S.unrest[rid]-ri(4,9),0,100);
    logMsg('Поездка в '+r.cap+': поддержка в регионе выросла.');
    toast('Регион принял визит');
  },
  address(gid){
    if(!useAP(1)||!payCap(6))return;
    const g=G(gid);
    shiftMood(gid,ri(3,6));
    GROUPS.forEach(x=>{ if(x.id!==gid&&axDist(x.pref,g.pref)>2.2)shiftMood(x.id,-1.2); });
    logMsg('Обращение к нации: ставка на группу «'+g.name.toLowerCase()+'».');
    toast('Речь произнесена');
  },
  poll(){
    if(!useAP(1)||!payFunds(9))return;
    S.poll=S.q; logMsg('Заказана социология: цифры по стране уточнены.'); toast('Опрос готов');
  },
  fundraise(){
    if(!useAP(1))return;
    const v=ri(14,26)+Math.round(S.mood.biz*0.16);
    S.funds=r1(S.funds+v); shiftMood('intel',-1.4); shiftMood('work',-0.8);
    logMsg('Сбор средств: касса пополнена на '+v+' млн.');
    toast('+'+v+' млн в кассу');
  },
  noconf(){
    if(isPM()){toast('Вотум вносит оппозиция, а не вы');return;}
    if(S.noConfCool>0){toast('Собрание не примет новый вотум так скоро');return;}
    if(!useAP(1)||!payCap(22))return;
    confidenceVote(true);
  },
  whip(){
    if(!S.bill){toast('На столе нет проекта');return;}
    if(!useAP(1)||!payCap(11))return;
    const t=tally(S.bill);let n=0;
    t.list.forEach(x=>{ if(x.st!=='und')return;
      const g=inCoal(x.d.party)?ri(7,13):ri(2,7);
      x.d.pledge=(x.d.pledge||0)+g; x.d.pledgeNo=S.bill.id; n++; });
    logMsg('Работа с колеблющимися: обработано '+n+' депутатов.');
    toast(n?'Обработано: '+n:'Колеблющихся нет');
  },
  talk(pid){
    if(!useAP(1)||!payCap(5))return;
    const p=P(pid), n=S.deputies.filter(d=>d.party===pid);
    const g=ri(4,9);
    n.forEach(d=>d.rel=clamp(d.rel+g+ri(-2,2),0,100));
    if(S.partners[pid])S.partners[pid].anger=Math.max(0,S.partners[pid].anger-1);
    logMsg('Переговоры с фракцией «'+p.name+'»: отношения +'+g+'.');
    toast('Фракция выслушала вас');
  },
};

/* ─── работа с депутатом ─────────────────────────────────────── */
const LOBBY = [
  {id:'talk', name:'Личная беседа', cap:3, gold:0, txt:'Полчаса в кабинете и обещание помнить услугу.'},
  {id:'comm', name:'Место в комитете', cap:8, gold:0, txt:'Пост в профильном комитете. Однопартийцы заметят.'},
  {id:'cash', name:'Деньги округу', cap:0, gold:9, txt:'Стройка в его округе за счёт казны.'},
  {id:'dirt', name:'Разговор по-плохому', cap:6, gold:0, txt:'Намёк на папку. Сработает не со всяким.'},
  {id:'join', name:'Позвать во фракцию', cap:16, gold:10, need:d=>d.party!==PL&&d.rel>=64,
   txt:'Мандат переходит к вам. Его партия этого не забудет.'},
];
function lobby(depId,kind){
  const d=S.deputies.find(x=>x.id===depId), l=LOBBY.find(x=>x.id===kind);
  if(!d||!l)return;
  if(!useAP(1))return;
  if(l.cap&&!payCap(l.cap)){S.ap++;return;}
  if(l.gold&&!payGold(l.gold)){S.ap++;return;}
  d.deals++;
  if(kind==='talk'){ d.rel=clamp(d.rel+ri(6,12),0,100); d.note='беседовал с вами'; }
  if(kind==='comm'){ d.rel=clamp(d.rel+ri(14,22),0,100); d.note='получил комитет';
    const mate=S.deputies.filter(x=>x.party===d.party&&x.id!==d.id);
    if(mate.length){const m=pick(mate);m.rel=clamp(m.rel-ri(4,9),0,100);m.note='обойдён при дележе';} }
  if(kind==='cash'){ d.rel=clamp(d.rel+ri(10,18),0,100); d.note='получил стройку в округ';
    S.rmod[d.region]=clamp(S.rmod[d.region]+1.5,-22,22); }
  if(kind==='dirt'){
    if(Math.random()<clamp(d.integ/125,0.12,0.72)){
      d.rel=clamp(d.rel-ri(16,28),0,100); d.note='обиделся на нажим';
      shiftAll(-1.4); addCap(-6);
      logMsg('Депутат '+d.name+' вынес разговор на публику. Скандал.',1);
      chron('Скандал вокруг давления на депутата '+d.name+'.','b');
      sheetOpen({eye:'Утечка',title:'Разговор попал в газеты',
        body:'<p>'+d.name+' пересказал журналистам содержание беседы. Пресса пишет о шантаже в стенах Собрания.</p>',
        acts:[{label:'Принять к сведению'}]});
      render();return;
    }
    d.rel=clamp(d.rel+ri(18,30),0,100); d.note='стал сговорчивее';
  }
  if(kind==='join'){
    const from=d.party;
    const ch=clamp((d.rel-55)/58+(70-d.loyal)/150,0.08,0.82);
    if(Math.random()<ch){
      d.party=PL; d.rel=clamp(d.rel+6,0,100); d.loyal=ri(55,80); d.note='перешёл к вам';
      S.seats[from]--; S.seats[PL]=(S.seats[PL]||0)+1;
      S.deputies.filter(x=>x.party===from).forEach(x=>x.rel=clamp(x.rel-6,0,100));
      if(S.partners[from])S.partners[from].anger=clamp(S.partners[from].anger+1.5,0,6);
      logMsg('Депутат '+d.name+' перешёл из «'+P(from).name+'» в вашу фракцию.',1);
      chron('Депутат '+d.name+' сменил фракцию на вашу.','g');
    } else {
      d.rel=clamp(d.rel-15,0,100); d.note='отказал вам';
      S.deputies.filter(x=>x.party===from).forEach(x=>x.rel=clamp(x.rel-4,0,100));
      logMsg('Депутат '+d.name+' отказался переходить и рассказал об этом своим.',1);
    }
    render();return;
  }
  logMsg('Работа с депутатом: '+d.name+' ('+P(d.party).short+'), отношение '+Math.round(d.rel)+'.');
  toast('Отношение: '+Math.round(d.rel));
  render();
}

function setChair(ax,depId){
  if(!useAP(1)||!payCap(6))return;
  const old=S.comm[ax]?S.deputies.find(d=>d.id===S.comm[ax]):null;
  if(old){ old.rel=clamp(old.rel-9,0,100); old.note='потерял комитет'; }
  const d=S.deputies.find(x=>x.id===depId);
  S.comm[ax]=depId; d.rel=clamp(d.rel+11,0,100); d.note='возглавил комитет';
  logMsg('Комитет по теме «'+AXNAME[ax]+'» возглавил '+d.name+' ('+P(d.party).short+').');
  toast('Комитет закреплён');
  render();
}
function submitBill(){
  const b=S.bill; if(!b)return;
  if(!useAP(1)||!payCap(8))return;
  S.billNo++;
  const res=resolveVote(b), t=T(b.topic);
  const pass=res.yes>res.no;
  S.votes.unshift({no:S.billNo,q:S.q,name:t.name,stance:b.stance,yes:res.yes,no:res.no,pass});
  if(pass){
    enact(b);
    addCap(6); logMsg('Принят закон «'+t.name+'» ('+res.yes+' против '+res.no+').',1);
    chron('Собрание приняло закон «'+t.name.toLowerCase()+'».','g');
  } else {
    addCap(-4); shiftAll(-0.7);
    logMsg('Собрание отклонило «'+t.name+'» ('+res.yes+' против '+res.no+').',1);
    chron('Собрание отклонило «'+t.name.toLowerCase()+'».','b');
  }
  const bar=voteBar(res.yes,res.no);
  sheetOpen({eye:'Народное собрание · '+dateLabel(),title:t.name,
    body:`<p class="lead">${stanceLine(b)}</p>${bar}
      <div style="text-align:center;margin:14px 0 4px"><span class="stamp ${pass?'y':'n'}">${pass?'принят':'отклонён'}</span></div>
      ${pass?'<p class="hint">Закон вступает в силу с начала следующего квартала.</p>':
             '<p class="hint">Проект возвращён на доработку. Тот же текст второй раз внести нельзя.</p>'}`,
    acts:[{label:'Закрыть'}]});
  S.bill=null;
  render();
}

/* ─── коалиция и вотум ───────────────────────────────────────── */
function partnersTick(){
  if(!isPM())return;
  coalition().filter(id=>id!==PL).forEach(id=>{
    const p=P(id), st=S.partners[id]||(S.partners[id]={patience:3,anger:0});
    const posts=Object.values(S.gov.posts).filter(x=>x===id).length;
    const d=axDist(p.st,me().st);
    let strain=(d-1.5)*1.1+(partyPrice(id)-posts)*0.85;
    if(approval()<38)strain+=0.6; else if(approval()>56)strain-=0.5;
    st.anger=clamp(st.anger+strain,0,6);
    if(st.anger>=4&&Math.random()<0.45){
      leaveCoalition(id,'Фракция «'+p.name+'» вышла из коалиции: разошлись по курсу.');
    }
  });
}
function leaveCoalition(id,why){
  S.gov.coal=S.gov.coal.filter(x=>x!==id);
  Object.keys(S.gov.posts).forEach(k=>{ if(S.gov.posts[k]===id)S.gov.posts[k]=PL; });
  delete S.partners[id];
  logMsg(why,1); chron(why,'b'); addCap(-6);
  sheetOpen({eye:'Правительственный кризис',title:'Коалиция распалась',
    body:'<p>'+why+'</p><p>В коалиции осталось '+coalSeats()+' мандатов из '+SEATS+'. Для большинства нужно '+MAJ+'.</p>'+
      (coalSeats()<MAJ?'<p class="hint">Правительство меньшинства держится, пока оппозиция не соберёт вотум недоверия.</p>':''),
    acts:[{label:'Работать дальше'}]});
}
function offerPost(pid,post){
  if(!useAP(1))return;
  S.gov.posts[post]=pid;
  if(pid!==PL&&!inCoal(pid)){ S.gov.coal.push(pid); S.partners[pid]={patience:3,anger:1};
    logMsg('Фракция «'+P(pid).name+'» вошла в коалицию.',1);
    chron('«'+P(pid).name+'» вошла в правительство.','g'); }
  if(pid!==PL&&S.partners[pid])S.partners[pid].anger=Math.max(0,S.partners[pid].anger-2);
  S.deputies.filter(d=>d.party===pid).forEach(d=>d.rel=clamp(d.rel+6,0,100));
  toast('Портфель передан');
  render();
}
/* «да» — доверие действующему кабинету, кем бы он ни был */
function stateOfThings(){
  return 50+(S.econ.growth-1)*4-(S.econ.inf-4)*1.6-(S.econ.unemp-8)*1.5-(avgUnrest()-14)*0.4;
}
function confidenceVote(byPlayer){
  const going=stateOfThings();
  let yes=0,no=0;
  S.deputies.forEach(d=>{
    let v=(inCoal(d.party)?26:-17)+(going-50)*0.42+noise(d.id+'conf'+S.q,11);
    v+=(d.rel-50)*(isPM()?0.5:-0.42);      // личные связи работают на ту сторону, где вы
    if(d.party===PL)v+=isPM()?32:-32;
    (v>0?yes++:no++);
  });
  const govWins=yes>no;
  if(isPM()){
    if(govWins){ addCap(8); logMsg('Вотум недоверия провален: '+yes+' против '+no+'. Правительство устояло.',1); }
    else{ logMsg('Вотум недоверия принят: '+no+' против '+yes+'. Правительство отправлено в отставку.',1);
      chron('Собрание отправило правительство в отставку.','b'); fallGovernment(); }
    sheetOpen({eye:'Вотум недоверия',title:govWins?'Правительство устояло':'Правительство пало',
      body:voteBar(yes,no)+`<div style="text-align:center;margin:14px 0 2px">
        <span class="stamp ${govWins?'y':'n'}">${govWins?'доверие':'отставка'}</span></div>`+
        (govWins?'<p class="hint">Оппозиция не соберёт новый вотум раньше чем через два квартала.</p>':
                 '<p>Кабинет переходит к другой фракции. Ваши мандаты и право вносить законы остаются при вас.</p>'),
      acts:[{label:'Дальше'}]});
    S.noConfCool=govWins?2:0;
  } else {
    if(govWins){ addCap(-4); logMsg('Вотум недоверия провален: кабинет '+P(S.gov.lead).leader+' устоял ('+yes+':'+no+').',1); }
    else{ logMsg('Вотум недоверия принят: кабинет '+P(S.gov.lead).leader+' в отставке ('+no+':'+yes+').',1);
      chron('Оппозиция свалила правительство '+P(S.gov.lead).leader+'.','g');
      takePower(); }
    sheetOpen({eye:'Вотум недоверия',title:govWins?'Кабинет устоял':'Кабинет свалили',
      body:voteBar(yes,no)+`<div style="text-align:center;margin:14px 0 2px">
        <span class="stamp ${govWins?'n':'y'}">${govWins?'провал':'отставка'}</span></div>`+
        (govWins?'<p>Собрание оставило правительство на месте. Ваш вес просел, следующая попытка — не раньше чем через два квартала.</p>':
                 '<p>Правительство пало. Мандат на формирование кабинета переходит к вам.</p>'),
      acts:[{label:govWins?'Работать дальше':'Формировать кабинет',fn(){ if(!govWins)openCoalitionTalks(); }}]});
    S.noConfCool=2;
  }
}
function takePower(){
  S.govAge=0;
  S.gov={lead:PL,coal:[PL],posts:{}};
  POSTS.forEach(p=>S.gov.posts[p.id]=PL);
  S.partners={}; S.role='pm';
}
function fallGovernment(){
  S.govAge=0;
  const cand=S.parties.filter(p=>p.id!==PL).sort((a,b)=>seatsOf(b.id)-seatsOf(a.id))[0];
  S.gov={lead:cand.id,coal:[cand.id],posts:{}};
  POSTS.forEach(p=>S.gov.posts[p.id]=cand.id);
  S.parties.filter(p=>p.id!==PL&&p.id!==cand.id&&axDist(p.st,cand.st)<1.9)
    .forEach(p=>{ if(coalSeats()<MAJ)S.gov.coal.push(p.id); });
  S.role='opp';
  S.partners={};
}

/* ─── правительство ИИ, когда игрок в оппозиции ──────────────── */
function aiBudget(){
  const lead=P(S.gov.lead), bal=balance();
  if(bal<-6){                                  // дыру закрывают по-своему
    if(lead.st.tax<0){ const t=pick(TAXES.filter(x=>S.tax[x.id]<4)); if(t)S.tax[t.id]++; }
    else { const sp=pick(SPEND.filter(x=>S.spend[x.id]>0)); if(sp)S.spend[sp.id]--; }
  } else if(bal>4&&S.treasury>120){
    if(lead.st.tax>0){ const t=pick(TAXES.filter(x=>S.tax[x.id]>0)); if(t)S.tax[t.id]--; }
    else { const sp=pick(SPEND.filter(x=>S.spend[x.id]<4)); if(sp)S.spend[sp.id]++; }
  }
  if(S.treasury>200){                          // излишек не лежит мёртвым грузом
    S.treasury=r1(S.treasury-45); S.econ.invest+=5;
    const r=pick(REGIONS); S.rmod[r.id]=clamp(S.rmod[r.id]+2,-22,22);
    logMsg('Правительство пустило накопленный профицит на стройки в регионе '+R(r.id).name+'.');
  }
}

function govBill(){
  const lead=P(S.gov.lead);
  const t=pick(TOPICS.filter(x=>!x.special));
  const stance=clamp(Math.round(lead.st[t.ax]),-2,2);
  const bill={topic:t.id,stance,riders:[],by:lead.id};
  const res=resolveVote(bill);
  if(res.yes>res.no){
    enact(bill);
    logMsg('Правительство провело закон «'+t.name+'» ('+res.yes+':'+res.no+').',1);
  } else logMsg('Правительственный проект «'+t.name+'» провалился ('+res.yes+':'+res.no+').');
}

/* ─── партии живут своей жизнью ──────────────────────────────── */
function popularStance(){
  const pop={};
  AX.forEach(a=>{ let s=0,w=0;
    GROUPS.forEach(g=>{ const ww=g.w[a]*(0.4+S.mood[g.id]/100); s+=g.pref[a]*ww; w+=ww; });
    pop[a]=s/w; });
  return pop;
}
function partiesTick(){
  const pop=popularStance();
  S.parties.forEach(p=>{
    if(p.id===PL)return;
    const base=(AIPARTIES.find(x=>x.id===p.id)||p);
    AX.forEach(a=>{                                  // партия чует, куда идёт страна
      const v=p.st[a]+(pop[a]-p.st[a])*0.035;
      p.st[a]=r2(clamp(clamp(v,base.st[a]-0.8,base.st[a]+0.8),-2,2));
    });
    p.bad=p.mom<-6?(p.bad||0)+1:0;                   // затяжной провал стоит лидеру кресла
    if(p.bad>=3){
      p.leader=(Math.random()<0.4?pick(NAME_F)+' '+pick(SURN_F):pick(NAME_M)+' '+pick(SURN_M));
      p.bad=0; p.mom=r1(p.mom+4);
      logMsg('Во фракции «'+p.name+'» сменился лидер: теперь это '+p.leader+'.');
      chron('«'+p.name+'» сменила лидера.','');
    }
  });
}

function worldShock(){
  if(S.shockCool>0){S.shockCool--;return;}
  if(Math.random()>0.16)return;
  const pool=SHOCKS.filter(x=>x.cond());
  if(!pool.length)return;
  const bag=[];pool.forEach(e=>{for(let i=0;i<e.w;i++)bag.push(e);});
  const m=pick(bag).make();
  S.shockCool=3;
  logMsg(m.title+'.',1);
  sheetOpen({eye:m.eye,title:m.title,body:m.body,
    opts:m.opts.map(o=>({label:o.l,hint:o.h,fn:()=>{o.fn();render();}}))});
}

      {l:'Игнорировать',h:'',fn(){ shiftAll(-0.8); }}]})},
];
function fireEvent(){
  if(S.ev.cool>0){S.ev.cool--;return;}
  const pool=EVENTS.filter(e=>e.cond());
  if(!pool.length)return;
  const bag=[];pool.forEach(e=>{for(let i=0;i<e.w;i++)bag.push(e);});
  const e=pick(bag), m=e.make();
  S.ev.cool=1;
  sheetOpen({eye:m.eye,title:m.title,body:m.body,
    opts:m.opts.map(o=>({label:o.l,hint:o.h,fn:()=>{o.fn();render();}}))});
}
function later(n,key,data){ S.pending.push({at:S.q+n,key,data}); }
const AFTER={
  newMarkets(){ S.world.demand=clamp(S.world.demand+14,55,142); shiftMood('biz',3);
    return 'Новые рынки сбыта открылись: внешний спрос отчасти восстановлен.'; },
  promiseChair(d){ const x=S.deputies.find(y=>y.id===d.id);
    if(x){ x.rel=clamp(x.rel-16,0,100); x.note='не дождался обещанного'; }
    return 'Председатель комитета '+d.name+' так и не дождался обещанного.'; },
  moneyGone(d){ if(Math.random()<0.45){ S.unrest[d.r]=clamp(S.unrest[d.r]+12,0,100); shiftAll(-1.5);
      return 'Транш региону '+R(d.r).name+' разошёлся неизвестно куда.'; }
    S.rmod[d.r]=clamp(S.rmod[d.r]+2,-22,22);
    return 'Деньги, отправленные в '+R(d.r).name+', дошли до строек.'; },
  autonomy(d){ S.deputies.filter(x=>x.region===d.r).forEach(x=>x.rel=clamp(x.rel-12,0,100));
    shiftMood('patr',-2);
    return 'Обещанной автономии регион '+R(d.r).name+' не увидел.'; },
  unionBack(){ shiftMood('work',-5); REGIONS.forEach(r=>S.unrest[r.id]=clamp(S.unrest[r.id]+5,0,100));
    return 'Профсоюзы вернулись к требованиям, теперь жёстче.'; },
  giftLeak(){ if(Math.random()<0.55){ shiftAll(-3); addCap(-7);
      return 'Пресса раскопала происхождение пожертвования в кассу партии.'; }
    return ''; },
  probe(d){ if(Math.random()<0.5){ shiftMood('intel',4); shiftMood('urban',3); addCap(5);
      return 'Комиссия по делу «'+d.t+'» довела расследование до конца.'; }
    shiftAll(-2); return 'Комиссия по делу «'+d.t+'» тихо самораспустилась.'; },
  strikeAfter(d){ S.unrest[d.r]=clamp(S.unrest[d.r]+14,0,100); shiftMood('work',-4);
    return 'Забастовка в '+R(d.r).cap+' переросла в затяжной конфликт.'; },
  freezeAfter(){ S.econ.inf=r1(S.econ.inf+3.2); shiftMood('biz',-3); shiftMood('urban',-3);
    return 'Заморозка цен кончилась дефицитом и скачком инфляции.'; },
  graftLeak(d){ shiftAll(-2.4); addCap(-8);
    return 'Всплыло, что дело депутата '+d.name+' закрыли по звонку.'; },
  borderLeak(){ shiftMood('patr',-6); shiftMood('intel',-3);
    return 'Газеты раскопали замятый пограничный инцидент.'; },
  promiseEdu(){ if(S.spend.edu>=3){shiftMood('youth',5);return 'Обещание по школам выполнено: молодёжь заметила.';}
    shiftMood('youth',-7); return 'Обещанной реформы образования не случилось.'; },
};
function pendingTick(){
  const due=S.pending.filter(p=>p.at<=S.q);
  S.pending=S.pending.filter(p=>p.at>S.q);
  due.forEach(p=>{ const f=AFTER[p.key]; if(!f)return;
    const txt=f(p.data||{}); if(txt)logMsg(txt,1); });
}

/* ─── конец квартала ─────────────────────────────────────────── */
function endQuarter(){
  if(S.over)return;
  const bal=balance();
  econTick();
  REGIONS.forEach(r=>{
    let du=(17-S.unrest[r.id])*0.2                     // всегда есть о чём ворчать
          +(S.econ.unemp-8)*0.5+(S.econ.inf-4)*0.38-(S.spend.pol-2)*1.3-(regApproval(r.id)-50)*0.09
          -(S.spend.soc-2)*0.6+(r.dev<2?1.2:0)+rnd(-2,2);
    if(S.gov.posts.mvd===PL)du-=0.6;
    S.unrest[r.id]=clamp(S.unrest[r.id]+du,0,100);
  });
  S.fatigue=clamp((S.fatigue||0)+(isPM()?0.32:-0.5),0,10);   // усталость избирателя от вашей власти
  S.govAge=(S.govAge||0)+1;                                  // возраст действующего кабинета
  moodTick();
  S.cap=clamp(S.cap+capIncome(),0,100);
  S.funds=r1(S.funds+fundIncome());
  const going=stateOfThings();
  S.parties.forEach(p=>{ if(p.id===PL)return;
    // когда в стране плохо, оппозиция набирает вес просто потому, что она не власть
    const opp=!inCoal(p.id);
    p.mom=r1(clamp(p.mom*0.84+(opp?(48-going)*0.10:(going-48)*0.05),-14,14)); });
  partnersTick();
  partiesTick();
  defections();
  pendingTick();
  if(!isPM()){govBill();aiBudget();}
  else if(Math.random()<0.35)oppositionBill();
  worldShock();
  fireEvent();

  logMsg('Квартал закрыт. Бюджет '+sign(bal)+' млрд, в казне '+Math.round(S.treasury)+' млрд.');
  S.q++; S.ap=3; S.sel=null;
  snapshot();

  // вотум недоверия при правительстве меньшинства
  if(isPM()&&coalSeats()<MAJ&&!(S.noConfCool>0)&&(approval()<44||Math.random()<0.45)) confidenceVote();
  else if(S.noConfCool>0)S.noConfCool--;

  checkEnd();
  const t=S.q-S.termStart+1;
  if(t===TERM-CAMP+1&&!S.camp)campaignStart();
  if(t>TERM)election();
  save();
  render();
}
function oppositionBill(){
  const opp=S.parties.filter(p=>p.id!==PL&&!inCoal(p.id)).sort((a,b)=>seatsOf(b.id)-seatsOf(a.id))[0];
  if(!opp)return;
  const t=pick(TOPICS.filter(x=>!x.special));
  const bill={topic:t.id,stance:clamp(Math.round(opp.st[t.ax]),-2,2),riders:[],by:opp.id};
  const res=resolveVote(bill);
  if(res.yes>res.no){
    enact(bill); addCap(-5);
    logMsg('Оппозиция провела свой закон «'+t.name+'» через голову правительства ('+res.yes+':'+res.no+').',1);
    chron('Оппозиция провела «'+t.name.toLowerCase()+'».','b');
  }
}
function checkEnd(){
  if(S.over)return;
  if(S.debt>430){ finish(false,'Долг перевалил за 430 млрд, кредиторы закрыли рынки. Объявлен дефолт.'); return; }
  const ap=approval();
  if(ap<19){ finish(false,'Одобрение упало до '+Math.round(ap)+'%. Улица и Собрание вынудили вас уйти.'); return; }
  if(avgUnrest()>72){ finish(false,'Страна в волнениях: средняя напряжённость превысила критическую черту.'); return; }
}

/* ─── кампания ───────────────────────────────────────────────── */
function campaignStart(){
  S.camp={ads:{},rally:{},debate:null,spent:0};
  sheetOpen({eye:'Кампания открыта',title:'До выборов четыре квартала',
    body:'<p>Штаб развёрнут. В разделе «Кампания» можно закупать рекламу под конкретную группу избирателей, ездить с митингами по субъектам и готовиться к дебатам.</p>'+
      '<p class="hint">Всё это тратит партийную кассу, а не казну. Казённые деньги на кампанию тратить нельзя — заметят.</p>',
    acts:[{label:'В штаб',fn:()=>{S.tab='camp';}}]});
}
function campBoost(gid,rid){
  if(!S.camp)return 0;
  return (S.camp.ads[gid]||0)*1.05 + (S.camp.rally[rid]||0)*1.5 + (S.camp.debate||0);
}
const CAMPACT={
  ads(gid){ if(!payFunds(16))return; S.camp.ads[gid]=(S.camp.ads[gid]||0)+1; S.camp.spent+=16;
    toast('Ролики пошли в эфир'); render(); },
  rally(rid){ if(!useAP(1)||!payFunds(11))return; S.camp.rally[rid]=(S.camp.rally[rid]||0)+1;
    S.rmod[rid]=clamp(S.rmod[rid]+2,-22,22); toast('Митинг собран'); render(); },
  debate(tone){
    if(S.camp.debate!==null){toast('Дебаты уже прошли');return;}
    const rivals=S.parties.filter(p=>p.id!==PL).sort((a,b)=>seatsOf(b.id)-seatsOf(a.id));
    const riv=rivals[0];
    let ch=0.5+(approval()-48)*0.012;
    if(tone==='hard')ch+=0.06-axDist(riv.st,me().st)*0.02;
    if(tone==='calm')ch+=0.03;
    if(tone==='numbers')ch+=(S.econ.growth-1)*0.06-(S.econ.inf-4)*0.03;
    const win=Math.random()<clamp(ch,0.15,0.85);
    S.camp.debate=win?2.6:-1.6;
    if(win){shiftAll(2);addCap(6);}else{shiftAll(-1.6);}
    sheetOpen({eye:'Теледебаты',title:win?'Вы выиграли эфир':'Эфир достался сопернику',
      body:'<p>Против вас — '+riv.leader+' («'+riv.name+'»). '+
        (win?'После эфира ваши цифры подросли по всей стране.':'Соперник выглядел убедительнее, и это заметили.')+'</p>',
      acts:[{label:'Дальше'}]});
    render();
  },
};

/* ─── выборы ─────────────────────────────────────────────────── */
/* власть изнашивается: чем дольше кабинет у руля, тем охотнее голосуют против */
function incumbencySwing(pid){
  const age=S.govAge||0;
  return inCoal(pid)? -Math.min(9,age*0.28) : Math.min(6,age*0.18);
}
/* ядро партии — две группы, которым её курс ближе всего */
function coreGroups(st){
  return GROUPS.slice().sort((a,b)=>fitOf(b,st)-fitOf(a,st)).slice(0,2).map(g=>g.id);
}
function partyScore(p,r){
  let v=0;
  const mine=p.id===PL?coreGroups(me().st):null;
  GROUPS.forEach(g=>{
    let a;
    // у вас идеология работает вместе с делами: провал в глазах группы стоит мандатов
    if(p.id===PL) a=fitOf(G(g.id),me().st)*0.55+30+(approvalIn(g.id,r.id)-50)*1.15+campBoost(g.id,r.id)
                      +(isPM()?(stateOfThings()-48)*0.22:incumbencySwing(PL))+(mine.indexOf(g.id)>=0?7:0);
    else{
      a=fitOf(G(g.id),p.st)*0.92+p.mom*1.2+incumbencySwing(p.id);
      if(inCoal(p.id))a+=(stateOfThings()-48)*0.14;
      if(p.base&&p.base.indexOf(g.id)>=0)a+=7;
    }
    v+=r.share[g.id]*a;
  });
  return v;
}
function election(){
  const votes={},seatsNew={};
  S.parties.forEach(p=>{votes[p.id]=0;seatsNew[p.id]=0;});
  const regRes={};
  REGIONS.forEach(r=>{
    const sc={},tot=[];
    S.parties.forEach(p=>{ sc[p.id]=partyScore(p,r); });
    const share=shareFrom(sc);
    S.parties.forEach(p=>votes[p.id]+=share[p.id]*r.pop);
    const st=dhondt(share,S.regSeats[r.id]);
    Object.entries(st).forEach(([k,v])=>seatsNew[k]+=v);
    regRes[r.id]={share,st};
  });
  const popTot=REGIONS.reduce((a,r)=>a+r.pop,0);
  const nat={};S.parties.forEach(p=>nat[p.id]=r1(votes[p.id]/popTot));

  // новый созыв: депутаты переизбираются, часть кресел меняет хозяев
  const old=S.deputies;
  S.deputies=[];
  REGIONS.forEach(r=>{
    Object.entries(regRes[r.id].st).forEach(([pid,n])=>{
      const inc=old.filter(d=>d.party===pid&&d.region===r.id);
      for(let i=0;i<n;i++){
        if(inc[i]){ const d=inc[i]; d.rel=clamp(d.rel*0.9+8,0,100); d.deals=0; d.note=''; S.deputies.push(d); }
        else S.deputies.push(makeDep(pid,r.id,'n'+i+S.q));
      }
    });
  });
  S.seats=seatsNew;
  S.camp=null; S.term++; S.termStart=S.q; S.govAge=0;
  S.parties.forEach(p=>p.mom=0);

  if(S.term>3){ showResults(nat,seatsNew,regRes);
    finish(seatsNew[PL]>=seatsOf(PL),'Три созыва подряд — предел, отпущенный конституцией Новарии. Вы передаёте дела преемнику.');
    return; }
  const mine=seatsNew[PL], win=mine>=MAJ;
  logMsg('Выборы: «'+me().name+'» — '+nat[PL]+'% и '+mine+' мандатов.',1);
  chron('Выборы: «'+me().name+'» получила '+mine+' мандатов.',mine>=MAJ?'g':'');
  showResults(nat,seatsNew,regRes);
}
function showResults(nat,seats,regRes){
  const order=S.parties.slice().sort((a,b)=>seats[b.id]-seats[a.id]);
  const rows=order.map(p=>`<tr><td><span class="chip"><s style="background:${p.color}"></s>${p.name}${p.id===PL?' <span class="tag y">вы</span>':''}</span></td>
    <td class="num">${nat[p.id]}%</td><td class="num">${seats[p.id]}</td></tr>`).join('');
  const bar=`<div class="bar" style="height:16px;margin:6px 0 10px">${order.map(p=>
    `<i style="width:${seats[p.id]/SEATS*100}%;background:${p.color}"></i>`).join('')}<span class="mid"></span></div>`;
  const mine=seats[PL];
  sheetOpen({eye:'Всеобщие выборы · '+dateLabel(),title:'Итоги голосования',
    body:bar+'<table class="tight"><thead><tr><th>Партия</th><th class="r">Голоса</th><th class="r">Мандаты</th></tr></thead><tbody>'+rows+'</tbody></table>'+
      `<p class="hint" style="margin-top:9px">Для большинства нужно ${MAJ} мандатов. У вас ${mine}.</p>`,
    acts:[{label:'К формированию правительства',fn:()=>openFormation(seats)}]});
}

/* ─── формирование правительства после выборов ───────────────── */
function openFormation(seats){
  const order=S.parties.slice().sort((a,b)=>seatsOf(b.id)-seatsOf(a.id));
  if(order[0].id===PL||seatsOf(PL)>=MAJ){
    S.gov={lead:PL,coal:[PL],posts:{}};POSTS.forEach(p=>S.gov.posts[p.id]=PL);
    S.partners={};S.role='pm';
    if(seatsOf(PL)>=MAJ){
      sheetOpen({eye:'Мандат на правление',title:'У вас абсолютное большинство',
        body:'<p>'+seatsOf(PL)+' мандатов из '+SEATS+'. Правительство формируется без союзников: все портфели ваши, ни один партнёр не диктует условий.</p>',
        acts:[{label:'Приступить'}]});
    } else openCoalitionTalks();
  } else {
    const lead=order[0];
    // ИИ строит коалицию и может позвать игрока
    S.gov={lead:lead.id,coal:[lead.id],posts:{}};
    POSTS.forEach(p=>S.gov.posts[p.id]=lead.id);
    const others=S.parties.filter(p=>p.id!==lead.id).sort((a,b)=>axDist(a.st,lead.st)-axDist(b.st,lead.st));
    let invite=null;
    others.forEach(p=>{
      if(coalSeats()>=MAJ)return;
      if(axDist(p.st,lead.st)<1.95){
        if(p.id===PL){invite=lead;}
        else{S.gov.coal.push(p.id);
          POSTS.slice(0,partyPrice(p.id)).forEach((x,i)=>S.gov.posts[POSTS[POSTS.length-1-i].id]=p.id);}
      }
    });
    if(invite&&coalSeats()+seatsOf(PL)>=MAJ){
      sheetOpen({eye:'Предложение',title:'Вас зовут в правительство',
        body:'<p>«'+lead.name+'» набрала '+seatsOf(lead.id)+' мандатов и не дотягивает до большинства. '+
          lead.leader+' предлагает вам два портфеля и место младшего партнёра.</p>'+
          '<p class="hint">В коалиции у вас будет вес и деньги, но курс задаёт не ваша партия. Отказ — чистая оппозиция.</p>',
        opts:[
          {label:'Войти в коалицию',hint:'Два портфеля, влияние без первого кресла',fn(){
            S.gov.coal.push(PL);S.gov.posts.soc=PL;S.gov.posts.mid=PL;S.role='junior';
            logMsg('«'+me().name+'» вошла в правительство '+lead.leader+' младшим партнёром.',1);
            chron('Ваша партия — младший партнёр в правительстве.','');render();}},
          {label:'Уйти в оппозицию',hint:'Свобода рук и четыре года критики',fn(){
            S.role='opp';logMsg('Вы отказались от портфелей и возглавили оппозицию.',1);render();}}]});
    } else {
      S.role='opp';
      sheetOpen({eye:'Правительство сформировано',title:'Вы в оппозиции',
        body:'<p>Кабинет возглавил '+lead.leader+' («'+lead.name+'»). Ваша фракция — '+seatsOf(PL)+' мандатов — уходит в оппозицию.</p>'+
          '<p class="hint">Оппозиция вносит законы, требует вотума недоверия и готовится к следующим выборам. Бюджет теперь не ваш.</p>',
        acts:[{label:'Принять'}]});
    }
  }
}
function openCoalitionTalks(){
  const need=MAJ-seatsOf(PL);
  const cands=S.parties.filter(p=>p.id!==PL).sort((a,b)=>axDist(a.st,me().st)-axDist(b.st,me().st));
  const rows=cands.map(p=>{
    const d=axDist(p.st,me().st), ok=d<2.05;
    return `<tr><td><span class="chip"><s style="background:${p.color}"></s>${p.name}</span></td>
      <td class="num">${seatsOf(p.id)}</td><td class="num">${r1(d)}</td>
      <td class="r">${ok?`<button class="b sm" data-coal="${p.id}">Позвать · ${partyPrice(p.id)} портфеля</button>`:'<span class="dim">не пойдут</span>'}</td></tr>`;}).join('');
  sheetOpen({eye:'Переговоры о коалиции',title:'Нужно собрать большинство',
    body:`<p class="lead">У вашей партии ${seatsOf(PL)} мандатов, до большинства не хватает ${need}.</p>
      <table class="tight"><thead><tr><th>Фракция</th><th class="r">Мандаты</th><th class="r">Расхождение</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table>
      <p class="hint">Расхождение выше 2,0 — партия не сядет за стол ни за какие портфели. Каждый союзник забирает портфели и будет тянуть курс на себя.</p>`,
    acts:[{label:'Править меньшинством',fn(){
      S.role='pm';
      logMsg('Сформировано правительство меньшинства.',1);}}],
    after(){
      document.querySelectorAll('[data-coal]').forEach(b=>b.onclick=()=>{
        const id=b.dataset.coal;
        S.gov.coal.push(id);S.partners[id]={patience:3,anger:1};
        POSTS.slice(0,partyPrice(id)).forEach((x,i)=>S.gov.posts[POSTS[POSTS.length-1-i].id]=id);
        S.role='pm';
        logMsg('«'+P(id).name+'» вошла в коалицию.',1);
        if(coalSeats()>=MAJ){ modalClose(); sheetOpen({eye:'Коалиция собрана',title:'Правительство большинства',
          body:'<p>В коалиции '+coalSeats()+' мандатов. Кабинет утверждён Собранием.</p>',acts:[{label:'Работать'}]}); }
        else openCoalitionTalks();
        render();
      });
    }});
}

/* ─── финал ──────────────────────────────────────────────────── */
function score(){
  const ap=approval();
  let s=Math.round(ap*3+seatsOf(PL)*2.2+S.laws.filter(l=>l.by===PL).length*7
    +(S.econ.gdp-100)*2.4-S.debt*0.12-avgUnrest()*1.6+(S.term-1)*40);
  const t=s>620?'Основатель республики':s>470?'Сильный премьер':s>340?'Крепкий хозяйственник':
          s>210?'Проходная фигура':s>90?'Слабое правление':'Провал';
  return {s,t};
}
function finish(won,why){
  S.over=true;S.ended=why;
  const {s,t}=score();
  chron(why,won?'g':'b');
  sheetOpen({eye:'Итог правления',title:won?'Срок отработан':'Конец карьеры',
    body:`<p>${why}</p>
      <div class="res"><span>Кварталов у власти</span><b>${S.q-1}</b>
        <span>Законов проведено</span><b>${S.laws.filter(l=>l.by===PL).length}</b>
        <span>Мандатов в Собрании</span><b>${seatsOf(PL)}</b>
        <span>Одобрение на финише</span><b>${Math.round(approval())}%</b>
        <span>ВВП, индекс</span><b>${r1(S.econ.gdp)}</b>
        <span>Долг</span><b>${Math.round(S.debt)} млрд</b></div>
      <div style="text-align:center;margin:12px 0 4px"><span class="stamp ${won?'y':'n'}">${s} очков</span></div>

const SAVE='novaria.save.v1';
function save(){ try{ localStorage.setItem(SAVE,JSON.stringify(S)); }catch(e){} }
function load(){
  try{ const raw=localStorage.getItem(SAVE); if(!raw)return false;
    const d=JSON.parse(raw); if(!d||!d.parties)return false;
    S=d;
    REGIONS.forEach(r=>{ const s=Object.values(r.mix).reduce((a,b)=>a+b,0);
      r.share={};GROUPS.forEach(g=>r.share[g.id]=(r.mix[g.id]||0)/s); });

const mq=[]; let mopen=false;
function sheetOpen(m){ mq.push(m); if(!mopen)mnext(); }
function mnext(){
  const m=mq.shift();
  const wrap=document.getElementById('modal'), sh=document.getElementById('msheet');
  if(!m){ mopen=false; wrap.classList.remove('show'); return; }
  mopen=true;
  const acts=(m.acts||[{label:'Закрыть'}]).map((a,i)=>
    `<button class="b ${i===0?'p':''}" data-a="${i}">${a.label}</button>`).join('');
  const opts=(m.opts||[]).map((o,i)=>
    `<button class="opt" data-o="${i}"><b>${o.label}</b>${o.hint?`<span>${o.hint}</span>`:''}</button>`).join('');
  sh.innerHTML=`<div class="mh"><i>${m.eye||''}</i><h2>${m.title||''}</h2></div>
    <div class="mb">${m.body||''}${opts?'<div style="margin-top:10px">'+opts+'</div>':''}</div>
    ${m.opts?'':`<div class="mf">${acts}</div>`}`;
  wrap.classList.add('show'); wrap.scrollTop=0;
  // обработчик может открыть следующее окно сам — тогда очередь не двигаем
  sh.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
    const a=(m.acts||[{}])[+b.dataset.a]; mopen=false;
    if(a&&a.fn)a.fn();
    if(!mopen)mnext();
    render();
  });
  sh.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{
    const o=m.opts[+b.dataset.o]; mopen=false;
    if(o.fn)o.fn();
    if(!mopen)mnext();
    render();
  });
  if(m.after)m.after();
}

      <i style="width:${yes/t*100}%;background:var(--green)"></i>

function mini(v,color){ return `<span class="mini"><i style="width:${clamp(v,0,100)}%;background:${color||'var(--ink2)'}"></i></span>`; }
function chip(p){ return `<span class="chip"><s style="background:${p.color}"></s>${p.short}</span>`; }
function stanceLine(b){

function advice(){
  const ap=approval();
  if(S.over)return['Правление окончено','Откройте летопись и начните заново.'];
  if(isPM()&&coalSeats()<MAJ)return['Правительство меньшинства',
    'В коалиции '+coalSeats()+' из '+MAJ+' нужных мандатов. Отдайте портфель фракции или готовьтесь к вотуму.'];
  if(S.treasury<20&&balance()<0)return['Казна на исходе',
    'Дефицит '+Math.round(balance())+' млрд в квартал. Поднимите налог или срежьте статью расходов.'];
  if(S.econ.inf>8)return['Инфляция',
    'Цены растут на '+S.econ.inf+'% — по пенсионерам и селу это бьёт сильнее всего. Помогает сокращение дефицита и снижение НДС.'];
  if(S.econ.unemp>11)return['Безработица',
    S.econ.unemp+'% без работы. Инфраструктура и рост инвестиций дают рабочие места быстрее прочего.'];
  if(avgUnrest()>34)return['Регионы кипят',
    'Средняя напряжённость '+Math.round(avgUnrest())+'. Поездки, соцвыплаты и полиция сбивают её по-разному.'];
  if(ap<40)return['Рейтинг у черты',
    'Одобрение '+Math.round(ap)+'%. Посмотрите, какие группы ушли, и работайте с ними адресно.'];
  if(S.camp)return['Идёт кампания','До выборов '+(TERM-(S.q-S.termStart))+' кварталов. Касса тратится только на штаб.'];
  if(!S.bill)return['Собрание ждёт',
    'Внесите законопроект: подберите позицию так, чтобы её приняли, но она ещё что-то меняла.'];
  return['Курс держится','Пользуйтесь спокойным кварталом: договаривайтесь с фракциями впрок.'];
}

  return `<div class="sh acc"><div class="hd"><h2>Проект закона № ${S.billNo+1}</h2>

function hemicycle(){
  const rows=6,W=760,H=250,cx=W/2,cy=H-8;
  const list=[];
  S.parties.forEach(p=>{ for(let i=0;i<seatsOf(p.id);i++)list.push(p); });
  list.sort((a,b)=>(a.st.econ+a.st.tax+a.st.free)-(b.st.econ+b.st.tax+b.st.free));
  // сначала раскладываем кресла по углу, потом рассаживаем фракции слева направо
  const slots=[];
  for(let r=0;r<rows;r++){
    const rad=84+r*26, n=Math.round(list.length/rows*(0.82+r*0.07));
    for(let i=0;i<n;i++){
      const a=Math.PI*(0.04+0.92*(n===1?0.5:i/(n-1)));
      slots.push({a,rad,x:cx-Math.cos(a)*rad,y:cy-Math.sin(a)*rad});
    }
  }
  slots.sort((p,q)=>p.a-q.a||p.rad-q.rad);
  const step=slots.length/list.length;
  const out=list.map((p,i)=>{ const s=slots[Math.min(slots.length-1,Math.round(i*step))];
    return `<circle cx="${r1(s.x)}" cy="${r1(s.y)}" r="6" fill="${p.color}" stroke="#FAF7EF" stroke-width="0.9"/>`;});
  return `<svg class="hemi" viewBox="0 0 ${W} ${H}">${out.join('')}</svg>`;
}

  if(S.mapMode==='seats'){
    let best=null,bv=-1;
    S.parties.forEach(p=>{ const n=S.deputies.filter(d=>d.region===r.id&&d.party===p.id).length;
      if(n>bv){bv=n;best=p;} });
    return best?best.color:'#3A4553';

  const v=shown(regApproval(r.id),r.id);
  return v<38?'#6E1D17':v<46?'#A8503C':v<52?'#8A7A4E':v<60?'#4F7A4E':'#2A6144';

function moveAxis(ax,v){
  if(Math.round(me().st[ax])===v)return;
  if(!payCap(6))return;
  const old=me().st[ax];
  me().st[ax]=v;
  GROUPS.forEach(g=>{
    const before=Math.abs(g.pref[ax]-old), after=Math.abs(g.pref[ax]-v);
    shiftMood(g.id,(before-after)*g.w[ax]*2.2);
  });
  S.deputies.filter(d=>d.party===PL).forEach(d=>{
    d.rel=clamp(d.rel-Math.abs(d.st[ax]-v)*3,0,100); });
  logMsg('Партия сместила позицию по теме «'+AXNAME[ax]+'» на '+STEP[v+2]+'.',1);
  render();
}

function forecast(){
  let total=0;
  REGIONS.forEach(r=>{
    const sc={};S.parties.forEach(p=>sc[p.id]=Math.pow(Math.max(partyScore(p,r)-30,1),1.7));
    const sum=Object.values(sc).reduce((a,b)=>a+b,0), share={};
    S.parties.forEach(p=>share[p.id]=sc[p.id]/sum*100);
    total+=dhondt(share,S.regSeats[r.id])[PL]||0;
  });
  return total;
}

/* ─── 8. Летопись ────────────────────────────────────────────── */
function spark(key,color,title,fmt){
  const d=S.hist.map(h=>h[key]); if(d.length<2)return '';
  const W=320,H=54,mn=Math.min(...d),mx=Math.max(...d),rg=(mx-mn)||1;
  const pts=d.map((v,i)=>[6+i/(d.length-1)*(W-12),H-8-((v-mn)/rg)*(H-18)]);
  const path=pts.map((p,i)=>(i?'L':'M')+r1(p[0])+' '+r1(p[1])).join(' ');
  return `<div style="padding:7px 0;border-bottom:1px solid var(--rule2)">
    <div style="display:flex;justify-content:space-between;font-size:12px">
      <span class="up" style="font-size:10px;color:var(--ink2)">${title}</span>
      <b class="n">${fmt?fmt(d[d.length-1]):d[d.length-1]}</b></div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:54px;display:block">
      <path d="${path}" fill="none" stroke="${color}" stroke-width="1.6"/>
      <circle cx="${r1(pts[pts.length-1][0])}" cy="${r1(pts[pts.length-1][1])}" r="2.6" fill="${color}"/></svg>
    <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3)">
      <span>${shortDate(S.hist[0].q)}</span><span>мин ${r1(mn)} · макс ${r1(mx)}</span></div></div>`;
}

/* ─── 9. Справка ─────────────────────────────────────────────── */
function tabHelp(){
  return `<div class="sh accb"><div class="hd"><h2>Как это работает</h2><span class="note">коротко о правилах</span></div><div class="bd">
    <h3 class="rule">Время</h3>
    <p>Ход — квартал. В квартале три действия: поездка, речь, работа с депутатом, переговоры с фракцией, сбор средств, опрос.
      Созыв длится ${TERM} кварталов, затем всеобщие выборы. Больше трёх созывов подряд не бывает.</p>
    <h3 class="rule">Откуда берётся рейтинг</h3>
    <p>Одобрения как отдельной цифры не существует: есть восемь групп избирателей со своими взглядами и заботами.
      Каждая смотрит на две вещи — насколько ваш курс совпадает с её взглядами («курс») и что происходит
      с ценами, работой и её статьёй бюджета («дела»). Настроение группы медленно ползёт к сумме этих двух,
      а рейтинг страны — это средневзвешенное по регионам, где эти группы живут.</p>
    <p class="hint">Чем дольше вы у власти, тем ниже потолок: избиратель устаёт от любого правительства.</p>
    <h3 class="rule">Собрание</h3>
    <p>${SEATS} депутатов, у каждого своя позиция по шести осям, дисциплина фракции и личное отношение к вам.
      Голосуя, депутат складывает: близость закона к своим взглядам, указание фракции, помноженное на дисциплину,
      личное отношение и поправки, которые бьют по его округу или его избирателю. Колеблющихся решает зал —
      их и стоит уговаривать.</p>
    <p>Каждая тема живёт в одной редакции: новый закон отменяет прежний. Правительство меньшинства работает,
      пока оппозиция не соберёт вотум недоверия.</p>
    <h3 class="rule">Деньги</h3>
    <p>Казна — государственная, партийная касса — ваша. Из казны платят за поездки, транши регионам и стройки в округах;
      из кассы — за социологию и кампанию. Смешивать нельзя: заметят.</p>
    <p>Дефицит уходит в долг и разгоняет инфляцию. Проценты по долгу платятся каждый квартал.</p>
    <h3 class="rule">Выборы</h3>
    <p>В каждом субъекте свои мандаты, распределение — по методу Д'Ондта. За партию голосуют группы,
      которым она ближе: у соперников это чистая идеология, у вас — курс плюс то, как люди оценивают вашу работу.
      Ядро вашей партии — две группы, которым программа ближе всего.</p>
    <p>За четыре квартала до выборов открывается штаб: ролики бьют по группам, митинги — по субъектам, дебаты решают
      настроение всей страны разом.</p>
    <h3 class="rule">Чем всё кончается</h3>
    <p>Долг выше 430 млрд — дефолт. Одобрение ниже 19% — отставка. Средняя напряжённость выше 72 — страна выходит
      из-под контроля. В остальном итог считают по мандатам, законам, экономике и годам у власти.</p>
  </div></div>`;
}

        acts:[{label:'К работе'}]});
    }}],
    after(){ document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ base.color=b.dataset.c;
      document.querySelectorAll('[data-c]').forEach(x=>x.style.outline='');
      b.style.outline='2px solid var(--ink)'; }); }});
}

function bindMap(){
  document.querySelectorAll('[data-r]').forEach(p=>p.onclick=()=>openRegion(p.dataset.r));
}
const _render=render;
render=function(){ _render(); bindMap(); };

function start(){
  document.getElementById('emb').src=EMBLEM;
  const fav=document.createElement('link');fav.rel='icon';fav.href=EMBLEM;document.head.appendChild(fav);
  if(load()){
    render();
    sheetOpen({eye:'Найдено сохранение',title:'Продолжить правление?',
      body:`<p>Сохранена партия «${me().name}», ${dateLabel()}, ${S.q-S.termStart+1}-й квартал созыва.</p>
        <div class="res"><span>Мандатов</span><b>${seatsOf(PL)}</b><span>Одобрение</span><b>${Math.round(approval())}%</b>
          <span>В казне</span><b>${Math.round(S.treasury)} млрд</b></div>`,
      acts:[{label:'Продолжить'},
            {label:'Начать заново',fn(){localStorage.removeItem(SAVE);S=null;newParty();}}]});
  } else newParty();
}
document.addEventListener('DOMContentLoaded',start);
</script>
</body>
</html>
