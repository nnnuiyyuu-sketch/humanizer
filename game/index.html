<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>НОВАРИЯ — правительственный терминал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans+Narrow:wght@400;700&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Mono&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   NOVARIA UI · токены. Полное описание системы — в game/ui.html.
   Здесь те же значения; менять их следует сначала там.
   ═══════════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════
   NOVARIA UI · вторая редакция: газетная полоса.
   Первая была архивной бумагой в коробке. Эта — сегодняшний номер:
   белое поле, чёрные линейки, серифные заголовки, колонки. Числа
   остаются моноширинными: газета верстает таблицы так же.
   Полное описание — в game/ui.html; менять сначала там.
   ═══════════════════════════════════════════════════════════════ */
:root{
  /* бумага и краска */
  --bg:#EDEAE2; --surface:#FFFDF9; --surface-2:#F4F1E9; --surface-3:#E8E4D9;
  --band:#14130F; --band-2:#312E27;
  --ink:#14130F; --ink-2:#4B473E; --ink-3:#807B70; --ink-inv:#FBF9F3; --ink-inv-2:#A8A297;
  --line:#171510; --line-2:#CFCABC; --line-3:#E2DED2;
  /* один акцент на всю полосу: газетный красный */
  --act:#14130F; --mark:#A4211B; --bad:#A4211B; --good:#1C5738; --info:#1C3C68;
  --mark-bg:#F6E9E5; --bad-bg:#F6E4E0; --good-bg:#E4EEE7;
  --p1:#9A7211; --p2:#93261E; --p3:#23456B; --p4:#14675F; --p5:#4C6A22; --p6:#5A3868;
  --x1:2px; --x2:4px; --x3:6px; --x4:8px; --x5:12px; --x6:16px; --x7:20px; --x8:24px; --x9:32px; --x10:40px;
  /* линейки — главный инструмент полосы: волосяная, обычная, жирная */
  --hair:1px solid var(--line-2); --hair-2:1px solid var(--line-3);
  --rule:3px solid var(--ink); --rule-thin:1px solid var(--ink);
  --shadow:0 18px 48px rgba(16,14,10,.30);
  --f-display:'PT Serif',Georgia,'Times New Roman',serif;
  --f-text:'PT Sans',system-ui,sans-serif;
  --f-cond:'PT Sans Narrow',sans-serif; --f-num:'PT Mono',ui-monospace,monospace;
  --t-fast:90ms; --t:150ms; --t-slow:240ms; --ease:cubic-bezier(.2,.7,.3,1);
  --row:30px; --row-tight:24px; --rail:232px; --page:1420px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--f-text);
  min-height:100vh;overscroll-behavior-y:none}
p{margin:0 0 var(--x4)} p:last-child{margin-bottom:0}

/* ── типографика ───────────────────────────────────────────────
   Заголовок всегда серифный и всегда с линейкой. Текст — гротеск,
   числа — моноширинный. Три гарнитуры, ни одной лишней. */
.t-sec{font:700 15px/1.15 var(--f-display);letter-spacing:-.01em}
.t-micro,.up{font:700 9.5px/1.2 var(--f-cond);text-transform:uppercase;letter-spacing:.16em;color:var(--ink-3)}
.n,.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.num-l{font:400 23px/1 var(--f-num);letter-spacing:-.05em}
.num-s{font:400 12.5px/1.2 var(--f-num);letter-spacing:-.04em}
.good,.pos{color:var(--good)} .bad,.neg{color:var(--bad)} .dim{color:var(--ink-3)}
.lead{font:400 14.5px/1.5 var(--f-display);color:var(--ink-2)}
.hint,.note{font-size:12px;line-height:1.45;color:var(--ink-3)}
h3.sub{font:700 13px/1.2 var(--f-display);letter-spacing:-.01em;color:var(--ink);
  margin:var(--x6) 0 var(--x4);padding-bottom:3px;border-bottom:var(--rule-thin)}
h3.sub:first-child{margin-top:0}
.est{border-bottom:1px dotted var(--ink-3);cursor:help}

/* ── шапка: заголовок номера ───────────────────────────────────
   Не тёмная панель, а титул газеты: белое поле, крупный сериф,
   под ним жирная линейка, справа — колонка сегодняшних цифр. */
#top{position:sticky;top:0;z-index:40;background:var(--surface);color:var(--ink);
  display:flex;align-items:stretch;border-bottom:var(--rule)}
#top .brand{display:flex;align-items:center;gap:10px;padding:7px var(--x6) 7px var(--x5);flex:none;
  border-right:var(--rule-thin)}
#top .brand img{width:30px;height:33px;display:block}
#top .brand b{font:700 24px/1 var(--f-display);letter-spacing:.02em;display:block}
#top .brand span{font:700 8.5px/1.2 var(--f-cond);text-transform:uppercase;letter-spacing:.2em;
  color:var(--ink-3);display:block;margin-top:2px}
#strip{margin-left:auto;display:flex;overflow-x:auto;scrollbar-width:none}
#strip::-webkit-scrollbar{display:none}
.sv{padding:6px 14px;border-left:1px solid var(--line-3);display:flex;flex-direction:column;
  justify-content:center;min-width:80px;flex:none}
.sv i{font:700 8.5px var(--f-cond);text-transform:uppercase;letter-spacing:.16em;
  color:var(--ink-3);font-style:normal}
.sv b{font:400 16px var(--f-num);letter-spacing:-.04em;color:var(--ink);white-space:nowrap}
.sv b.warn{color:#8A5A0E} .sv b.bad{color:var(--bad)} .sv b.good{color:var(--good)}
.sv.act{background:var(--ink);}
.sv.act i{color:var(--ink-inv-2)} .sv.act b{color:var(--ink-inv)}

/* ── каркас ────────────────────────────────────────────────────
   Указатель разделов слева — как содержание номера. */
#shell{display:flex;align-items:flex-start;max-width:var(--page);margin:0 auto;
  background:var(--surface);border-left:var(--hair);border-right:var(--hair)}
#side{position:sticky;top:57px;width:var(--rail);flex:none;padding:var(--x4) 0 var(--x10);
  border-right:var(--rule-thin);min-height:calc(100vh - 57px)}
.navsec{font:700 8.5px var(--f-cond);text-transform:uppercase;letter-spacing:.2em;color:var(--ink-3);
  padding:var(--x3) var(--x5) var(--x2);border-bottom:var(--rule-thin);margin-bottom:var(--x1)}
.nav{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;
  border-bottom:var(--hair-2);padding:8px var(--x5);cursor:pointer;color:var(--ink-2);
  font:400 13.5px var(--f-cond);text-transform:uppercase;letter-spacing:.06em;
  transition:background var(--t-fast) var(--ease)}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav.on{background:var(--ink);color:var(--ink-inv);font-weight:700}
.nav .ic{flex:none;opacity:.7}
.nav.on .ic{opacity:1;color:var(--ink-inv)}
.nav span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav u{flex:none;margin-left:auto;text-decoration:none;font:400 11px var(--f-num);color:var(--ink-3)}
.nav.on u{color:var(--ink-inv-2)}
.nav .dot{width:6px;height:6px;background:var(--mark);display:inline-block;flex:none}
.nav.on .dot{background:var(--ink-inv)}
.navkeys{font:400 10px var(--f-cond);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);
  padding:var(--x5) var(--x5) 0;line-height:1.7;border-top:var(--rule-thin);margin-top:var(--x4)}
.navkeys b{font-family:var(--f-num);font-weight:400;border:1px solid var(--line-2);
  padding:0 4px;color:var(--ink-2)}
#view{flex:1;min-width:0;padding:var(--x6) var(--x7) 90px}

/* ── панели: заметки на полосе ─────────────────────────────────
   Жирная линейка сверху, серифный заголовок, дальше материал.
   Рамка тонкая и почти незаметна — держит колонку, а не рисует. */
.panel{background:var(--surface);border:var(--hair);border-top:var(--rule-thin);margin-bottom:var(--x6)}
.panel>header{display:flex;align-items:baseline;gap:var(--x4);padding:7px var(--x5) 5px;
  border-bottom:var(--rule-thin);flex-wrap:wrap}
.panel>header h4{margin:0;font:700 16px/1.15 var(--f-display);letter-spacing:-.01em;
  flex:1 1 auto;min-width:0}
.panel>header .meta{margin-left:auto;font:400 11px/1.3 var(--f-cond);text-transform:uppercase;
  letter-spacing:.1em;color:var(--ink-3);text-align:right;flex:0 1 auto}
.panel>.body{padding:var(--x5)}
.panel>.body.flush{padding:0}
.panel>footer{padding:var(--x4) var(--x5);border-top:var(--hair);background:var(--surface-2);
  display:flex;gap:var(--x3);flex-wrap:wrap;align-items:center}
.panel.lead-p{border-top:6px double var(--ink)}
.panel.warn{border-top:3px solid var(--bad)}
.panel.calm{border-top:3px solid var(--good)}
.panel.info{border-top:3px solid var(--info)}
.panel.inset{background:var(--surface-2)}
.cols{display:grid;gap:var(--x6);align-items:start}
.c21{grid-template-columns:2fr 1fr} .c11{grid-template-columns:1fr 1fr}
.c12{grid-template-columns:1fr 2fr} .c111{grid-template-columns:repeat(3,1fr)}
.grid{display:grid;gap:var(--x4)} .g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.row,.brow{display:flex;gap:var(--x3);flex-wrap:wrap;align-items:center}
/* врезка — то, что в газете ставят в рамку посреди текста */
.pin{border-top:var(--rule-thin);border-bottom:var(--rule-thin);background:var(--surface);
  padding:var(--x4) 0;font:400 14.5px/1.5 var(--f-display);margin-bottom:var(--x6)}
.pin.warn{border-color:var(--bad);color:#6E1712}
.pin b{display:block;font:700 8.5px var(--f-cond);text-transform:uppercase;letter-spacing:.2em;
  color:var(--ink-3);margin-bottom:2px}
.pin.warn b{color:var(--bad)}

/* ── кнопки ────────────────────────────────────────────────────
   Прямоугольник с чёрной линией. Главная — залитая, остальные — контур. */
.btn,.b{display:inline-flex;align-items:center;justify-content:center;gap:5px;
  font:700 11.5px var(--f-cond);text-transform:uppercase;letter-spacing:.1em;
  padding:7px 13px;border:var(--rule-thin);background:var(--surface);color:var(--ink);
  cursor:pointer;transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.btn:hover:not(:disabled),.b:hover:not(:disabled){background:var(--ink);color:var(--ink-inv)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.pri,.b.pri{background:var(--ink);color:var(--ink-inv)}
.btn.pri:hover:not(:disabled){background:var(--mark);border-color:var(--mark)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger:hover:not(:disabled){background:var(--bad);color:#fff}
.btn.ghost{border-color:var(--line-2);color:var(--ink-2)}
.btn.sel{background:var(--mark);border-color:var(--mark);color:#fff}
.btn:disabled,.b:disabled{opacity:.34;cursor:not-allowed}
.btn.sm,.b.sm{padding:4px 9px;font-size:10.5px;letter-spacing:.08em}
.btn.lg{padding:12px 20px;font-size:14px}
.btn.block,.b.wide{display:flex;width:100%;text-align:center}
.btn .cost{font-family:var(--f-num);font-size:11px;opacity:.7;margin-left:5px;letter-spacing:-.03em}

/* ── плашки-переключатели ──────────────────────────────────────
   Рубрикатор: сплошная лента, выбранная рубрика залита чёрным. */
.seg{display:inline-flex;border:var(--rule-thin);background:var(--surface);max-width:100%;
  overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;border-right:1px solid var(--line-2);background:none;padding:7px 13px;
  cursor:pointer;flex:none;font:700 11px var(--f-cond);text-transform:uppercase;letter-spacing:.1em;
  color:var(--ink-2);display:flex;align-items:center;gap:6px;
  transition:background var(--t-fast) var(--ease)}
.seg button:last-child{border-right:0}
.seg button:hover:not(.on){background:var(--surface-2);color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--ink-inv)}
.seg button u{text-decoration:none;font:400 11px var(--f-num);opacity:.65;letter-spacing:-.03em}
.seg.wide{display:flex;width:100%}
.seg.wide button{flex:1;justify-content:center}

/* ── путь закона: три ступени ──────────────────────────────── */
.gates{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:var(--rule-thin)}
.gate{background:var(--surface);padding:var(--x4) var(--x5);display:flex;flex-direction:column;gap:3px;
  border-right:1px solid var(--line-2)}
.gate:last-child{border-right:0}
.gate i{font:700 8.5px var(--f-cond);text-transform:uppercase;letter-spacing:.18em;
  color:var(--ink-3);font-style:normal}
.gate b{font:400 27px/1 var(--f-num);letter-spacing:-.05em}
.gate u{text-decoration:none;font:400 10.5px var(--f-cond);color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.06em}
.gate span.dim{font-size:11px}
.gate.ok{box-shadow:inset 0 3px 0 var(--good)}
.gate.no{box-shadow:inset 0 3px 0 var(--bad)}

.path{border-top:var(--rule-thin);border-bottom:var(--rule-thin);margin:var(--x5) 0}
.stg{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:var(--x4);
  padding:9px var(--x2);border-bottom:var(--hair-2);background:var(--surface)}
.stg:last-child{border-bottom:0}
.stg i{font-style:normal;font:700 14px var(--f-display);letter-spacing:-.01em}
.stg b{font-weight:400;font-size:11px;font-family:var(--f-cond);text-transform:uppercase;
  letter-spacing:.1em;color:var(--ink-3)}
.stg u{text-decoration:none;font:400 15px var(--f-num);letter-spacing:-.04em;min-width:66px;text-align:right}
.stg.ok{box-shadow:inset 3px 0 0 var(--good)}
.stg.no{box-shadow:inset 3px 0 0 var(--bad)}

/* линейка направления */
.ruler{position:relative;height:22px;background:var(--surface-2);border:1px solid var(--line-2)}
.ruler::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line-2)}
.ruler i{position:absolute;top:5px;width:7px;height:7px;margin-left:-3.5px}
.ruler s{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink);
  text-decoration:none}

/* ── молва: четыре шкалы личного дела ──────────────────────── */
.repline{display:grid;grid-template-columns:118px 1fr 34px auto;align-items:center;gap:var(--x4);
  padding:5px 0;border-bottom:var(--hair-2)}
.repline:last-of-type{border-bottom:0}
.repline i{font-style:normal;font:700 11px var(--f-cond);text-transform:uppercase;
  letter-spacing:.1em;color:var(--ink-2);white-space:nowrap}
.repline b{font:400 13px var(--f-num);text-align:right;letter-spacing:-.04em}
.repline u{text-decoration:none;font-size:11px;color:var(--ink-3);min-width:88px}
.repscale{position:relative;height:8px;background:var(--surface-3);border:1px solid var(--line-2)}
.repscale::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line-2)}
.repscale span{position:absolute;top:-3px;width:3px;height:14px;background:var(--ink);margin-left:-1.5px}

/* ── первая полоса: заголовки изданий ──────────────────────── */
.heads{max-height:420px;overflow-y:auto}
.head{display:flex;gap:var(--x4);padding:8px var(--x5);border-bottom:var(--hair-2)}
.head:last-child{border-bottom:0}
.head s{text-decoration:none;font:400 10.5px var(--f-num);color:var(--ink-3);flex:none;
  width:46px;padding-top:3px}
.head b{display:block;font:700 14.5px/1.25 var(--f-display);letter-spacing:-.01em}
.head span{display:block;font:700 8.5px var(--f-cond);text-transform:uppercase;
  letter-spacing:.16em;color:var(--ink-3);margin-top:2px}
.head.hg{box-shadow:inset 3px 0 0 var(--good)}
.head.hb{box-shadow:inset 3px 0 0 var(--bad)}

/* ── карьера политика ──────────────────────────────────────── */
.career{max-height:340px;overflow-y:auto}
.crow{display:flex;gap:var(--x4);padding:6px var(--x5);border-bottom:var(--hair-2);font-size:12.5px}
.crow:last-child{border-bottom:0}
.crow s{text-decoration:none;font:400 11px var(--f-num);color:var(--ink-3);flex:none;width:34px}

/* ── таблицы: газетная вёрстка ─────────────────────────────────
   Жирная линейка над шапкой, волосяные между строками, никаких
   вертикальных линий и никакой заливки заголовка. */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:700 8.5px var(--f-cond);text-transform:uppercase;letter-spacing:.16em;color:var(--ink-2);
  text-align:left;padding:4px 8px;border-top:var(--rule-thin);border-bottom:1px solid var(--line-2);
  white-space:nowrap;background:none}
td{padding:0 8px;height:var(--row);border-bottom:var(--hair-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
tr.sel td{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--ink)}
td.n,th.n,td.num{text-align:right;font-family:var(--f-num);font-size:12.5px;letter-spacing:-.04em;white-space:nowrap}
td.r,th.r{text-align:right}
table.tight td{height:var(--row-tight);padding:0 7px}
table.tight th{padding:3px 7px}
caption{caption-side:bottom;text-align:left;font-size:11.5px;color:var(--ink-3);
  padding:var(--x3) var(--x5) var(--x4);border-top:1px solid var(--line-3)}
.scrollx{overflow-x:auto}
.sub2{font-size:11.5px;color:var(--ink-3)}

/* ── индикаторы ────────────────────────────────────────────── */
.meter,.bar{height:9px;background:var(--surface-3);border:1px solid var(--line-2);display:flex;position:relative}
.meter i,.bar i{display:block;height:100%}
.meter .mid,.bar .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--ink)}
.meter.tall{height:16px}
.mini{display:inline-block;width:60px;height:6px;background:var(--surface-3);border:1px solid var(--line-2);vertical-align:middle}
.mini i{display:block;height:100%;background:var(--ink-2)}
/* показатель — как биржевая сводка: подпись капителью, число крупно */
.stat{border-top:var(--rule-thin);padding:var(--x4) 0 var(--x3)}
.stat .k,.stat i{font:700 8.5px var(--f-cond);text-transform:uppercase;letter-spacing:.18em;
  color:var(--ink-3);white-space:nowrap;font-style:normal;display:block}
.stat .v{font:400 30px/1.05 var(--f-num);letter-spacing:-.055em;margin-top:3px}
.stat .v u{text-decoration:none;font:400 12px var(--f-text);color:var(--ink-3);margin-left:3px;letter-spacing:0}
.stat .d,.stat span{font-size:11.5px;color:var(--ink-3);margin-top:1px;display:block}
.stat.alert{border-top-color:var(--bad)} .stat.alert .v{color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
.chip s{width:9px;height:9px;flex:none;text-decoration:none;display:inline-block}
.tag{display:inline-block;font:700 8.5px var(--f-cond);text-transform:uppercase;letter-spacing:.12em;
  border:1px solid currentColor;padding:1px 5px;white-space:nowrap}
.tag.g{color:var(--good)} .tag.r{color:var(--bad)} .tag.b{color:var(--info)} .tag.y{color:#8A5A0E}
/* печать ставится поверх материала, как штамп в наборной кассе */
.stamp{display:inline-block;font:700 16px var(--f-display);text-transform:uppercase;letter-spacing:.14em;
  border:2px solid currentColor;box-shadow:inset 0 0 0 1px currentColor;padding:4px 14px;
  transform:rotate(-3deg)}
.stamp.yes,.stamp.y{color:var(--good)} .stamp.no,.stamp.n{color:var(--bad)}
.kv{display:flex;justify-content:space-between;gap:var(--x5);padding:4px 0;
  border-bottom:1px dotted var(--line-2);font-size:13px}
.kv:last-child{border-bottom:none}
.kv b{font-family:var(--f-num);font-weight:400;letter-spacing:-.04em}
/* сводка ключ-значение: точечный лидер между колонками, как в программе передач */
.res{display:grid;grid-template-columns:1fr auto;gap:2px var(--x6);font-size:13px;
  border-top:var(--rule-thin);border-bottom:1px solid var(--line-2);padding:var(--x4) 0;margin:var(--x4) 0}
.res span{color:var(--ink-2)}
.res b{font-family:var(--f-num);font-weight:400;text-align:right;letter-spacing:-.04em}
.res b.w{font-family:var(--f-text);font-weight:700;letter-spacing:0}

/* ── формы и шкалы ─────────────────────────────────────────── */
input[type=text],input[type=number],select{font:400 14px var(--f-text);background:var(--surface);
  border:1px solid var(--line-2);border-bottom:var(--rule-thin);
  padding:6px 8px;color:var(--ink);width:100%;border-radius:0}
input:focus,select:focus{outline:2px solid var(--mark);outline-offset:-1px}
.field{margin-bottom:var(--x5)}
.field>label{display:block;font:700 8.5px var(--f-cond);text-transform:uppercase;
  letter-spacing:.18em;color:var(--ink-2);margin-bottom:3px}
.ax{margin-bottom:var(--x5)}
.axh,.scale-l{display:flex;justify-content:space-between;font:700 9px var(--f-cond);
  text-transform:uppercase;letter-spacing:.14em;color:var(--ink-3);margin-bottom:3px}
.axr,.scale{display:flex;gap:1px;background:var(--line-2);border:var(--rule-thin)}
.axr button,.scale button{flex:1;height:30px;border:0;background:var(--surface);cursor:pointer;
  font:400 12px var(--f-num);color:var(--ink-2);transition:background var(--t-fast) var(--ease)}
.axr button:hover,.scale button:hover{background:var(--surface-2)}
.axr button.on,.scale button.on{background:var(--ink);color:var(--ink-inv)}
.steps{display:flex;gap:1px;background:var(--line-2);border:1px solid var(--line-2)}
.steps button{width:31px;height:25px;border:0;background:var(--surface);cursor:pointer;
  font:400 11px var(--f-num);color:var(--ink-2)}
.steps button:hover{background:var(--surface-2)}
.steps button.on{background:var(--ink);color:var(--ink-inv)}
.now{font-size:11.5px;color:var(--ink-2);margin-top:4px}

/* ── политические и экономические блоки ────────────────────── */
.whip{display:grid;grid-template-columns:repeat(3,1fr);border-top:var(--rule-thin);
  border-bottom:1px solid var(--line-2)}
.whip div{padding:6px 10px;border-right:1px solid var(--line-3)}
.whip div:last-child{border-right:0}
.whip i{display:block;font:700 8.5px var(--f-cond);text-transform:uppercase;
  letter-spacing:.16em;color:var(--ink-3);font-style:normal}
.whip b{font:400 22px var(--f-num);letter-spacing:-.05em}
.dep{display:flex;align-items:center;gap:var(--x5);padding:6px 0;border-bottom:var(--hair-2)}
.dep:last-child{border-bottom:0}
.dep .who{flex:1;min-width:0}
.dep .who b{display:block;font:700 14px var(--f-display);letter-spacing:-.01em}
.dep .who span{font-size:11.5px;color:var(--ink-3)}
.hemi{width:100%;display:block;max-height:270px}
.bline{display:grid;grid-template-columns:1fr 54px 168px;gap:var(--x5);align-items:center;
  padding:6px 0;border-bottom:var(--hair-2)}
.bline:last-child{border-bottom:0}
.bline .who{font-size:11.5px;color:var(--ink-3)}
.gauge{display:flex;align-items:center;gap:var(--x4);margin-bottom:var(--x4)}
.gauge:last-child{margin-bottom:0}
.gauge .track{flex:1;height:9px;background:var(--surface-3);border:1px solid var(--line-2);position:relative}
.gauge .track i{position:absolute;top:-3px;width:2px;height:15px;background:var(--ink)}
.spark{display:block;width:100%;height:46px}

/* ── карта ─────────────────────────────────────────────────── */
.mapbox{background:var(--surface-2);border:var(--rule-thin);padding:6px;max-width:880px;margin:0 auto}
.mapsvg{width:100%;display:block}
.rgn{stroke:var(--ink);stroke-width:1.1;cursor:pointer;transition:filter var(--t-fast) var(--ease)}
.rgn:hover{filter:brightness(1.1)}
.rgn.sel{stroke:var(--mark);stroke-width:3}
.caplbl{fill:var(--ink);font:700 14px var(--f-cond);pointer-events:none;paint-order:stroke;
  stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round;letter-spacing:.04em}
.legend{display:flex;flex-wrap:wrap;gap:var(--x2) var(--x6);font-size:11.5px;color:var(--ink-2);margin-top:var(--x4)}

/* ── журнал, состояния ─────────────────────────────────────── */
.log div{padding:5px 0;border-bottom:1px dotted var(--line-2);font-size:12.5px}
.log div:last-child{border-bottom:0}
.log div.key{border-left:3px solid var(--mark);padding-left:8px;margin-left:-11px}
.log s{text-decoration:none;font:400 10.5px var(--f-num);color:var(--ink-3);margin-right:7px}
.empty{padding:var(--x8);text-align:center;color:var(--ink-3);font-size:13px;
  border-top:1px solid var(--line-3);border-bottom:1px solid var(--line-3)}
.chron{display:flex;gap:var(--x5);padding:6px 0;border-bottom:var(--hair-2);font-size:13px}
.chron:last-child{border-bottom:0}
.chron .y{font:400 11.5px var(--f-num);color:var(--ink-3);width:40px;flex:none;padding-top:2px}
.chron.g{box-shadow:inset 3px 0 0 var(--good);padding-left:9px}
.chron.b{box-shadow:inset 3px 0 0 var(--bad);padding-left:9px}

/* ── модальное окно: экстренный выпуск ─────────────────────── */
#modal{position:fixed;inset:0;z-index:60;background:rgba(20,18,12,.62);display:none;
  align-items:flex-start;justify-content:center;padding:var(--x8) var(--x5);overflow-y:auto}
#modal.show{display:flex}
#msheet{background:var(--surface);border:var(--rule);box-shadow:var(--shadow);
  width:100%;max-width:640px;animation:rise var(--t-slow) var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#msheet .mh{padding:var(--x5) var(--x6) var(--x4);border-bottom:var(--rule-thin)}
#msheet .mh i{display:block;font:700 8.5px var(--f-cond);text-transform:uppercase;
  letter-spacing:.2em;color:var(--ink-3);font-style:normal}
#msheet .mh h2{margin:3px 0 0;font:700 25px/1.1 var(--f-display);letter-spacing:-.015em}
#msheet .mb{padding:var(--x5) var(--x6);font-size:13.5px}
#msheet .mf{padding:var(--x4) var(--x6);border-top:var(--rule-thin);background:var(--surface-2);
  display:flex;gap:var(--x3);justify-content:flex-end;flex-wrap:wrap}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:0;
  border-top:1px solid var(--line-2);padding:9px 2px;margin:0;cursor:pointer;
  font:400 13px var(--f-text);color:var(--ink);
  transition:background var(--t-fast) var(--ease),padding-left var(--t-fast) var(--ease)}
.opt:last-child{border-bottom:1px solid var(--line-2)}
.opt:hover{background:var(--surface-2);padding-left:9px}
.opt b{display:flex;align-items:center;gap:9px;font:700 14px var(--f-display);letter-spacing:-.01em}
.opt b .ic{flex:none;opacity:.7}
.opt span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}

/* ── плашки ────────────────────────────────────────────────── */
#toasts{position:fixed;right:var(--x5);bottom:var(--x5);z-index:70;display:flex;
  flex-direction:column;gap:5px;align-items:flex-end}
.toast{background:var(--ink);color:var(--ink-inv);padding:7px 13px;font:400 12.5px var(--f-text);
  border-left:3px solid var(--mark);
  animation:tin var(--t) var(--ease),tout var(--t-slow) var(--ease) 2.4s forwards}
@keyframes tin{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0}}

/* ── экран загрузки: первая полоса ─────────────────────────── */
#splash{position:fixed;inset:0;z-index:80;background:var(--surface);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity var(--t-slow) var(--ease)}
#splash.hide{opacity:0;pointer-events:none}
#splash img{width:66px;height:72px;margin-bottom:var(--x5)}
#splash h1{font:700 40px var(--f-display);letter-spacing:.06em;margin:0;
  border-top:var(--rule);border-bottom:var(--rule-thin);padding:var(--x3) var(--x8)}
#splash p{color:var(--ink-3);font:700 10px var(--f-cond);text-transform:uppercase;
  letter-spacing:.28em;margin:var(--x4) 0 var(--x6)}
#splash .load{width:240px;height:3px;background:var(--surface-3);overflow:hidden}
#splash .load i{display:block;height:100%;width:40%;background:var(--ink);animation:slide 1.1s var(--ease) infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:900px){
  #top{flex-wrap:wrap} #top .brand{min-height:44px;border-right:0;width:100%}
  #top .brand b{font-size:20px}
  #strip{width:100%;margin-left:0;order:3;border-top:var(--rule-thin)}
  .sv{padding:5px 11px;min-width:0} .sv:first-child{border-left:0} .sv b{font-size:14px}
  #shell{display:block;border:0}
  #side{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;min-height:0;display:flex;
    border-right:0;border-top:var(--rule);background:var(--surface);padding:0;z-index:35;
    box-shadow:0 -6px 18px rgba(20,18,12,.12)}
  .navsec,.navkeys{display:none}
  .nav{flex:1;min-width:0;border-bottom:0;border-top:3px solid transparent;padding:7px 2px 6px;
    flex-direction:column;gap:3px;align-items:center;justify-content:center;
    font-size:10px;letter-spacing:.04em;line-height:1.1}
  .nav.on{border-top-color:var(--mark);background:var(--ink)}
  .nav u{display:none}
  .nav .ic{width:22px;height:22px}
  .nav .dot{position:absolute;margin:0;transform:translate(14px,-10px)}
  .nav span{flex:none;overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
  #view{padding:var(--x5) var(--x5) 74px}
  .cols,.c21,.c11,.c12,.c111,.g4,.g3{grid-template-columns:1fr}
  .g4{grid-template-columns:1fr 1fr}
  .gates{grid-template-columns:1fr}
  .gate{border-right:0;border-bottom:1px solid var(--line-2)}
  .gate:last-child{border-bottom:0}
}
@media(max-width:560px){
  .g2,.g4{grid-template-columns:1fr 1fr}
  .hide-s,.mini{display:none}
  td,th{padding:0 6px}
  .stat .v{font-size:23px}
  #msheet .mh h2{font-size:21px}
  #modal{padding:var(--x4) var(--x2)}
  .bline{grid-template-columns:1fr 44px;row-gap:var(--x2)}
  .bline>div:last-child{grid-column:1/3}
}
</style>
</head>

<div id="splash"><img id="splash-em" alt=""><h1>НОВАРИЯ</h1><p>правительственный терминал</p>

<header id="top">

</header>

</div>
<div id="modal"><div id="msheet"></div></div>

/* устойчивый шум: один и тот же депутат по одному и тому же вопросу
   думает одинаково, пока не изменились обстоятельства */
function hash(str){ let h=2166136261;
  for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}
  return ((h>>>0)%10000)/10000; }
const noise = (str,amp)=>(hash(str)-0.5)*2*amp;

/* ─── партии ─────────────────────────────────────────────────── */
const PL = 'you';
function parties(){ return S.parties; }
function P(id){ return S.parties.find(p=>p.id===id); }
function me(){ return P(PL); }
function isPM(){ return S.gov.lead===PL; }
function coalition(){ return S.gov.coal; }
function inCoal(id){ return S.gov.coal.indexOf(id)>=0; }

/* ─── президент ──────────────────────────────────────────────────
   Избирается всей страной и на свой срок, поэтому редко совпадает
   с большинством Собрания. Игрок может занять это кресло — тогда
   у него две головы власти сразу. */
function pres(){ return S.pres; }
function isPres(){ return S.pres && S.pres.party===PL; }
function presParty(){ return S.pres?P(S.pres.party):null; }
function presLeft(){ return Math.max(0,S.pres.until-S.q); }
/* насколько президенту чужд курс правительства */
function presGap(){
  const p=presParty(); if(!p)return 0;
  return axDist(p.st, isPM()?me().st:P(S.gov.lead).st);
}

/* ─── вице-президент ─────────────────────────────────────────────
   Кресло без ведомства: вице ничего не решает ровно до того дня,
   когда решает всё. Полномочий у него три — председательствовать
   в Сенате и разбивать равенство, вести порученное дело и
   наследовать кресло, если президент его освобождает.
   Человека описывают три числа: палата (умение работать с
   сенаторами), имя (известность в стране) и честолюбие. Первые
   два работают на вас, третье — против, если его не занять. */
function vp(){ return S.vp; }
function isVP(){ return S.vp && S.vp.party===PL; }
function vpParty(){ return S.vp?P(S.vp.party):null; }
function vpKind(){ return S.vp?VP_KIND.find(k=>k.id===S.vp.kind)||VP_KIND[4]:null; }
function vpJob(){ return S.vp?VP_JOBS.find(j=>j.id===(S.vp.job||'none'))||VP_JOBS[4]:null; }
/* умение вести палату: от него зависит и убеждение при почти-равенстве,
   и то, насколько поручение «работа с Сенатом» вообще что-то даёт */
function vpSkill(){ return S.vp?clamp(S.vp.sen||40,0,100):0; }
/* насколько близкий к равенству счёт председатель ещё может развернуть:
   сильный вице уговаривает двоих, слабый не спасает и равенства */
function vpMargin(){
  if(!S.vp)return 0;
  const b=S.vp.job==='senate'?1:0;
  return vpSkill()>=80?2+b:vpSkill()>=58?1+b:0;
}
/* как вице-президент проголосует при равенстве: за своих, против чужих */
function vpBreak(bill){
  if(!S.vp)return 0;
  const p=vpParty(), d=Math.abs((p.st[T(bill.topic).ax]||0)-bill.stance);
  return d<1.6?1:-1;
}
/* честолюбие растёт, пока вице нечем занять, и падает от настоящего дела */
function vpRestless(){
  if(!S.vp)return false;
  return (S.vp.amb||0)>=VP_AMB && (S.vp.job||'none')==='none';
}

/* ─── премьер и кабинет ──────────────────────────────────────────
   Премьер — человек, а не партия: у него имя, срок и своя молва.
   Министры тоже люди: компетентность министра усиливает или гасит
   эффект его ведомства. */
function pm(){ return S.pm; }
function isPMperson(){ return S.pm && S.pm.party===PL; }
function minOf(post){ return S.ministers?S.ministers[post]:null; }
/* насколько ведомство работает лучше или хуже обычного */
function minPower(post){
  const m=minOf(post); if(!m)return 0;
  // доля, а не разы: даже блестящий министр правит ведомство на десятую часть
  let v=(m.comp-50)*0.0035;
  if(m.party===PL)v+=0.025; else if(inCoal(m.party))v+=0.012;
  if(S.q-m.since>MIN_TERM)v-=0.03;          // засидевшийся министр выдыхается
  return r2(clamp(v,-0.13,0.15));
}
function cabinetPower(){
  return r2(POSTS.reduce((a,p)=>a+minPower(p.id),0)/POSTS.length);
}
function minWord(m){ return m.comp>=72?'сильный':m.comp>=56?'крепкий':m.comp>=40?'средний':'слабый'; }

/* ─── личность политика ──────────────────────────────────────────
   Черта характера не пишет текст, а меняет число в уже работающем
   механизме: цену действия, скорость износа, силу голоса. */
function you(){ return S.you; }
function hasTrait(id){ return !!(S.you&&S.you.traits&&S.you.traits.indexOf(id)>=0); }
function origin(){ return S.you?OR(S.you.origin):null; }
function rep(k){ return S.you&&S.you.rep?S.you.rep[k]||50:50; }
function bumpRep(k,v){
  if(!S.you||!S.you.rep)return;
  if(k==='honest'&&v>0&&hasTrait('clean'))v*=2;
  S.you.rep[k]=clamp(r1(S.you.rep[k]+v),0,100);
}
/* скидка на политический вес: аппаратчик работает с залом дешевле */
function capCost(base,kind){
  let v=base;
  if(kind==='lobby'&&hasTrait('apparat'))v-=3;
  if(kind==='talk'&&hasTrait('dealer'))v-=2;
  if(kind==='visit'&&hasTrait('zemsky'))v-=2;
  if(kind==='veto'&&hasTrait('jurist'))v-=4;
  return Math.max(1,Math.round(v));
}
/* возраст: политик стареет, и после определённой черты это видно */
function ageOf(){ return S.you?S.you.age:50; }
function agePenalty(){ return Math.max(0,(ageOf()-64)*0.55); }

/* ─── губернаторы ────────────────────────────────────────────────
   Закон о местном самоуправлении решает, кто ставит глав субъектов:
   при автономии их выбирает регион, при вертикали назначает кабинет. */
function govElected(){ const l=lawOn('local'); return !!(l&&l.stance>0); }
function govOf(rid){ return S.govs?S.govs[rid]:null; }
/* насколько глава помогает или мешает вам в своём субъекте */
function govEffect(rid){
  const g=govOf(rid); if(!g)return 0;
  let v=(g.comp-50)*0.032+(g.rel-50)*0.026;
  if(g.party===PL)v+=1.4; else if(inCoal(g.party))v+=0.8;
  return r1(clamp(v,-5,5));
}
function govLoyal(g){ return g.rel>=66?'опора':g.rel>=52?'работает':g.rel>=36?'сам по себе':g.rel>=20?'фрондирует':'враждебен'; }

/* ─── пресса ─────────────────────────────────────────────────────
   Издание не выносит решений, но решает, как страна узнает о ваших.
   Тон прессы умножает любой сдвиг настроения: при дружелюбной печати
   успех слышен вдвое, при враждебной — тонет. */
function pressOf(id){ return S.press?S.press.o[id]:null; }
/* доверие к печати зависит от закона о ней: под надзором пишут что велено,
   но им перестают верить, и множитель слабеет в обе стороны */
function pressFree(){ const l=lawOn('press'); return l?l.stance:0; }
function pressTrust(){ return clamp(0.62+pressFree()*0.13,0.3,0.95); }
function pressTone(){
  if(!S.press)return 0;
  let s=0,w=0;
  PRESS.forEach(o=>{ const st=pressOf(o.id); if(!st)return;
    s+=(st.rel-50)*o.reach; w+=o.reach; });
  return r1(clamp(s/(w||1)*pressTrust(),-40,40));
}
/* во сколько раз печать усиливает сдвиг настроения */
function pressMul(v){
  const t=pressTone()/100;
  return v>0 ? 1+t*0.9 : 1-t*0.9;
}
function pressWord(v){ return v>=18?'на вашей стороне':v>=6?'скорее доброжелательна':v>-6?'нейтральна':v>-18?'придирается':'травит'; }
/* один шаг сразу по всем изданиям: так отзывается то, что нельзя
   объяснить одной редакции отдельно — вроде поправки к регламенту */
function pressAll(v){
  if(!S.press)return;
  PRESS.forEach(o=>{ const st=pressOf(o.id); if(st)st.rel=clamp(st.rel+v,0,100); });
}
/* как издание относится к конкретному решению */
function pressView(o,ax,stance){
  const d=Math.abs((o.st[ax]||0)-stance);
  return d<1?1:d<2?0:-1;
}

/* ─── конституционный суд ────────────────────────────────────────
   Девять судей, назначенных разными президентами в разные годы.
   Суд смотрит не на политику, а на то, как далеко зашёл закон. */
function courtMedian(ax){
  const v=S.court.map(j=>j.st[ax]||0).sort((a,b)=>a-b);
  return v[Math.floor(v.length/2)]||0;
}
/* независимость суда: закон о судебной реформе решает, слушают ли там власть */
function courtFree(){ const l=lawOn('court'); return l?l.stance:0; }
function courtSeats(pid){ return S.court.filter(j=>j.by===pid).length; }
/* сколько судей сочтут закон выходящим за рамки */
function courtStrike(law){
  const t=T(law.topic); if(!t)return 0;
  let n=0;
  S.court.forEach(j=>{
    let v=Math.abs((j.st[t.ax]||0)-law.stance)*7;      // чем дальше от судьи, тем хуже
    v+=Math.abs(law.stance)*4;                          // крайние редакции сами по себе подозрительны
    if(law.decree)v+=16;                                // указ обходит палаты — это отдельная претензия
    v+=courtFree()*5;                                   // независимый суд смелее
    if(j.by===S.gov.lead)v-=9;                          // назначенный этой властью снисходительнее
    if(j.by===(S.pres?S.pres.party:null))v-=6;
    v+=noise(j.id+'|'+law.topic+law.stance+law.q,7);
    if(v>18)n++;
  });
  return n;
}

/* ─── надзор ─────────────────────────────────────────────────────
   След копится от каждой сделки. Прокуратура его когда-нибудь
   заметит — тем скорее, чем она независимее. */
function trail(){ return S.trail||0; }
function addTrail(v,who){
  S.trail=clamp((S.trail||0)+v,0,TRAIL_MAX);
  if(who)S.trailLog.unshift({q:S.q,t:who,v:r1(v)});
  if(S.trailLog.length>40)S.trailLog.pop();
}
/* независимость прокуратуры: антикоррупционный закон плюс суд */
function prosFree(){
  const l=lawOn('graft');
  return clamp(0.5+(l?l.stance:0)*0.18+courtFree()*0.08,0.1,1.1);
}
function probeRisk(){ return clamp(trail()/100*prosFree()*0.42,0,0.5); }
function trailWord(){ const v=trail();
  return v<15?'чисто':v<35?'есть о чём спросить':v<58?'папка растёт':v<80?'дело на выходе':'вопрос времени'; }

/* ─── партия изнутри ─────────────────────────────────────────────
   Своя фракция не монолит: депутаты стоят левее и правее лидера,
   и когда линия уезжает, крыло начинает роптать. */
function mainAxis(){
  // ось, по которой фракция расходится сильнее всего
  let best=AX[0],bv=-1;
  AX.forEach(a=>{
    const mine=S.deputies.filter(d=>d.party===PL);
    if(!mine.length)return;
    const m=mine.reduce((s,d)=>s+d.st[a],0)/mine.length;
    const v=mine.reduce((s,d)=>s+Math.abs(d.st[a]-m),0)/mine.length;
    if(v>bv){bv=v;best=a;}
  });
  return best;
}
/* Порог крыла считается от фактического разброса фракции, а не задан
   числом: за созывы позиции разъезжаются, и жёсткая граница то съедала
   бы крылья целиком, то записывала в них половину зала. */
function wingGap(ax){
  const mine=S.deputies.filter(d=>d.party===PL);
  if(!mine.length)return 0.42;
  const base=me().st[ax]||0;
  const m=mine.reduce((s,d)=>s+Math.abs(d.st[ax]-base),0)/mine.length;
  return clamp(m*1.15,0.25,1.2);
}
function wingOf(d,ax,gap){
  const g=gap===undefined?wingGap(ax):gap;
  const v=d.st[ax]-(me().st[ax]||0);
  return v<-g?'left':v>g?'right':'core';
}
function wings(){
  const ax=mainAxis(), gap=wingGap(ax), out={left:[],core:[],right:[]};
  S.deputies.filter(d=>d.party===PL).forEach(d=>out[wingOf(d,ax,gap)].push(d));
  return {ax,gap:r2(gap),...out};
}
function wingMood(list){
  if(!list.length)return 50;
  return Math.round(list.reduce((s,d)=>s+d.rel,0)/list.length);
}
const WINGNAME={left:'левое крыло',core:'ядро',right:'правое крыло'};

/* ─── распределение мандатов по действующему закону ──────────────
   Метод и барьер задаёт избирательный закон, а не константа. */
function allocate(shares,n){
  const sys=voteSys(), keys=Object.keys(shares);
  const tot=keys.reduce((a,k)=>a+shares[k],0)||1;
  const ok=keys.filter(k=>shares[k]/tot*100>=sys.thr);
  const use=ok.length?ok:keys;                       // барьер не должен обнулить палату
  const out={}; keys.forEach(k=>out[k]=0);
  for(let i=0;i<n;i++){
    let best=null,bv=-1;
    use.forEach(k=>{
      const div=sys.method==='sainte'?(2*out[k]+1):(out[k]+1);
      const v=shares[k]/div;
      if(v>bv){bv=v;best=k;}
    });
    out[best]++;
  }
  return out;
}

/* ─── соседи ─────────────────────────────────────────────────────
   Внешний спрос и цены на сырьё больше не случайны: их держат
   отношения с четырьмя государствами по периметру. */
function nbOf(id){ return S.nb?S.nb[id]:null; }
function nbWord(v){ return v>=70?'союз':v>=54?'добрососедство':v>=38?'сдержанно':v>=22?'холодно':'вражда'; }
function nbTrade(){
  let s=0,w=0;
  NEIGHBOURS.forEach(x=>{ const st=nbOf(x.id); if(!st)return;
    s+=(st.rel-50)*x.trade; w+=x.trade; });
  return r1(s/(w||1));
}
/* враждебный сосед греет приграничные края */
function nbPressure(rid){
  let v=0;
  NEIGHBOURS.forEach(x=>{ const st=nbOf(x.id); if(!st)return;
    if(x.border.indexOf(rid)<0)return;
    if(st.rel<38)v+=(38-st.rel)*0.05*x.power;
  });
  return r1(v);
}

/* ─── расстояние по осям ─────────────────────────────────────── */
function axDist(a,b,w){
  let s=0,tw=0;
  AX.forEach(k=>{ const ww=w?w[k]:1; s+=Math.abs((a[k]||0)-(b[k]||0))*ww; tw+=ww; });
  return s/tw;                               // 0…4
}
/* насколько группе нравится набор позиций: 100 — идеально */
function fitOf(g,st){ return clamp(100-axDist(g.pref,st,g.w)*34,2,100); }

/* ─── стартовое состояние ────────────────────────────────────── */
function initState(pl){
  REGIONS.forEach(r=>{ const s=Object.values(r.mix).reduce((a,b)=>a+b,0);
    r.share={}; GROUPS.forEach(g=>r.share[g.id]=(r.mix[g.id]||0)/s); });

  const player={id:PL,name:pl.name,short:pl.short,color:pl.color,st:{...pl.st},leader:pl.leader,
                base:[],funds:pl.funds!==undefined?pl.funds:60,mom:0};
  S={
    q:1, term:1, termStart:1, over:false, ended:null,

    ap:3, cap:52, funds:60,

    tax:{inc:2,corp:2,vat:2},
    spend:{def:2,pol:2,med:2,edu:2,soc:2,inf:2},

    cyc:{ph:Math.random(),len:ri(13,19)},      // фаза хозяйственного цикла
    world:{demand:100,res:100},                // внешний спрос и цены на сырьё
    comm:{}, rec:0,                            // комитеты и длина спада
    stab:58,
    mood:{}, rmod:{}, unrest:{},
    deputies:[], seats:{}, regSeats:{},
    senate:[], senSeats:{}, senCls:0,        // вторая палата и номер переизбираемого класса
    senRules:null, senLead:null, senHold:null, mate:null,   // регламент, лидер, повестка, напарник
    pres:null, vp:null, presRel:58, vetoed:null, decrees:[], presRace:null,
    pm:null, ministers:{},                   // премьер и министры — люди, а не партии
    you:{name:pl.leader, age:pl.age||48, origin:pl.origin||'province', traits:pl.traits||[],
         rep:{honest:50,firm:50,comp:50,folk:50}, career:[]},
    govs:{}, govLog:[],                      // главы субъектов и их смена
    press:null, court:[], nb:{},             // печать, суд, соседи
    trail:0, trailLog:[], probe:null,        // след от сделок и текущее дело
    challenge:null, ref:null,                // вызов лидерству и референдум
    gov:{lead:PL,coal:[PL],posts:{}},
    partners:{},                       // терпение союзников
    bill:null, billNo:0, laws:[], votes:[],
    pending:[], log:[], chron:[], hist:[],
    poll:0, camp:null, tab:'brief', sel:null, filter:'all',
    ev:{seen:[],cool:0}, shockCool:0, role:'pm', noConfCool:0, moodShock:{}, fatigue:0, govAge:0,
    promises:[], termGdp:100, termLaws:0, snaps:0,          // обещания и досрочные выборы
    budget:{submitted:false,fails:0}, lastBudget:null,      // годовой бюджет
  };
  GROUPS.forEach(g=>S.mood[g.id]=clamp(fitOf(g,player.st)*0.5+20+rnd(-4,4),20,70));
  REGIONS.forEach(r=>{ S.rmod[r.id]=r1((r.dev-2)*1.5+rnd(-3,3)); S.unrest[r.id]=ri(6,18); });
  // происхождение уже разошлось по стране до вашего первого решения
