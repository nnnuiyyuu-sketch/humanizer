function presidentialElection(){
  const promVerdict=checkPromises();   // спрос за обещания до подсчёта голосов
  const inc=incomeBreakdown();
  const opp=PARTIES.filter(p=>p.id!==PLAYER).sort((a,b)=>(S.houseSeats[b.id]||0)-(S.houseSeats[a.id]||0))[0];
  let traitor=null,tr=0;
  if(S.vp&&S.vp.party!==PLAYER&&(S.relations[S.vp.party]??50)<45){
    traitor=S.vp;tr=clamp(8+(60-(S.vp.loyalty||50))/4,5,20);}
  const riv=S.rival||findRival();
  const rivBase=riv?clamp((riv.pop-52)*0.55,2,14):0;
  const bonus=(S.stability-50)*0.10+(inc.net>0?2:-2)+DIFFS[S.diff].shareMod+(S.vp&&S.vp.party===PLAYER?2:0);
  const res=[];let mine=0,theirs=0,tot=0,won=0,rivTot=0;
  REGIONS.forEach(r=>{const q=rs(r.id);
    // губернатор-конкурент берёт больше всего в своей области
    const rv=riv?(riv.region===r.id?rivBase*2.6:rivBase*0.8):0;
    let sh=clamp(support(r.id)*0.92+bonus+campBonus(r.id)+(q.gov.party===PLAYER?3:-1)+rnd(-3,3)-tr*0.55-rv*0.6,3,97);
    const os=clamp(100-sh-tr-rv,1,97);
    rivTot+=popOf(r.id)*rv;
    mine+=popOf(r.id)*sh;theirs+=popOf(r.id)*os;tot+=popOf(r.id);
    if(sh>os&&sh>tr)won++;
    res.push({r,sh:r1(sh),os:r1(os)});});
  const share=r1(mine/tot),oppShare=r1(theirs/tot),rivShare=r1(rivTot/tot);
  const trShare=r1(clamp(100-share-oppShare-rivShare,0,40));
  const winFill=x=>{const e=res.find(z=>z.r.id===x.id);return e.sh>e.os?P(PLAYER).color:opp.color;};
  const bars=`<div class="votebar" style="height:14px;border-radius:7px">
      <i style="width:${share}%;background:${P(PLAYER).color}"></i><i style="width:${oppShare}%;background:${opp.color}"></i>
      ${rivShare>0.5?`<i style="width:${rivShare}%;background:#7A6A55"></i>`:''}
      ${trShare>0.5?`<i style="width:${trShare}%;background:var(--ink3)"></i>`:''}<span class="thr"></span></div>
    <div class="result">
      <span class="pchip"><i style="background:${P(PLAYER).color}"></i>Вы</span><b>${share}%</b>
      <span class="pchip"><i style="background:${opp.color}"></i>${S.leaders[opp.id]}</span><b>${oppShare}%</b>
      ${rivShare>0.5?`<span class="pchip"><i style="background:#7A6A55"></i>${riv.name}, губернатор</span><b>${rivShare}%</b>`:''}
      ${trShare>0.5?`<span class="pchip"><i style="background:var(--ink3)"></i>${traitor.name}, экс-вице</span><b>${trShare}%</b>`:''}
      <span>Регионов выиграно</span><b>${won} из 11</b>
      ${S.camp?`<span>Вклад предвыборного штаба</span><b class="pos">+${r1(campBonus())}</b>`:''}</div>`;
  const map=mapSVG({fill:winFill,label:x=>{const e=res.find(z=>z.r.id===x.id);return Math.round(e.sh)+'%';}});
  const promBlock=promVerdict?'<div class="sec" style="margin:14px 2px 6px"><h2>Спрос за обещания</h2></div>'+promVerdict:'';
  if(share>50){S.termWon=true;
    sheet({eyebrow:'Президентские выборы · '+seasonLabel(S.season),title:'Вы переизбраны',
      body:bars+map+'<p class="hint" style="text-align:center">карта победителей по регионам</p>'+promBlock+'<div class="verdict yes">ВТОРОЙ СРОК</div>',
      buttons:[{label:'Править дальше',fn:()=>{S.promises=[];S.econ.gdp0=S.econ.gdp;S.econ.rail=0;choosePromises();}},
               {label:'Уйти на покое',ghost:true,fn:()=>retire('Вы ушли на пике, переизбравшись с '+share+'%.')}]});
    logMsg('Переизбрание: '+share+'% против '+oppShare+'%, выиграно '+won+' регионов.');
    chronicle('Президент переизбран на второй срок с '+share+'%.','good');}
  else {
    S.over=true;S.won=false;const fs=finalScore();
    logMsg('Выборы проиграны: '+share+'% против '+oppShare+'%.');
    chronicle('Президент проиграл выборы: '+share+'% против '+oppShare+'%.','bad');
    sheet({eyebrow:'Президентские выборы',title:'Вы проиграли выборы',
      body:bars+map+'<p class="hint" style="text-align:center">карта победителей по регионам</p>'+promBlock+
        '<div class="verdict no">ПОРАЖЕНИЕ</div>'+
        '<p>Кабинет переходит к '+opp.name+'. Но мандат депутата у вас остался, а фракция готова избрать вас лидером оппозиции.</p>'+
        '<div class="result"><span>Очки за срок</span><b>'+fs.sc+'</b><span>Титул</span><b class="w">«'+fs.t+'»</b></div>',
      buttons:[
        {label:'Возглавить оппозицию',fn:()=>goOpposition(opp.id)},
        {label:'Уйти из политики',ghost:true,fn:()=>gameOver(false,'Вы покинули политику после поражения с '+share+'%.')}]});
  }
}

function retire(reason){
  if(S.vp&&S.vp.party===PLAYER){S.succession=true;gameOver(true,reason+' Вице-президент '+S.vp.name+' принимает присягу как преемник: курс продолжен.');}
  else if(S.vp)gameOver(true,reason+' Преемником стал(а) '+S.vp.name+' из '+P(S.vp.party).name+' — союзник, но не ваш человек.');
  else gameOver(true,reason+' Преемника вы не подготовили: начинается борьба за освободившийся кабинет.');
}

function finalScore(){
  const sc=S.lawsPassed.length*12+Math.round(approval())+friendlyRegions()*7+
    S.dip.filter(d=>d.pact).length*8+S.industries.reduce((s,x)=>s+x.level*6,0)+
    Math.max(0,Math.round(S.treasury/8))+Math.max(0,Math.round(40-avgUnrest()))+BLOCS.filter(b=>orgStance(b.id)>0).length*10+
    (S.termWon?60:0)+(S.succession?25:0)+(S.diff==='hard'?25:0);
  let t='Завхоз района';
  if(sc>=130)t='Крепкий хозяйственник';if(sc>=210)t='Государственный деятель';
  if(sc>=300)t='Отец Новарии';if(sc>=390)t='Легенда учебников истории';
  return {sc,t};
}

function gameOver(won,reason){
  S.over=true;S.won=won;const {sc,t}=finalScore();
  chronicle(reason,won?'good':'bad');
  sheet({eyebrow:'Итог правления',title:won?'Победа':'Конец карьеры',
    body:(won?'<img class="emblem" src="'+EMBLEM+'" alt="Герб">':'')+'<p>'+reason+'</p><div class="result">'+
      '<span>Сезонов у власти</span><b>'+S.season+'</b>'+
      '<span>Законов подписано</span><b>'+S.lawsPassed.length+'</b>'+
      '<span>Регионов за ПНВ</span><b>'+friendlyRegions()+'/11</b>'+
      '<span>Мандатов ПНВ в палате</span><b>'+(S.houseSeats.pnv||0)+'</b>'+
      '<span>Средняя напряжённость</span><b>'+Math.round(avgUnrest())+'</b>'+
      '<span>Казна</span><b>'+S.treasury+'</b><span>Очки</span><b>'+sc+'</b></div>'+
      '<div class="rank">«'+t+'»</div>',
    buttons:[{label:'Новая партия',fn:()=>newGame()}]});
}

/* ─────────── конец сезона ─────────── */

function endSeason(){
  if(S.over)return;
  const D=DIFFS[S.diff],inc=incomeBreakdown();
  S.treasury+=inc.net;
  // напряжённость: растёт от налогов и слабой поддержки, гаснет от стабильности
  REGIONS.forEach(r=>{const q=rs(r.id);
    let du=(S.taxes===2?1.6:S.taxes===0?-0.8:0.4)+(50-support(r.id))*0.045+(45-S.stability)*0.025+rnd(-1.5,1.5);
    if(q.program)du-=1.2;
    if(q.gov.party===PLAYER)du-=0.5;
    q.unrest=clamp(q.unrest+du,0,100);
    // поддержка: тянется к средней по стране, падает от напряжённости
    // местная надбавка выдыхается: эффект визита не вечен
    let dl=-q.local*0.14-q.unrest*0.035+rnd(-0.5,0.5);
    if(q.gov.party===PLAYER)dl+=0.45;
    if(q.program)dl+=0.35;
    q.local=clamp(q.local+dl,-22,22);});
  // настроения блоков: курс президента, организации, налоги, гравитация
  BLOCS.forEach(b=>{
    const q=S.bloc[b.id];
    let ds=(45-q.support)*0.135
          +(blocAlign(b.id)-0.35)*0.64
          +orgStance(b.id)*0.9
          +(S.taxes===2?(b.id==='urban'||b.id==='work'?-1.4:-0.9):S.taxes===0?0.9:0)
          -avgUnrest()*0.035+rnd(-1.1,1.1);
    q.support=clamp(q.support+ds,0,100);
    q.mood=clamp(q.mood+(q.support-q.mood)*0.12+blocAlign(b.id)*0.5+rnd(-1,1),0,100);});
  S.stability=clamp(S.stability+(50-S.stability)*0.06-avgUnrest()*0.04+rnd(-1,1),0,100);
  S.dip.forEach(c=>{c.rel=clamp(c.rel+rnd(-2,1),0,100);
    if(c.rel<25&&Math.random()<(0.3+D.eventBad*0.05)){S.treasury-=12;const had=c.pact;c.pact=false;
      logMsg(c.name+' ввёл санкции: −12 млрд'+(had?', торговый договор разорван':'')+'.');}});
  if(isOpp())govTick(); else {ministersTick();ministerDemands();programsTick();}
  governorsTick();                  // губернаторы: лояльность, коррупция, демарши
  mediaTick();driftIdeology();refreshOppLeader();
  econTick();                       // ВВП, инфляция, безработица, долг
  S.pc=clamp(S.pc+pcIncome(),0,PC_MAX);   // восстановление политического капитала
  demandsTick();                    // требования фракций и министров
  pendingTick();                    // отложенные последствия прошлых решений
  // население: люди едут туда, где работа и спокойствие
  REGIONS.forEach(r=>{const q=rs(r.id);
    const d=(regionIncome(r)/popOf(r.id)-0.5)*0.05-q.unrest*0.0035+rnd(-0.02,0.02);
    S.pop[r.id]=Math.max(2,r1(S.pop[r.id]*(1+d/100)+d*0.05));});
  logMsg('Сезон закрыт: бюджет '+sign(inc.net)+' млрд, в казне '+S.treasury+' млрд.');
  S.season++;S.ap=3;S.used={};S.issue=pick(ISSUES).id;
  snapshot();                       // точка для графиков летописи

  const ap=approval();
  if(isOpp()){
    if(S.treasury<=-40){gameOver(false,'Партийная касса пуста, кредиторы описали имущество штаба. Фракция сменила лидера.');render();return;}
    if(ap<=6){gameOver(false,'Поддержка ПНВ упала до '+Math.round(ap)+'%. Партия распалась, вас никто не слушает.');render();return;}
  }
  else{
  if(S.treasury<=D.bankrupt){gameOver(false,'Казна опустилась ниже '+D.bankrupt+' млрд. Объявлен дефолт, правительство отправлено в отставку.');render();return;}
  if(ap<=D.resign){
    if(S.vp&&S.vp.party===PLAYER&&!S.succession){S.succession=true;S.over=true;S.won=true;const {sc,t}=finalScore();
      logMsg('Управляемый транзит: власть принимает '+S.vp.name+'.');
      sheet({eyebrow:'Отставка с честью',title:'Управляемый транзит власти',
        body:'<p>Одобрение упало до '+Math.round(ap)+'%. Но преемник был готов: вице-президент '+S.vp.name+' берёт бразды, и вы уходите красиво.</p><div class="rank">«'+t+'» · '+sc+' очков</div>',
        buttons:[{label:'Новая партия',fn:()=>newGame()}]});render();return;}
    S.over=true;S.won=false;
    sheet({eyebrow:'Отставка',title:'Парламент вынудил вас уйти',
      body:'<p>Одобрение упало до '+Math.round(ap)+'%. Кабинет распущен. Но кресло лидера фракции свободно.</p>',
      buttons:[{label:'Возглавить оппозицию',fn:()=>goOpposition(oppLeaderParty().id)},
               {label:'Уйти из политики',ghost:true,fn:()=>gameOver(false,'Вы покинули политику при одобрении '+Math.round(ap)+'%.')}]});
    render();return;}
  }

  if(!S.warned.treasury&&S.treasury<=D.bankrupt+60){S.warned.treasury=true;
    sheet({eyebrow:'Срочный доклад',title:'Казна на исходе',body:'<p>До дефолта осталось '+(S.treasury-D.bankrupt)+' млрд. Поднимите налоги, проведите приватизацию или амнистию капитала.</p>'});}
  if(!S.warned.approval&&ap<=D.resign+10){S.warned.approval=true;
    sheet({eyebrow:'Срочный доклад',title:'Рейтинг у красной черты',body:'<p>При '+D.resign+'% вас снимут. Митинги и визиты в слабые регионы дают быстрый эффект.</p>'});}

  fireEvent();
  const t=inTerm();
  if(t%5===0)governorElections();
  if(t%8===0&&t!==16)houseElections();
  if(t%4===0)leadershipChanges();
  if(t===12&&!isOpp()){campInit();
    sheet({eyebrow:'Кампания открыта',title:'Предвыборный штаб развёрнут',
      body:'<p>До выборов четыре сезона. На вкладке «Кабинет» появился штаб: выберите стратегию, закупайте рекламу и готовьтесь к дебатам.</p>'+
        '<p class="hint">Всё, что штаб наработает, добавится к вашему результату поверх обычной поддержки регионов.</p>'});}
  if(t===15&&!isOpp()&&S.camp&&!S.camp.debate)debateEvent();
  if(t===15&&!isOpp())S.rival=findRival();
  if(t===16){ if(isOpp())oppElection(); else presidentialElection(); }
  if(t===32&&S.termWon&&!S.over&&!isOpp())gameOver(true,'Третий срок конституция не допускает. Вы передаёте власть преемнику.');
  render();
}

/* ─────────── старт ─────────── */

function newGame(){
  clearQueue();
  sheet({eyebrow:'Новая партия',title:'Президент Республики Новария',
    body:`<img class="emblem big" src="${EMBLEM}" alt="Герб Республики Новария"><p>Одиннадцать субъектов от Балтики до Тихоокеанска, две палаты, четыре оппозиционные фракции и шестнадцать сезонов до выборов.</p>
      <div class="result" style="margin:14px 0">
        <span>Каждый сезон</span><b class="w">3 действия</b>
        <span>Народная палата</span><b class="w">500 мест</b>
        <span>Сенат</span><b class="w">175 мест</b>
        <span>Одобрение страны</span><b class="w">настроения блоков</b></div>
      <p class="hint">Рейтинг собирается снизу: пять электоральных блоков — рабочие, село, горожане, патриоты, интеллигенция — по-своему смотрят на ваш курс, а демография регионов превращает их настроения в депутатов и сенаторов.</p>`,
    buttons:[{label:'Обычный режим',ghost:true,fn:()=>startTerm('norm')},{label:'Жёсткий режим',fn:()=>startTerm('hard')}]});
}

function start(){
  document.getElementById('flagimg').src=FLAG;
  const fav=document.createElement('link');fav.rel='icon';fav.href=EMBLEM;document.head.appendChild(fav);
  initState('hard');
  document.getElementById('logbtn').onclick=openLog;
  render();newGame();
}
document.addEventListener('DOMContentLoaded',start);
</script>
</body>
