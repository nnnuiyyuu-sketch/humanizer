<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Political Process: Britain — бета 1.0</title>
<style>
/* The Political Process: Britain — оформление */
:root {
  --bg: #0d1117;
  --bg-2: #141b24;
  --panel: #172130;
  --panel-2: #1e2a3a;
  --line: #2a3a4f;
  --text: #e6edf5;
  --muted: #90a2b8;
  --accent: #d4af37;
  --green: #3fb950;
  --red: #f85149;
  --blue: #58a6ff;
  --radius: 10px;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: radial-gradient(1200px 700px at 50% -10%, #1b2735 0%, var(--bg) 60%);
  color: var(--text);
  font: 15px/1.5 "Segoe UI", Roboto, -apple-system, "Helvetica Neue", Arial, sans-serif;
  min-height: 100vh;
}

h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; font-weight: 600; margin: 0 0 8px; }
h1 { font-size: 28px; letter-spacing: 0.3px; }
h2 { font-size: 20px; }
h3 { font-size: 16px; }
p { margin: 0 0 10px; }
a { color: var(--blue); }

.wrap { max-width: 1240px; margin: 0 auto; padding: 16px; }
.hidden { display: none !important; }

/* ---------- Кнопки ---------- */
button {
  font: inherit;
  color: var(--text);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 8px 14px;
  cursor: pointer;
  transition: background .15s, border-color .15s, transform .05s;
}
button:hover:not(:disabled) { background: #26374d; border-color: #3d5876; }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: linear-gradient(180deg, #b8912b, #8f6f1f); border-color: #d4af37; color: #14100a; font-weight: 600; }
button.primary:hover:not(:disabled) { background: linear-gradient(180deg, #d4af37, #a8832a); }
button.ghost { background: transparent; }
button.danger { border-color: #6d2b2b; }

/* ---------- Титульный экран ---------- */
.title-screen { text-align: center; padding: 34px 16px 60px; }
.title-screen h1 { font-size: 44px; margin-bottom: 4px; }
.title-screen .sub { color: var(--muted); margin-bottom: 26px; }
.crest { font-size: 54px; line-height: 1; margin-bottom: 8px; }

.party-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; text-align: left; }
.party-card {
  background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--pc, #888);
  border-radius: var(--radius); padding: 12px 14px; cursor: pointer;
}
.party-card:hover { background: var(--panel-2); }
.party-card.selected { outline: 2px solid var(--accent); }
.party-card .pname { font-weight: 700; font-size: 17px; }
.party-card .pru { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
.party-card .pblurb { font-size: 13px; color: #c3d0e0; }
.party-card .pstats { font-size: 12px; color: var(--muted); margin-top: 8px; font-family: var(--mono); }

.setup-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; margin: 18px 0; }
select, input[type=text] {
  font: inherit; color: var(--text); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px;
}

/* ---------- Верхняя панель ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  background: rgba(19, 26, 36, .96); backdrop-filter: blur(6px);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px 14px; margin-bottom: 14px;
}
.topbar .brand { font-family: Georgia, serif; font-weight: 700; }
.stat { display: flex; flex-direction: column; line-height: 1.15; padding: 0 8px; border-left: 1px solid var(--line); }
.stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.stat .v { font-family: var(--mono); font-size: 15px; }
.spacer { flex: 1; }

.layout { display: grid; grid-template-columns: 320px 1fr; gap: 14px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
.panel h3 { display: flex; justify-content: space-between; align-items: baseline; }
.panel .hint { font-size: 12px; color: var(--muted); font-weight: 400; }

/* ---------- Опрос и места ---------- */
.poll-row { display: grid; grid-template-columns: 46px 1fr 52px; gap: 8px; align-items: center; margin-bottom: 5px; font-size: 13px; }
.poll-row .abbr { font-family: var(--mono); font-weight: 700; }
.bar { height: 14px; background: #101822; border-radius: 4px; overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 4px; transition: width .4s; }
.poll-row .num { text-align: right; font-family: var(--mono); }
.delta { font-size: 11px; font-family: var(--mono); }
.delta.up { color: var(--green); }
.delta.down { color: var(--red); }

.commons { display: flex; height: 22px; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); margin: 6px 0; }
.commons > span { display: block; height: 100%; }
.majority-line { font-size: 11px; line-height: 1.35; color: var(--muted); margin: 4px 0 10px; }

/* ---------- Вкладки ---------- */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tabs button { padding: 7px 12px; border-radius: 999px; font-size: 14px; }
.tabs button.active { background: var(--accent); color: #14100a; border-color: var(--accent); font-weight: 600; }

/* ---------- Действия ---------- */
.action-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; }
.action-card { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; }
.action-card .ahead { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.action-card .aicon { font-size: 20px; }
.action-card .adesc { font-size: 13px; color: var(--muted); margin: 6px 0 10px; flex: 1; }
.action-card .acost { font-family: var(--mono); font-size: 12px; color: var(--accent); margin-bottom: 8px; }
.action-card.disabled { opacity: .5; }

/* ---------- Регионы ---------- */
.region-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.region-card { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; }
.region-card:hover { border-color: #3d5876; }
.region-card .rname { font-weight: 600; display: flex; justify-content: space-between; }
.region-card .rseats { font-size: 12px; color: var(--muted); font-weight: 400; }
.region-card .rlead { font-size: 12px; font-family: var(--mono); margin-top: 4px; }
.region-card.selected { outline: 2px solid var(--accent); }
.mini-bar { display: flex; height: 8px; border-radius: 3px; overflow: hidden; margin-top: 6px; }
.mini-bar > span { display: block; height: 100%; }

/* ---------- Темы и позиции ---------- */
.issue { margin-bottom: 12px; }
.issue .ihead { display: flex; justify-content: space-between; font-size: 14px; }
.issue .isal { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.scale { position: relative; height: 26px; background: linear-gradient(90deg, #24405e, #2b2f3d, #5e2b2b); border-radius: 4px; margin-top: 5px; }
.scale .tick { position: absolute; top: 2px; width: 3px; height: 22px; border-radius: 2px; }
.scale .voter { position: absolute; top: -3px; font-size: 12px; transform: translateX(-50%); }
.scale-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 3px; }

/* ---------- Списки ---------- */
.list { max-height: 460px; overflow-y: auto; }
.news-item { border-left: 3px solid var(--line); padding: 6px 10px; margin-bottom: 6px; font-size: 13px; background: var(--panel-2); border-radius: 0 6px 6px 0; }
.news-item .w { color: var(--muted); font-family: var(--mono); font-size: 11px; }
.news-item.good { border-left-color: var(--green); }
.news-item.bad { border-left-color: var(--red); }
.news-item.event { border-left-color: var(--accent); }
.news-item.poll { border-left-color: var(--blue); }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; cursor: pointer; }
tr:hover td { background: var(--panel-2); }
td.num, th.num { text-align: right; font-family: var(--mono); }
.pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; color: #0d1117; }

/* ---------- Модальные окна ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(5, 8, 12, .78); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; max-width: 620px; width: 100%; max-height: 88vh; overflow-y: auto; box-shadow: 0 24px 60px rgba(0,0,0,.6); }
.modal h2 { border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.modal .options { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.modal .options button { text-align: left; }
.modal .opt-hint { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }

/* ---------- Ночь выборов ---------- */
.night { max-width: 1100px; margin: 0 auto; }
.clock { font-family: var(--mono); font-size: 34px; text-align: center; color: var(--accent); }
.decl-feed { max-height: 300px; overflow-y: auto; font-size: 13px; }
.decl { display: grid; grid-template-columns: 60px 1fr 90px 62px; gap: 8px; padding: 5px 8px; border-bottom: 1px solid var(--line); align-items: center; }
.decl.gain { background: rgba(212, 175, 55, .10); }
.tickers { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 12px 0; }
.ticker { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; text-align: center; }
.ticker .tn { font-family: var(--mono); font-size: 26px; }
.ticker .tl { font-size: 12px; color: var(--muted); }
.ticker .tc { font-size: 12px; font-family: var(--mono); }

.result-hero { text-align: center; padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); margin-bottom: 14px; }
.result-hero .big { font-size: 30px; font-family: Georgia, serif; }
.footer-note { color: var(--muted); font-size: 12px; text-align: center; padding: 20px 0 40px; }

/* ============================================================
   Меню запуска и английская атмосфера
   ============================================================ */

:root {
  --bench: #1d4231;      /* зелень скамей Палаты общин */
  --parchment: #f3ead6;
  --ink: #1b1b1b;
  --union-red: #c8102e;
  --union-blue: #012169;
}

/* --- заставка --- */
.hero {
  position: relative;
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 18px;
  min-height: 500px;
  display: flex;
  align-items: flex-start;
  background: linear-gradient(180deg, #16243d 0%, #2c4166 48%, #14203a 78%, #0b1017 100%);
}
.skyline { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: auto; z-index: 0; }
.hero-scrim {
  position: absolute; inset: 0; z-index: 1;
  background: linear-gradient(180deg, rgba(11,16,23,.10) 0%, rgba(11,16,23,.22) 46%, rgba(11,16,23,.62) 78%, rgba(11,16,23,.92) 100%);
}
.hero-inner { position: relative; z-index: 2; padding: 34px 22px 26px; width: 100%; text-align: center; }
.hero-inner .hero-actions { margin-top: 20px; }
.flag { display: flex; justify-content: center; gap: 4px; margin-bottom: 10px; }
.flag span { display: block; width: 30px; height: 5px; border-radius: 2px; }
.flag span:nth-child(1) { background: var(--union-blue); }
.flag span:nth-child(2) { background: #fff; }
.flag span:nth-child(3) { background: var(--union-red); }

.game-title {
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(30px, 5.4vw, 54px);
  letter-spacing: 1px;
  margin: 0 0 2px;
  text-shadow: 0 3px 18px rgba(0,0,0,.65);
}
.game-sub { color: var(--muted); letter-spacing: 2px; font-size: 12px; text-transform: uppercase; }
.quote { font-family: Georgia, serif; font-style: italic; color: #cbd7e6; margin: 14px auto 18px; max-width: 640px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
button.big { padding: 12px 22px; font-size: 15px; }

.home-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 16px; }
.home-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.home-card .hc-icon { font-size: 24px; }
.home-card h3 { margin: 6px 0 6px; }
.home-card p { font-size: 13px; color: var(--muted); margin: 0; }

/* --- шаги меню --- */
.menu-screen { padding-bottom: 30px; }
.menu-head { text-align: center; margin-bottom: 18px; }
.menu-head h1 { font-size: 30px; margin: 8px 0 2px; }
.crumbs { display: flex; gap: 8px; justify-content: center; align-items: center; font-size: 12px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
.crumb.now { color: var(--accent); font-weight: 700; }
.crumb.done { color: #b9c8d9; }
.crumb-sep { opacity: .5; }

.pick-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.pick-card {
  background: var(--panel); border: 1px solid var(--line);
  border-left: 6px solid var(--pc, #43536b);
  border-radius: var(--radius); padding: 14px 16px; cursor: pointer;
  transition: transform .1s, border-color .15s, background .15s;
}
.pick-card:hover { background: var(--panel-2); transform: translateY(-2px); }
.pick-card.selected { outline: 2px solid var(--accent); }
.pick-card.own { border-left-style: dashed; }
.pick-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.pick-icon { font-size: 26px; }
.pick-name { font-family: Georgia, serif; font-size: 18px; font-weight: 600; }
.pick-en { font-size: 12px; color: var(--muted); letter-spacing: .6px; }
.pick-desc { font-size: 13px; color: #c6d3e2; margin: 0 0 8px; }
.pick-quote { font-family: Georgia, serif; font-style: italic; font-size: 12.5px; color: var(--accent); border-top: 1px solid var(--line); padding-top: 8px; }
.perks { margin: 0 0 8px; padding-left: 18px; font-size: 12.5px; color: var(--muted); }
.perks li { margin-bottom: 3px; }
.stat-line { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 6px; }
.stat-line b { display: block; font-family: var(--mono); font-size: 13px; color: var(--text); text-transform: none; letter-spacing: 0; }
.leader-line, .goal-line { font-size: 12px; color: var(--muted); }
.goal-line { margin-top: 4px; color: var(--accent); }

.menu-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }

/* --- розетка кандидата --- */
.rosette {
  position: relative; display: inline-block;
  width: var(--s, 30px); height: var(--s, 30px); flex: none;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, #fdfdfd 0 22%, var(--c) 24% 100%);
  box-shadow: inset 0 0 0 2px rgba(0,0,0,.28), 0 2px 6px rgba(0,0,0,.4);
  vertical-align: middle;
}
.rosette::before, .rosette::after {
  content: ''; position: absolute; top: 72%; left: 50%;
  width: calc(var(--s, 30px) * .22); height: calc(var(--s, 30px) * .55);
  background: var(--c); border-radius: 0 0 3px 3px;
}
.rosette::before { transform: translateX(-115%) rotate(12deg); }
.rosette::after { transform: translateX(15%) rotate(-12deg); }

/* --- конструктор партии --- */
.builder { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
@media (max-width: 900px) { .builder { grid-template-columns: 1fr; } }
.mini-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.mini-card { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; cursor: pointer; }
.mini-card:hover { border-color: #3d5876; }
.mini-card.selected { outline: 2px solid var(--accent); }
.mini-card .mini-head { font-weight: 600; margin-bottom: 4px; }
.mini-card p { font-size: 12px; color: var(--muted); margin: 0; }
.mini-stat { font-size: 11px; font-family: var(--mono); color: var(--accent); margin-top: 6px; }

.field-row { display: flex; flex-wrap: wrap; gap: 10px; }
/* Подписи полей: в конструкторе — колонкой, в остальных местах — строкой. */
label { font-size: 13px; color: var(--text); }
.builder label, .field-row label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.setup-row label, table label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); }
label.wide { width: 100%; margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
label input, label select { color: var(--text); }
input[type=color] { width: 54px; height: 34px; padding: 2px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); }

.slider-row { margin-bottom: 12px; }
.slider-head { display: flex; justify-content: space-between; font-size: 13px; }
.slider-val { font-family: var(--mono); color: var(--accent); }
input[type=range] { width: 100%; accent-color: var(--accent); }

.stat-alloc { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; }
.stat-alloc .hint { font-size: 12px; }
.alloc-controls { display: flex; align-items: center; gap: 8px; }
.alloc-controls button { padding: 2px 12px; font-size: 16px; line-height: 1.2; }
.alloc-val { font-family: var(--mono); min-width: 28px; text-align: center; }

.preview-card { background: var(--panel-2); border: 1px solid var(--line); border-left: 6px solid var(--pc); border-radius: var(--radius); padding: 12px; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border-radius: 999px; padding: 6px 14px; }
.chip.active { background: var(--accent); color: #14100a; border-color: var(--accent); font-weight: 600; }

.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.sum-item { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; }
.sum-item .k { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
.sum-item .v { display: flex; align-items: center; gap: 6px; font-size: 14px; }

/* --- атмосфера в кампании --- */
.topbar .brand { display: flex; align-items: center; gap: 8px; padding-right: 6px; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-name { font-family: Georgia, serif; font-size: 15px; }
.brand-role { font-family: "Segoe UI", sans-serif; font-size: 11px; color: var(--muted); font-weight: 400; letter-spacing: .3px; }
.topbar .stat { padding: 0 7px; }
.topbar button { padding: 8px 12px; }

.panel.press { background: linear-gradient(180deg, #efe7d4, #e2d8c1); border-color: #cbbf9f; color: #1e1b16; }
.panel.press h3 { color: #1e1b16; font-family: Georgia, serif; border-bottom: 2px solid #1e1b16; padding-bottom: 4px; }
.panel.press .hint { color: #5c5343; }
.press-item { padding: 7px 0; border-bottom: 1px dotted #b3a888; }
.press-item:last-child { border-bottom: 0; }
.press-item .paper { font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; color: #6d6250; }
.press-item .headline { font-family: Georgia, "Times New Roman", serif; font-size: 14.5px; font-weight: 700; line-height: 1.25; }
.press-item.good .headline { color: #14532d; }
.press-item.bad .headline { color: #8c1c1c; }

.rflavour { font-family: Georgia, serif; font-style: italic; font-size: 12px; color: var(--muted); margin-top: 6px; }
p.flavour { font-family: Georgia, serif; font-style: italic; color: #c9d6e5; }

/* ============================================================
   Карта, Палата общин, обзор
   ============================================================ */

.tab-icon { margin-right: 5px; }

/* --- плитки обзора --- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.tile { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.tile .tk { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
.tile .tv { display: block; font-family: var(--mono); font-size: 24px; line-height: 1.25; }
.tile .ts { display: block; font-size: 12px; color: var(--muted); }

/* --- график опросов --- */
.poll-chart { width: 100%; height: auto; }
.chart-grid { stroke: rgba(144,162,184,.18); stroke-width: 1; }
.chart-axis { font-family: var(--mono); font-size: 10px; fill: var(--muted); }

/* --- карта --- */
.map-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.map-modes { justify-content: center; }
.uk-map { width: 100%; max-width: 520px; height: auto; }
.map-region polygon {
  stroke: #0d1117; stroke-width: 1.6; cursor: pointer;
  transition: filter .15s, stroke .15s;
}
.map-region:hover polygon { filter: brightness(1.25); stroke: var(--accent); }
.map-region.selected polygon { stroke: var(--accent); stroke-width: 2.6; }
.map-region.inactive polygon { cursor: default; opacity: .55; }
.map-label { font-family: var(--mono); font-size: 11px; font-weight: 700; fill: #f2f6fb; text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: rgba(6,10,16,.75); stroke-width: 2.6; }
.map-seats { font-family: var(--mono); font-size: 9px; fill: rgba(235,242,250,.72); text-anchor: middle; pointer-events: none; }
.map-outside { fill: #202b3a; stroke: #0d1117; stroke-width: 1.4; }
.map-leader-line { stroke: rgba(212,175,55,.6); stroke-width: 1.2; }
.map-callout { font-size: 11px; fill: var(--accent); font-family: "Segoe UI", sans-serif; }

/* --- Палата общин --- */
.chamber { width: 100%; height: auto; display: block; }
.ch-label { font-size: 12px; fill: var(--muted); font-family: "Segoe UI", sans-serif; letter-spacing: .5px; text-transform: uppercase; }
.ch-note { font-size: 11px; fill: var(--muted); font-family: var(--mono); }
.ch-legend { display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: center; margin-top: 10px; font-size: 12px; }
.ch-leg { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); color: var(--muted); }
.ch-leg i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.ch-leg.mine { color: var(--text); font-weight: 700; }
.ch-leg b { font-weight: 700; }
.ch-leg b.up { color: var(--green); }
.ch-leg b.down { color: var(--red); }
tr.mine-row td { background: rgba(212,175,55,.10); }

/* --- эмблема --- */
.emblem { display: block; }
.topbar-emblem { display: flex; align-items: center; opacity: .9; }
.hero-emblem { display: flex; justify-content: center; margin-bottom: 4px; opacity: .92; }

.map-layout { display: grid; grid-template-columns: minmax(300px, 1.2fr) minmax(250px, 300px); gap: 14px; align-items: start; }
@media (max-width: 860px) { .map-layout { grid-template-columns: 1fr; } }
.map-sea { fill: #101a26; stroke: #223349; stroke-width: 1.4; }
.map-side .map-table { font-size: 12.5px; }
.map-row { cursor: pointer; }
.map-side td, .map-side th { padding: 4px 6px; }
.tile .tv { white-space: nowrap; }

</style>

/* Детерминированный генератор случайных чисел (mulberry32) + утилиты. */
(function (root) {
  'use strict';

  function hashString(str) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  function Rng(seed) {
    if (typeof seed === 'string') seed = hashString(seed);
    this.s = (seed >>> 0) || 1;
  }

  Rng.prototype.next = function () {
    this.s = (this.s + 0x6d2b79f5) >>> 0;
    var t = this.s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

  /* Равномерное на [a, b). */
  Rng.prototype.range = function (a, b) {
    return a + (b - a) * this.next();
  };

  /* Целое на [a, b]. */
  Rng.prototype.int = function (a, b) {
    return Math.floor(this.range(a, b + 1));
  };

  /* Нормальное распределение (Бокс — Мюллер). */
  Rng.prototype.normal = function (mean, sd) {
    var u = 1 - this.next();
    var v = this.next();
    var z = Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    return (mean || 0) + (sd === undefined ? 1 : sd) * z;
  };

  Rng.prototype.pick = function (arr) {
    return arr[Math.floor(this.next() * arr.length)];
  };

  Rng.prototype.chance = function (p) {
    return this.next() < p;
  };

  Rng.prototype.shuffle = function (arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(this.next() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  };

  function clamp(x, lo, hi) { return x < lo ? lo : (x > hi ? hi : x); }

  root.PP = root.PP || {};
  root.PP.Rng = Rng;

/* src/data/press.js */
/*
 * Пресса. Каждую неделю газеты дают свои заголовки — они ничего не решают,
 * но по ним видно, как выглядит кампания со стороны.
 * Издания вымышленные.
 */
(function (root) {
  'use strict';

  var PP = root.PP;

  var PAPERS = [
    { id: 'herald', name: 'The Westminster Herald', lean: 'centre', style: 'broadsheet' },
    { id: 'blaze', name: 'The Daily Blaze', lean: 'right', style: 'tabloid' },
    { id: 'clarion', name: 'The Morning Clarion', lean: 'left', style: 'broadsheet' },
    { id: 'chronicle', name: 'The Evening Chronicle', lean: 'centre', style: 'tabloid' },
    { id: 'ledger', name: 'The City Ledger', lean: 'right', style: 'broadsheet' }
  ];

  function pick(rng, arr) { return arr[Math.floor(rng.next() * arr.length)]; }

  function headlines(state, rng) {
    var out = [];
    var me = state.parties[state.playerId];
    var def = PP.PARTY_BY_ID[state.playerId];
    var hist = state.pollHistory;
    var last = hist[hist.length - 1], prev = hist.length > 1 ? hist[hist.length - 2] : null;
    var move = prev ? (last.shares[state.playerId] || 0) - (prev.shares[state.playerId] || 0) : 0;
    var leader = me.leader.name;

    if (move > 1.2) {
      out.push({ tone: 'good', text: pick(rng, [
        def.ru + ' идут вверх: плюс ' + move.toFixed(1) + ' пункта за неделю',
        'Штабы соперников пересчитывают округа: ' + def.ru.toLowerCase() + ' прибавляют',
        leader + ': «Мы только разогреваемся»'
      ]) });
    } else if (move < -1.2) {
      out.push({ tone: 'bad', text: pick(rng, [
        'Тревога в штабе: ' + def.ru.toLowerCase() + ' теряют ' + Math.abs(move).toFixed(1) + ' пункта',
        'Кто виноват в провальной неделе ' + leader + '?',
        'Источники в партии: «Так дальше нельзя»'
      ]) });
    }

    if ((me.scandal || 0) > 18) {
      out.push({ tone: 'bad', text: pick(rng, [
        leader + ': вопросы, на которые нет ответов',
        'Что ещё мы не знаем о партийной кассе?',
        'Пресс-служба ушла в глухую оборону'
      ]) });
    }
    if (me.unity < 52) {
      out.push({ tone: 'bad', text: pick(rng, [
        'Заднескамеечники точат ножи',
        'Фракция ' + def.ru.toLowerCase() + ' на грани открытого бунта',

      ]) });

      out.push({ tone: 'good', text: pick(rng, [
        leader + ' — самый популярный политик недели',
        'Залы полны: турне ' + leader + ' собирает очереди',
        'Даже оппоненты признают: у ' + leader + ' хорошая неделя'
      ]) });
    }

    var topIssue = PP.ISSUE_IDS.slice().sort(function (a, b) { return state.salience[b] - state.salience[a]; })[0];
    out.push({ tone: 'neutral', text: pick(rng, [

      'Опрос: избирателей больше всего волнует ' + PP.ISSUE_BY_ID[topIssue].name.toLowerCase(),
      'Студии спорят до полуночи: ' + PP.ISSUE_BY_ID[topIssue].name.toLowerCase() + ' и ничего больше'
    ]) });

    out.push({ tone: 'neutral', text: pick(rng, [
      'Дождь над Манчестером, но зал всё равно полон',
      'Автобус кампании застрял на M6 — виноваты дорожные работы',
      'В пабах спорят о выборах и о судействе в субботнем матче',
      'Букмекеры принимают ставки на подвешенный парламент',
      'В Вестминстере считают дни до роспуска предвыборных штабов',

    if (i >= 0) PP.PARTIES[i] = def; else PP.PARTIES.push(def);

  function buildBases(def) {

    PP.CAMPAIGN_REGIONS.forEach(function (region) {
      var base = {};

        var inScope = def.scope === 'gb'
          || (def.scope === 'scotland' && region.id === 'scotland')
          || (def.scope === 'wales' && region.id === 'wales');
        if (inScope) {
          /* Насколько регион вообще подходит партии: демография против её ядра. */
          var fit = 1;

          ['age', 'degree', 'leave', 'urban', 'prosperity'].forEach(function (a) {
            fit += (aff[a] || 0) * ((region.demo[a] - 50) / 100);
          });
          var want = clamp(def.baseShare * clamp(fit, 0.35, 1.9), 0.8, 40);
          var weights = {}, wsum = 0;
          Object.keys(base).forEach(function (pid) {
            var dist = PP.ideologyDistance(def.id, pid);
            var w = base[pid] * Math.exp(-dist / 38);
            weights[pid] = w;
            wsum += w;
          });
          if (wsum > 0) {
            Object.keys(base).forEach(function (pid) {
              base[pid] = Math.max(base[pid] - want * (weights[pid] / wsum), 0.4);
            });
          }
          base[def.id] = want;
        }
      }
      var total = 0;
      Object.keys(base).forEach(function (pid) { total += base[pid]; });
      Object.keys(base).forEach(function (pid) { base[pid] = base[pid] / total * 100; });
      bases[region.id] = base;
    });

<script>
/* src/core/seats.js */
/*
 * Процедурная генерация 650 округов и расчёт результата в отдельном округе.
 * Профиль округа — отклонение от средней демографии региона, поэтому в сумме
 * округа воспроизводят региональные доли, а разброс даёт эффект мажоритарной
 * системы: партия с ровным по стране результатом мест почти не получает.
 */
(function (root) {
  'use strict';

  var PP = root.PP;
  var clamp = PP.clamp;
  var AXES = ['age', 'degree', 'leave', 'urban', 'prosperity'];

  function makeName(rng, region, used) {
    var pool = PP.PLACES[region.id] || ['Округ'];
    for (var attempt = 0; attempt < 40; attempt++) {
      var town = rng.pick(pool);
      var name = town;
      if (used[name] || rng.chance(0.55)) {
        name = town + ' — ' + rng.pick(PP.PLACE_SUFFIXES);
      }
      if (!used[name]) { used[name] = true; return name; }
    }
    var n = town + ' #' + rng.int(2, 99);
    used[n] = true;
    return n;
  }

  function generateSeats(seed) {
    var rng = new PP.Rng('seats:' + seed);
    var seats = [];
    PP.CAMPAIGN_REGIONS.forEach(function (region) {
      var used = {};
      for (var i = 0; i < region.seats; i++) {
        var demo = {};
        /* Урбанизация задаёт округ, остальные оси частично следуют за ней. */
        var urbanDev = rng.normal(0, 24);
        demo.urban = clamp(region.demo.urban + urbanDev, 1, 99);
        demo.degree = clamp(region.demo.degree + 0.35 * urbanDev + rng.normal(0, 13), 1, 99);
        demo.age = clamp(region.demo.age - 0.30 * urbanDev + rng.normal(0, 11), 1, 99);
        demo.leave = clamp(region.demo.leave - 0.55 * (demo.degree - region.demo.degree) + rng.normal(0, 10), 1, 99);
        demo.prosperity = clamp(region.demo.prosperity + 0.20 * (demo.degree - region.demo.degree) + rng.normal(0, 15), 1, 99);

        /* Концентрация: у либдемов и зелёных голоса собраны в отдельных
           округах, у Reform размазаны ровным слоем. Вычитаем sd^2/2, чтобы
           разброс не завышал средний результат партии. */
        var local = {};
        PP.GB_PARTY_IDS.forEach(function (pid) {
          var sd = PP.PARTY_BY_ID[pid].concentration || 0.15;
          local[pid] = rng.normal(-sd * sd / 2, sd);
        });

        seats.push({
          id: region.id + '-' + i,
          name: makeName(rng, region, used),
          region: region.id,
          demo: demo,
          local: local,
          holder: null,
          holderMargin: 0,
          electorate: Math.round(rng.range(62000, 79000))
        });
      }
    });
    return seats;
  }

  /* Множитель партии в округе относительно её же региональной доли. */
  function seatFactor(seat, region, party) {
    var aff = party.affinity, s = 0;
    for (var i = 0; i < AXES.length; i++) {
      var a = AXES[i];
      s += (aff[a] || 0) * ((seat.demo[a] - region.demo[a]) / 50);
    }
    return Math.exp(0.95 * s + (seat.local[party.id] || 0));
  }

  /*
   * Тактическое голосование: часть сторонников безнадёжных здесь партий
   * переходит к тому из двух лидеров, кто им идеологически ближе.
   */
  function applyTactical(shares, intensity) {
    var ids = Object.keys(shares);
    var sorted = ids.slice().sort(function (a, b) { return shares[b] - shares[a]; });
    var first = sorted[0], second = sorted[1];
    if (!second) return shares;
    for (var i = 2; i < sorted.length; i++) {
      var pid = sorted[i];
      if (shares[pid] < 1) continue;
      var dFirst = PP.ideologyDistance(pid, first);
      var dSecond = PP.ideologyDistance(pid, second);
      var pull = (dFirst - dSecond) / 60; /* > 0 — ближе второй */
      var frac = clamp(Math.abs(pull) * intensity, 0, 0.32);
      var moved = shares[pid] * frac;
      shares[pid] -= moved;
      if (pull > 0) shares[second] += moved; else shares[first] += moved;
    }
    return shares;
  }

  /*
   * Итог в округе. regionShares — доли партий в регионе (в процентах).
   * noise = 0 даёт «нотационный» результат без случайности.
   */
  function seatResult(seat, regionShares, opts) {
    opts = opts || {};
    var rng = opts.rng;
    var region = PP.REGION_BY_ID[seat.region];
    var raw = {}, total = 0;
    Object.keys(regionShares).forEach(function (pid) {
      var party = PP.PARTY_BY_ID[pid];
      if (!party || !party.affinity) return;
      var v = regionShares[pid] * seatFactor(seat, region, party);
      if (rng) v *= Math.exp(rng.normal(0, opts.noise === undefined ? 0.10 : opts.noise));
      if (seat.holder === pid) v *= 1 + (opts.incumbency === undefined ? 0.05 : opts.incumbency);
      raw[pid] = Math.max(v, 0.05);
      total += raw[pid];
    });
    Object.keys(raw).forEach(function (pid) { raw[pid] = (raw[pid] / total) * 100; });
    applyTactical(raw, opts.tactical === undefined ? 0.55 : opts.tactical);

    var order = Object.keys(raw).sort(function (a, b) { return raw[b] - raw[a]; });
    return {
      shares: raw,
      winner: order[0],
      runnerUp: order[1],
      margin: raw[order[0]] - raw[order[1]],
      order: order
    };
  }

  /* Назначает «действующих депутатов» по нотационному результату. */
  function assignHolders(seats, regionSharesByRegion) {
    seats.forEach(function (seat) {
      var res = seatResult(seat, regionSharesByRegion[seat.region], { noise: 0, incumbency: 0 });
      seat.holder = res.winner;
      seat.holderMargin = res.margin;
      seat.notional = res.shares;
    });
    return seats;
  }

  PP.generateSeats = generateSeats;
  PP.seatResult = seatResult;
  PP.assignHolders = assignHolders;
  PP.seatFactor = seatFactor;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/* src/core/polling.js */
/*
 * Модель поддержки. Для каждого региона считается «истинная» доля партии,
 * из неё уже собираются публичные опросы (с шумом социологии) и итог выборов.
 */
(function (root) {
  'use strict';

  var PP = root.PP;
  var clamp = PP.clamp;

  var FIT_WEIGHT = 0.55;      /* вклад совпадения позиций с настроением региона */
  var LEADER_WEIGHT = 0.30;   /* вклад рейтинга лидера */
  var UNITY_WEIGHT = 0.12;    /* вклад единства партии */

  function normalisedSalience(salience) {
    var total = 0, out = {};
    PP.ISSUE_IDS.forEach(function (id) { total += Math.max(salience[id] || 0, 0); });
    if (total <= 0) total = 1;
    PP.ISSUE_IDS.forEach(function (id) { out[id] = Math.max(salience[id] || 0, 0) / total; });
    return out;
  }

  /* Насколько партия «попадает» в настроение региона: примерно -1..+1. */
  function issueFit(partyState, prefs, salNorm) {
    var total = 0;
    PP.ISSUE_IDS.forEach(function (id) {
      var pos = partyState.positions[id];
      var align = 1 - Math.abs(pos - prefs[id]) / 200;   /* 0.5..1 */
      var centred = (align - 0.80) * 4;                  /* примерно -1..+0.8 */
      var comp = ((partyState.competence[id] || 40) - 45) / 45;
      total += salNorm[id] * (0.72 * centred + 0.40 * comp);
    });
    return clamp(total, -1.2, 1.2);
  }

  function leaderTerm(partyState) {
    var l = partyState.leader;
    return clamp(l.approval / 100, -0.6, 0.6) * LEADER_WEIGHT
      + ((l.charisma - 50) / 50) * 0.05
      - clamp(partyState.scandal || 0, 0, 60) / 100 * 0.55;
  }

  /* Истинные доли партий в регионе, в процентах, сумма = 100. */
  function regionShares(state, region) {
    var prefs = PP.regionPreferences(region);
    var salNorm = normalisedSalience(state.salience);
    var raw = {}, total = 0;
    /* Стартовые доли берутся из партии игры: своя партия отбирает голоса
       у соперников, и общий расклад региона меняется. */
    var bases = (state.bases && state.bases[region.id]) || region.base;

    Object.keys(bases).forEach(function (pid) {
      var ps = state.parties[pid];
      if (!ps) return;
      var base = bases[pid];
      var mult = 1;
      if (pid !== 'oth') {
        mult += FIT_WEIGHT * issueFit(ps, prefs, salNorm);
        mult += leaderTerm(ps);
        mult += UNITY_WEIGHT * ((ps.unity - 65) / 100);
        mult += clamp(ps.momentum || 0, -12, 12) / 100;
      }
      var push = (state.effort[region.id] && state.effort[region.id][pid]) || 0;
      var value = Math.max(base * Math.max(mult, 0.15) + push, 0.4);
      raw[pid] = value;
      total += value;
    });

    Object.keys(raw).forEach(function (pid) { raw[pid] = (raw[pid] / total) * 100; });
    return raw;
  }

  function allRegionShares(state) {
    var out = {};
    PP.CAMPAIGN_REGIONS.forEach(function (r) { out[r.id] = regionShares(state, r); });
    return out;
  }

  /* Национальная доля (Великобритания без Северной Ирландии), взвешенная по избирателям. */
  function nationalShares(state, byRegion) {
    byRegion = byRegion || allRegionShares(state);
    var totals = {}, weightSum = 0;
    PP.CAMPAIGN_REGIONS.forEach(function (r) {
      var w = r.seats;
      weightSum += w;
      var sh = byRegion[r.id];
      Object.keys(sh).forEach(function (pid) {
        totals[pid] = (totals[pid] || 0) + sh[pid] * w;
      });
    });
    Object.keys(totals).forEach(function (pid) { totals[pid] = totals[pid] / weightSum; });
    return totals;
  }

  /* Публикуемый опрос: истина плюс шум социологической службы. */
  function publishedPoll(state, rng, house) {
    var nat = nationalShares(state);
    var out = {};
    var sum = 0;
    Object.keys(nat).forEach(function (pid) {
      /* Погрешность растёт вместе с размером партии: у мелких она не может
         быть больше их самих. */
      var sd = clamp(0.35 + nat[pid] * 0.045, 0.3, 1.6);
      var v = nat[pid] + rng.normal(0, sd) + (house && house[pid] ? house[pid] : 0);
      out[pid] = Math.max(v, 0.3);
      sum += out[pid];
    });
    Object.keys(out).forEach(function (pid) { out[pid] = Math.round((out[pid] / sum) * 1000) / 10; });
    return out;
  }

  /* Быстрая проекция мест по текущим долям (используется на дашборде). */
  function projectSeats(state, byRegion, opts) {
    opts = opts || {};
    byRegion = byRegion || allRegionShares(state);
    var counts = {};
    state.seats.forEach(function (seat) {
      var res = PP.seatResult(seat, byRegion[seat.region], {
        noise: 0,
        rng: opts.rng,
        incumbency: opts.incumbency
      });
      counts[res.winner] = (counts[res.winner] || 0) + 1;
    });
    /* Северная Ирландия — отдельный блок, места фиксированы до дня выборов. */
    (state.niSeats || []).forEach(function (s) {
      counts[s.party] = (counts[s.party] || 0) + 1;
    });
    return counts;
  }

  PP.regionShares = regionShares;
  PP.allRegionShares = allRegionShares;
  PP.nationalShares = nationalShares;
  PP.publishedPoll = publishedPoll;
  PP.projectSeats = projectSeats;
  PP.normalisedSalience = normalisedSalience;
  PP.issueFit = issueFit;
})(typeof globalThis !== 'undefined' ? globalThis : this);

<script>
/* src/core/state.js */
/* Создание, сохранение и загрузка состояния игры. */
(function (root) {
  'use strict';

  var PP = root.PP;
  var SAVE_KEY = 'pp-uk-save-v1';
  var VERSION = '1.0.0-beta';

  var DIFFICULTY = {
    easy: { label: 'Заднескамеечник', aiSkill: 0.6, fundsMult: 1.35, apBonus: 1 },
    normal: { label: 'Министр теневого кабинета', aiSkill: 1.0, fundsMult: 1.0, apBonus: 0 },
    hard: { label: 'Кандидат в премьеры', aiSkill: 1.35, fundsMult: 0.8, apBonus: 0 }
  };

  function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }

  function makePartyState(def, diff, isPlayer) {
    return {
      id: def.id,
      positions: deepCopy(def.positions),
      corePositions: deepCopy(def.positions),
      competence: deepCopy(def.competence),
      leader: deepCopy(def.leader),
      funds: def.funds * (isPlayer ? diff.fundsMult : 1),
      activists: def.activists,
      unity: def.unity,
      momentum: 0,
      scandal: 0,
      spent: 0,
      broadcastsLeft: 5,
      history: []
    };
  }

  function makeNiSeats(rng) {
    var seats = [];
    var names = ['Белфаст-Север', 'Белфаст-Юг', 'Белфаст-Восток', 'Белфаст-Запад', 'Северный Даун',
      'Южный Даун', 'Ньюри и Арма', 'Фермана и Южный Тирон', 'Средний Ольстер', 'Восточный Лондондерри',
      'Фойл', 'Западный Тирон', 'Ларн и Антрим', 'Северный Антрим', 'Южный Антрим', 'Восточный Антрим',
      'Стрэнгфорд', 'Аппер-Банн'];
    var pool = [];
    PP.NI_PARTIES.forEach(function (p) {
      for (var i = 0; i < p.base; i++) pool.push(p.id);
    });
    while (pool.length < 18) pool.push('apni');
    pool = rng.shuffle(pool).slice(0, 18);
    for (var i = 0; i < 18; i++) {
      seats.push({ id: 'ni-' + i, name: names[i], region: 'n_ireland', party: pool[i] });
    }
    return seats;
  }

  function newGame(opts) {
    opts = opts || {};
    var seed = opts.seed || String(Date.now());
    var diff = DIFFICULTY[opts.difficulty || 'normal'];
    var rng = new PP.Rng('init:' + seed);

    /* Своя партия регистрируется до всего остального: её должны видеть
       генератор округов, модель поддержки и соперники. */
    PP.unregisterCustomParty('own');
    var customDef = null;
    if (opts.custom) {
      customDef = PP.buildCustomParty(opts.custom);
      PP.registerCustomParty(customDef);
    }
    var role = PP.ROLE_BY_ID[opts.role || 'leader'] || PP.ROLE_BY_ID.leader;

    var state = {
      version: VERSION,
      seed: seed,
      difficulty: opts.difficulty || 'normal',
      difficultyLabel: diff.label,
      aiSkill: diff.aiSkill,
      playerId: opts.playerId || 'lab',
      roleId: role.id,
      roleName: role.name,
      customConfig: opts.custom ? JSON.parse(JSON.stringify(opts.custom)) : null,
      week: 1,
      totalWeeks: opts.weeks || 12,
      phase: 'campaign',
      ap: 0,
      apMax: 4 + diff.apBonus + (role.mods.ap || 0),
      stamina: 100,
      parties: {},
      salience: {},
      effort: {},
      news: [],
      pollHistory: [],
      debatesDone: [],
      pendingEvent: null,
      groundGame: {},
      targeted: {},
      turnLog: [],
      result: null,
      government: null,
      achievements: []
    };

    state.bases = PP.buildBases(customDef);

    PP.PARTIES.forEach(function (def) {
      state.parties[def.id] = makePartyState(def, diff, def.id === state.playerId);
    });
    PP.ISSUES.forEach(function (i) { state.salience[i.id] = i.baseSalience; });
    PP.CAMPAIGN_REGIONS.forEach(function (r) {
      state.effort[r.id] = {};
      Object.keys(state.bases[r.id]).forEach(function (pid) { state.effort[r.id][pid] = 0; });
    });

    /* Бонусы роли получает только партия игрока. */
    var me = state.parties[state.playerId];
    if (me && role.start) {
      if (role.start.funds) me.funds *= role.start.funds;
      if (role.start.unity) me.unity = PP.clamp(me.unity + role.start.unity, 5, 100);
      if (role.start.approval) me.leader.approval = PP.clamp(me.leader.approval + role.start.approval, -80, 80);
    }

    state.seats = PP.generateSeats(seed);
    state.niSeats = makeNiSeats(rng);
    state.ap = state.apMax;

    /* Нотационный расклад «прошлых выборов» — от него считаются приросты. */
    var byRegion = PP.allRegionShares(state);
    PP.assignHolders(state.seats, byRegion);
    state.startingSeats = PP.projectSeats(state, byRegion, { incumbency: 0 });
    state.startingNational = PP.nationalShares(state, byRegion);

    var poll = PP.publishedPoll(state, new PP.Rng('poll:' + seed + ':0'));
    state.pollHistory.push({ week: 0, shares: poll });

    addNews(state, 'Парламент распущен. До дня голосования — ' + state.totalWeeks + ' недель.', 'system');
    addNews(state, 'Вы — ' + role.name.toLowerCase() + ' партии ' + PP.PARTY_BY_ID[state.playerId].ru + '.', 'system');
    return state;
  }

  function addNews(state, text, kind, partyId) {
    state.news.unshift({ week: state.week, text: text, kind: kind || 'news', party: partyId || null });
    if (state.news.length > 120) state.news.pop();
  }

  function save(state) {
    try {
      root.localStorage.setItem(SAVE_KEY, JSON.stringify(state));
      return true;
    } catch (e) {
      return false;
    }
  }

  function load() {
    try {
      var raw = root.localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      var s = JSON.parse(raw);
      if (!s || s.version !== VERSION) return null;
      /* Своя партия живёт в сохранении конфигурацией — пересобираем её. */
      PP.unregisterCustomParty('own');
      if (s.customConfig) PP.registerCustomParty(PP.buildCustomParty(s.customConfig));
      return s;
    } catch (e) {
      return null;
    }
  }

  function clearSave() {
    try { root.localStorage.removeItem(SAVE_KEY); } catch (e) { /* нет хранилища — не беда */ }
  }

  function hasSave() {
    try { return !!root.localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
  }

  PP.VERSION = VERSION;
  PP.DIFFICULTY = DIFFICULTY;
  PP.newGame = newGame;
  PP.addNews = addNews;
  PP.saveGame = save;
  PP.loadGame = load;
  PP.clearSave = clearSave;
  PP.hasSave = hasSave;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/* src/core/actions.js */
/*
 * Действия кампании. Каждое действие тратит очко расписания (AP), иногда
 * деньги и силы лидера, и меняет состояние. Эффекты в регионах копятся в
 * state.effort и еженедельно затухают — кампанию нужно поддерживать.
 */
(function (root) {
  'use strict';

  var PP = root.PP;
  var clamp = PP.clamp;

  /* Множитель роли игрока: соперникам роли не достаются. */
  function mod(state, params, key) {
    if (!params || params.partyId !== state.playerId) return 1;
    return PP.roleMod(state, key);
  }

  function addEffort(state, regionId, partyId, value) {
    var r = state.effort[regionId];
    if (!r) return;
    r[partyId] = clamp((r[partyId] || 0) + value, -14, 22);
  }

  function baseOf(state, region) {
    return (state.bases && state.bases[region.id]) || region.base;
  }

  function nationalEffort(state, partyId, value) {
    PP.CAMPAIGN_REGIONS.forEach(function (r) {
      if (baseOf(state, r)[partyId] === undefined) return;
      addEffort(state, r.id, partyId, value);
    });
  }

  function partyScope(partyId) {
    return PP.PARTY_BY_ID[partyId].scope;
  }

  /* Регионы, где партия вообще выдвигается: у своей партии список берётся
     из стартовых долей текущей игры. */
  function regionsFor(state, partyId) {
    var scope = partyScope(partyId);
    return PP.CAMPAIGN_REGIONS.filter(function (r) {
      if (scope === 'scotland') return r.id === 'scotland';
      if (scope === 'wales') return r.id === 'wales';
      return baseOf(state, r)[partyId] !== undefined;
    });
  }

  /* Насколько эффективен лидер прямо сейчас: харизма, силы, скандалы. */
  function leaderForm(ps, stamina) {
    var l = ps.leader;
    return clamp(0.6 + (l.charisma - 50) / 120 + (stamina - 60) / 260 - (ps.scandal || 0) / 160, 0.25, 1.6);
  }

  function marginalSeats(state, regionId, partyId, count) {
    var byRegion = state._cacheRegionShares || PP.allRegionShares(state);
    var shares = byRegion[regionId];
    var scored = state.seats.filter(function (s) { return s.region === regionId; }).map(function (seat) {
      var res = PP.seatResult(seat, shares, { noise: 0 });
      var mine = res.shares[partyId] || 0;
      var best = res.shares[res.winner];
      return { seat: seat, gap: res.winner === partyId ? -(best - res.shares[res.runnerUp]) : (best - mine) };
    });
    scored.sort(function (a, b) { return Math.abs(a.gap) - Math.abs(b.gap); });
    return scored.slice(0, count).map(function (x) { return x.seat; });
  }

  var ACTIONS = [
    {
      id: 'rally',
      name: 'Тур по региону',
      icon: '🎤',
      desc: 'Лидер объезжает регион: митинги, заводы, местная пресса. Сильный, но короткий эффект.',
      ap: 1, cost: 0.12, stamina: 14, needs: 'region',
      run: function (state, p, rng) {
        var ps = state.parties[p.partyId];
        var form = leaderForm(ps, state.stamina);
        var gain = 2.1 * form * rng.range(0.8, 1.2) * mod(state, p, 'rally');
        addEffort(state, p.regionId, p.partyId, gain);
        ps.momentum = clamp(ps.momentum + 0.6 * form, -14, 14);
        return {
          text: 'Митинги в регионе «' + PP.REGION_BY_ID[p.regionId].name + '»: +' + gain.toFixed(1) + ' п.п. в местных опросах.',
          delta: gain
        };
      }
    },
    {
      id: 'ground',
      name: 'Работа на земле',
      icon: '🚪',
      desc: 'Обход квартир, листовки, база сторонников. Эффект скромнее, но держится дольше.',
      ap: 1, cost: 0.05, stamina: 3, needs: 'region',
      run: function (state, p, rng) {
        var ps = state.parties[p.partyId];
        var gain = (0.7 + ps.activists / 45) * rng.range(0.85, 1.15) * mod(state, p, 'ground');
        addEffort(state, p.regionId, p.partyId, gain);
        state.groundGame[p.regionId] = state.groundGame[p.regionId] || {};
        state.groundGame[p.regionId][p.partyId] = (state.groundGame[p.regionId][p.partyId] || 0) + 1;
        return {
          text: 'Активисты обошли округа региона «' + PP.REGION_BY_ID[p.regionId].name + '»: +' + gain.toFixed(1) + ' п.п. и лучше явка сторонников.',
          delta: gain
        };
      }
    },
    {
      id: 'target',
      name: 'Кампания в качающихся округах',
      icon: '🎯',
      desc: 'Все силы — в шесть самых близких округов региона. Голоса не растут по региону, но конвертируются в мандаты.',
      ap: 1, cost: 0.10, stamina: 6, needs: 'region',
      run: function (state, p, rng) {
        var seats = marginalSeats(state, p.regionId, p.partyId, 6);
        var bonus = 0.055 * rng.range(0.8, 1.25) * (1 + state.parties[p.partyId].activists / 200) * mod(state, p, 'target');
        seats.forEach(function (s) {
          s.local[p.partyId] = (s.local[p.partyId] || 0) + bonus;
          state.targeted[s.id] = (state.targeted[s.id] || 0) + 1;
        });
        return {
          text: 'Целевая кампания в округах: ' + seats.map(function (s) { return s.name; }).join(', ') + '.',
          delta: 0
        };
      }
    },
    {
      id: 'broadcast',
      name: 'Партийный ролик',
      icon: '📺',
      desc: 'Общенациональный эфир и реклама в сети. Дорого, зато бьёт по всей стране.',
      ap: 1, cost: 0.35, stamina: 2, needs: 'none',
      available: function (state, partyId) { return state.parties[partyId].broadcastsLeft > 0; },
      unavailableText: 'Эфирное время на эту кампанию исчерпано.',
      run: function (state, p, rng) {
        var ps = state.parties[p.partyId];
        ps.broadcastsLeft--;
        var quality = rng.range(0.7, 1.3) * (0.75 + ps.leader.competence / 200);
        var gain = 0.85 * quality * mod(state, p, 'broadcast');
        nationalEffort(state, p.partyId, gain);
        ps.momentum = clamp(ps.momentum + 1.1 * quality, -14, 14);
        return { text: 'Ролик вышел в эфир: +' + gain.toFixed(1) + ' п.п. по всей стране.', delta: gain };
      }
    },
    {
      id: 'media',
      name: 'Большое интервью',
      icon: '🎙️',
      desc: 'Час в прямом эфире. Может поднять рейтинг лидера, а может стоить кампании недели.',
      ap: 1, cost: 0, stamina: 10, needs: 'none',
      run: function (state, p, rng) {
        var ps = state.parties[p.partyId];
        var roll = (rng.normal((ps.leader.charisma + ps.leader.competence) / 2 - 48, 16) + (state.stamina - 60) / 8) * mod(state, p, 'media');
        if (roll > 22) {
          ps.leader.approval = clamp(ps.leader.approval + 5, -80, 80);
          ps.momentum = clamp(ps.momentum + 2.0, -14, 14);
          return { text: 'Интервью разошлось на цитаты. Рейтинг лидера +5.', delta: 5, tone: 'good' };
        }
        if (roll < -18) {
          ps.leader.approval = clamp(ps.leader.approval - 6, -80, 80);
          ps.momentum = clamp(ps.momentum - 2.2, -14, 14);
          return { text: 'Лидер запутался в цифрах в прямом эфире. Рейтинг -6.', delta: -6, tone: 'bad' };
        }
        ps.leader.approval = clamp(ps.leader.approval + 1, -80, 80);
        return { text: 'Ровное интервью без происшествий. Рейтинг +1.', delta: 1, tone: 'neutral' };
      }
    },
    {
      id: 'fundraise',
      name: 'Ужин с донорами',
      icon: '💷',
      desc: 'Деньги на кампанию. Пресса такие вечера не любит.',
      ap: 1, cost: 0, stamina: 6, needs: 'none',
      run: function (state, p, rng) {
        var ps = state.parties[p.partyId];
        var def = PP.PARTY_BY_ID[p.partyId];
        var appeal = (def.family === 'right' ? 1.25 : def.family === 'centre' ? 1.0 : 0.9);
        var raised = rng.range(0.45, 1.15) * appeal * (0.8 + ps.leader.approval / 200 + ps.unity / 200) * mod(state, p, 'fundraise');
        ps.funds += raised;
        var res = { text: 'Собрано £' + raised.toFixed(2) + ' млн.', delta: raised };
        if (rng.chance(0.14 + (60 - ps.leader.integrity) / 260)) {
          ps.scandal = clamp((ps.scandal || 0) + 12, 0, 100);
          res.text += ' Но журналисты уже спрашивают, кто именно платил за вечер.';
          res.tone = 'bad';
        }
        return res;
      }
    },
    {
      id: 'policy',
      name: 'Заявление о политике',
      icon: '📜',
      desc: 'Сдвинуть позицию партии по теме и поднять её значимость в повестке.',
      ap: 1, cost: 0.03, stamina: 5, needs: 'policy',
      run: function (state, p, rng) {
        var ps = state.parties[p.partyId];
        var issue = PP.ISSUE_BY_ID[p.issueId];
        var dir = p.direction > 0 ? 1 : -1;
        var before = ps.positions[p.issueId];
        ps.positions[p.issueId] = clamp(before + dir * 9, -100, 100);
        state.salience[p.issueId] = clamp(state.salience[p.issueId] + 3.5, 1, 45);
        ps.competence[p.issueId] = clamp(ps.competence[p.issueId] + 2, 0, 95);
        var drift = Math.abs(ps.positions[p.issueId] - ps.corePositions[p.issueId]);
        var unityHit = (drift > 25 ? (drift - 25) / 14 : 0) * mod(state, p, 'policyUnity');
        ps.unity = clamp(ps.unity - unityHit, 5, 100);
        var res = {
          text: 'Новая линия по теме «' + issue.name + '»: ' +
            (dir > 0 ? issue.rightLabel : issue.leftLabel) + '.',
          delta: 0
        };
        if (unityHit > 1.5) {

          res.tone = 'bad';
        }
        return res;
      }

    {
      id: 'attack',
      name: 'Негативная кампания',
      icon: '🗡️',
      desc: 'Ударить по конкретному сопернику в конкретном регионе. Иногда прилетает в ответ.',
      ap: 1, cost: 0.15, stamina: 5, needs: 'attack',
      run: function (state, p, rng) {
        var ps = state.parties[p.partyId];
        var target = state.parties[p.targetId];
        var backfire = rng.chance(0.24 - (ps.leader.charisma - 50) / 400);
        if (backfire) {
          addEffort(state, p.regionId, p.partyId, -1.0);
          ps.leader.approval = clamp(ps.leader.approval - 4, -80, 80);
          return {
            text: 'Атака на ' + PP.PARTY_BY_ID[p.targetId].ru + ' выглядела мелочно. Отдача по своим: -1.0 п.п.',
            delta: -1, tone: 'bad'
          };
        }
        var hit = 1.5 * rng.range(0.8, 1.25) * mod(state, p, 'attack');
        addEffort(state, p.regionId, p.targetId, -hit);
        target.leader.approval = clamp(target.leader.approval - 2, -80, 80);
        return {
          text: PP.PARTY_BY_ID[p.targetId].ru + ' теряет ' + hit.toFixed(1) + ' п.п. в регионе «' +
            PP.REGION_BY_ID[p.regionId].name + '».',
          delta: hit, tone: 'good'
        };
      }
    },
    {
      id: 'organise',
      name: 'Набор активистов',
      icon: '🧑‍🤝‍🧑',
      desc: 'Вложиться в сеть отделений. Окупается ближе к дню голосования.',
      ap: 1, cost: 0.08, stamina: 2, needs: 'none',
      run: function (state, p, rng) {
        var ps = state.parties[p.partyId];
        var gain = rng.range(4, 9) * (0.7 + ps.unity / 140) * mod(state, p, 'organise');
        ps.activists = clamp(ps.activists + gain, 0, 100);
        return { text: 'В отделения пришли новые волонтёры: +' + gain.toFixed(0) + ' к сети активистов.', delta: gain };
      }
    },
    {
      id: 'unify',
      name: 'Собрание фракции',
      icon: '🤝',
      desc: 'Успокоить заднескамеечников и погасить утечки в прессу.',
      ap: 1, cost: 0.02, stamina: 6, needs: 'none',
      run: function (state, p, rng) {
        var ps = state.parties[p.partyId];

  var MOMENTUM_DECAY = 0.65;

  function debateWeeks(state) {

  }

  function weeklyIncome(state, partyId, rng) {

    var ps = state.parties[partyId];
    var members = ps.activists / 100;
    var base = (def.family === 'right' ? 0.55 : 0.40) + members * 0.55;
    var mood = 1 + ps.momentum / 30 + ps.leader.approval / 260;
    var income = Math.max(base * mood * rng.range(0.85, 1.15), 0.05);
    if (def.id === 'oth') income = 0.05;

    return income;
  }

  function endWeek(state) {

    var rng = new PP.Rng('week:' + state.seed + ':' + state.week);

    /* 2. Кампания выдыхается: эффект прошлых поездок затухает. */

      var r = state.effort[rid];

      .sort(function (a, b) { return poll[b] - poll[a]; })

<script>
/* src/core/election.js */
/*
 * Ночь выборов: национальная погрешность, результат в каждом из 650 округов,
 * порядок объявления результатов и итоговая арифметика Палаты общин.

(function (root) {
  'use strict';

  var PP = root.PP;
  var clamp = PP.clamp;

  function niResults(state, rng) {
    return state.niSeats.map(function (s) {
      var party = s.party;
      /* Небольшая вероятность перехода округа между блоками. */
      if (rng.chance(0.10)) {
        var pool = PP.NI_PARTIES.filter(function (p) { return p.id !== party; });
        party = rng.pick(pool).id;
      }
      return {
        seatId: s.id, name: s.name, region: 'n_ireland',
        winner: party, previous: s.party, shares: null, margin: rng.range(2, 20),
        time: rng.range(1.5, 8), ni: true

  }

  /* Время объявления: города считают быстро, сельские округа — до утра. */
  function declarationTime(seat, rng) {
    var urbanFactor = (100 - seat.demo.urban) / 100;
    return clamp(1.0 + urbanFactor * 5.8 + rng.range(0, 2.8), 0.7, 9);
  }

  function runElection(state) {
    var rng = new PP.Rng('election:' + state.seed);
    var byRegion = PP.allRegionShares(state);

    /* Системная ошибка опросов: одинаковая по стране для каждой партии. */
    var nationalError = {};
    PP.GB_PARTY_IDS.forEach(function (pid) { nationalError[pid] = rng.normal(0, 1.5); });

    var adjusted = {};
    PP.CAMPAIGN_REGIONS.forEach(function (r) {
      var sh = byRegion[r.id], out = {}, total = 0;
      Object.keys(sh).forEach(function (pid) {
        var v = sh[pid] * (1 + (nationalError[pid] || 0) / 25) + rng.normal(0, 0.8);
        out[pid] = Math.max(v, 0.3);
        total += out[pid];
      });
      Object.keys(out).forEach(function (pid) { out[pid] = out[pid] / total * 100; });
      adjusted[r.id] = out;
    });

    var results = [], votes = {}, totalVotes = 0;
    state.seats.forEach(function (seat) {
      var ground = (state.groundGame[seat.region] && state.groundGame[seat.region]) || {};
      var res = PP.seatResult(seat, adjusted[seat.region], { rng: rng, noise: 0.085 });
      var turnout = clamp(rng.normal(0.62, 0.05) + (state.targeted[seat.id] ? 0.02 : 0), 0.4, 0.85);
      var cast = Math.round(seat.electorate * turnout);
      Object.keys(res.shares).forEach(function (pid) {
        var v = Math.round(cast * res.shares[pid] / 100);
        votes[pid] = (votes[pid] || 0) + v;
        totalVotes += v;
      });
      results.push({
        seatId: seat.id, name: seat.name, region: seat.region,
        winner: res.winner, runnerUp: res.runnerUp, previous: seat.holder,
        shares: res.shares, margin: res.margin, votes: cast,
        turnout: turnout, time: declarationTime(seat, rng),
        ground: ground

    results = results.concat(niResults(state, rng));
    results.sort(function (a, b) { return a.time - b.time; });

    var seatCounts = {};
    results.forEach(function (r) { seatCounts[r.winner] = (seatCounts[r.winner] || 0) + 1; });

    var voteShares = {};
    Object.keys(votes).forEach(function (pid) { voteShares[pid] = votes[pid] / totalVotes * 100; });

    };

  function countChanges(results) {

    results.forEach(function (r) {

      gains[r.winner].gained++;
      gains[r.winner].from[r.previous] = (gains[r.winner].from[r.previous] || 0) + 1;
      gains[r.previous] = gains[r.previous] || { gained: 0, from: {}, lost: 0 };

   * Порог большинства с поправкой на «Шинн Фейн»: их депутаты не занимают

<script>
/* src/core/coalition.js */
/*
 * Подвешенный парламент: переговоры о правительстве. Партнёр соглашается,
 * если он идеологически близок, если союз даёт большинство и если ему
 * достаётся достаточно за участие.
 */
(function (root) {
  'use strict';

  var PP = root.PP;
  var clamp = PP.clamp;

  var NEGOTIABLE = ['lab', 'con', 'ld', 'ref', 'grn', 'snp', 'pc', 'dup', 'uup', 'apni', 'sdlp', 'tuv'];

  function seatsOf(result, pid) { return result.seats[pid] || 0; }

  /* Готовность партии войти в правительство лидера: 0..100. */
  function willingness(state, result, leaderId, partnerId, offer) {
    if (partnerId === leaderId) return 100;
    var dist = PP.ideologyDistance(leaderId, partnerId);
    if (!PP.PARTY_BY_ID[partnerId].positions) dist = 55; /* партии Северной Ирландии */
    var score = 100 - dist * 1.35;
    var lead = seatsOf(result, leaderId), mine = seatsOf(result, partnerId);
    if (mine > lead) score -= 40;                       /* младшим партнёром идти не хотят */
    score += clamp((lead - mine) / 12, 0, 12);
    score += (offer && offer.cabinet ? 14 : 0);
    score += (offer && offer.referendum && (partnerId === 'snp' || partnerId === 'pc') ? 25 : 0);
    score += (offer && offer.pr ? (partnerId === 'ld' || partnerId === 'grn' || partnerId === 'ref' ? 18 : 0) : 0);
    score -= (offer && offer.pr ? (partnerId === 'lab' || partnerId === 'con' ? 8 : 0) : 0);
    if (state.parties[partnerId]) score += (state.parties[partnerId].leader.approval) / 12;
    return clamp(score, 0, 100);
  }

  function options(state, result, leaderId, offer) {
    return NEGOTIABLE.filter(function (pid) {
      return pid !== leaderId && seatsOf(result, pid) > 0 && pid !== 'sf';
    }).map(function (pid) {
      return {
        id: pid,
        seats: seatsOf(result, pid),
        willing: willingness(state, result, leaderId, pid, offer),
        distance: PP.ideologyDistance(leaderId, pid)
      };
    }).sort(function (a, b) { return b.willing - a.willing; });
  }

  /* Итог переговоров: кто формирует правительство и какого типа. */
  function formGovernment(state, result, leaderId, partnerIds, offer) {
    var threshold = result.majority.effective;
    var total = seatsOf(result, leaderId);
    var accepted = [], refused = [];
    (partnerIds || []).forEach(function (pid) {
      var w = willingness(state, result, leaderId, pid, offer);
      var need = offer && offer.confidence ? 42 : 55;
      if (w >= need) { accepted.push(pid); total += seatsOf(result, pid); }
      else refused.push({ id: pid, willing: w });

    else if (total >= threshold) kind = offer && offer.confidence ? 'confidence' : 'coalition';

  /* Кто вообще может собрать большинство — для оценки положения игрока. */
  function viableCoalitions(state, result) {
    var out = [];
    ['lab', 'con'].concat(NEGOTIABLE).filter(function (v, i, a) { return a.indexOf(v) === i; })
      .forEach(function (leaderId) {
        if (seatsOf(result, leaderId) < 40) return;
        var opts = options(state, result, leaderId, { cabinet: true });

        for (var i = 0; i < opts.length && total < result.majority.effective; i++) {

<script>
/* src/ui/chamber.js */
/*
 * Диаграмма Палаты общин: 650 мандатов точками, правительственные скамьи
 * напротив оппозиционных, спикер и неголосующие депутаты отдельно.
 * Плюс собственная эмблема игры в духе решётки Вестминстера.

(function (root) {
  'use strict';

  var PP = root.PP;

  function esc(s) {

  function color(pid) { var p = PP.PARTY_BY_ID[pid]; return p ? p.color : '#8d8d8d'; }
  function pname(pid) { var p = PP.PARTY_BY_ID[pid]; return p ? p.ru : pid; }
  function abbr(pid) { var p = PP.PARTY_BY_ID[pid]; return p ? p.abbr : pid; }

  /* Раскладка блока скамей: точки строками, слева направо, снизу вверх. */

    var i = 0;

        var col = Math.floor(i / rows);

<script>
/* src/ui/map.js */
/* Карта регионов: заливка по текущему раскладу, клик — детали региона. */
(function (root) {
  'use strict';

  var PP = root.PP;
  var clamp = PP.clamp;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
    });
  }
  function color(pid) { var p = PP.PARTY_BY_ID[pid]; return p ? p.color : '#8d8d8d'; }
  function abbr(pid) { var p = PP.PARTY_BY_ID[pid]; return p ? p.abbr : pid; }
  function pname(pid) { var p = PP.PARTY_BY_ID[pid]; return p ? p.ru : pid; }

  var MODES = [
    { id: 'leader', label: 'Кто ведёт' },
    { id: 'mine', label: 'Ваша доля' },
    { id: 'swing', label: 'Изменение к старту' }
  ];

  function hexToRgb(hex) {
    var h = hex.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  function mix(hex, t) {
    var c = hexToRgb(hex);
    var bg = [22, 30, 42];
    return 'rgb(' + c.map(function (v, i) { return Math.round(bg[i] + (v - bg[i]) * t); }).join(',') + ')';
  }

  /* Цвет и подпись региона в выбранном режиме. */
  function regionPaint(state, region, shares, mode) {
    var sh = shares[region.id];
    if (!sh) return { fill: '#2a3646', text: '', title: 'Северная Ирландия: отдельная партийная система' };
    var order = Object.keys(sh).sort(function (a, b) { return sh[b] - sh[a]; });
    var lead = order[0], second = order[1];
    if (mode === 'mine') {
      var mine = sh[state.playerId];
      if (mine === undefined) return { fill: '#2a3646', text: '—', title: region.name + ': вы здесь не выдвигаетесь' };
      return {
        fill: mix(color(state.playerId), clamp(mine / 45, 0.12, 1)),
        text: mine.toFixed(0) + '%',
        title: region.name + ': ваша доля ' + mine.toFixed(1) + '%'
      };
    }
    if (mode === 'swing') {
      var base = (state.bases && state.bases[region.id]) || region.base;
      var mineNow = sh[state.playerId], mineWas = base[state.playerId];
      if (mineNow === undefined) return { fill: '#2a3646', text: '—', title: region.name };
      var d = mineNow - mineWas;
      return {
        fill: mix(d >= 0 ? '#3fb950' : '#f85149', clamp(Math.abs(d) / 8, 0.12, 1)),
        text: (d >= 0 ? '+' : '') + d.toFixed(1),
        title: region.name + ': ' + (d >= 0 ? '+' : '') + d.toFixed(1) + ' п.п. к старту'
      };
    }
    return {
      fill: mix(color(lead), clamp(0.35 + (sh[lead] - sh[second]) / 30, 0.35, 1)),
      text: abbr(lead),
      title: region.name + ': ' + pname(lead) + ' ' + sh[lead].toFixed(1) + '% (отрыв ' + (sh[lead] - sh[second]).toFixed(1) + ')'
    };
  }

  function render(state, shares, opts) {
    opts = opts || {};
    var mode = opts.mode || 'leader';
    var selected = opts.selected;

    var shapes = Object.keys(PP.MAP_SHAPES).map(function (rid) {
      var region = PP.REGION_BY_ID[rid];
      var shape = PP.MAP_SHAPES[rid];
      var paint = regionPaint(state, region, shares, mode);
      var cls = 'map-region' + (selected === rid ? ' selected' : '') + (region.ni ? ' inactive' : '');
      return '<g class="' + cls + '" data-region="' + rid + '">' +
        '<polygon points="' + shape.points + '" fill="' + paint.fill + '">' +
        '<title>' + esc(paint.title) + ' · ' + region.seats + ' мест</title></polygon>' +
        '<text class="map-label" x="' + shape.label[0] + '" y="' + shape.label[1] + '">' + esc(paint.text) + '</text>' +
        '<text class="map-seats" x="' + shape.label[0] + '" y="' + (shape.label[1] + 12) + '">' + region.seats + '</text>' +
        '</g>';
    }).join('');

    var islands = PP.MAP_ISLANDS.map(function (i) {
      return '<circle cx="' + i.cx + '" cy="' + i.cy + '" r="' + i.r + '" fill="#33415a"/>';
    }).join('');

    var modes = MODES.map(function (m) {
      return '<button class="chip' + (mode === m.id ? ' active' : '') + '" data-mapmode="' + m.id + '">' + m.label + '</button>';
    }).join('');

    var legend = '';
    if (mode === 'leader') {
      var nat = PP.nationalShares(state, shares);
      legend = Object.keys(nat).filter(function (p) { return nat[p] >= 2; })
        .sort(function (a, b) { return nat[b] - nat[a]; })
        .map(function (pid) {
          return '<span class="ch-leg"><i style="background:' + color(pid) + '"></i>' + abbr(pid) + '</span>';
        }).join('');
    } else if (mode === 'swing') {
      legend = '<span class="ch-leg"><i style="background:#3fb950"></i>рост</span>' +
        '<span class="ch-leg"><i style="background:#f85149"></i>падение</span>';
    } else {
      legend = '<span class="ch-leg"><i style="background:' + color(state.playerId) + '"></i>чем ярче, тем выше ваша доля</span>';
    }

    var rows = PP.CAMPAIGN_REGIONS.map(function (r) {
      var sh = shares[r.id];
      var order = Object.keys(sh).sort(function (a, b) { return sh[b] - sh[a]; });
      var mine = sh[state.playerId];
      return '<tr class="map-row' + (selected === r.id ? ' mine-row' : '') + '" data-region="' + r.id + '">' +
        '<td>' + esc(r.name) + '</td>' +
        '<td><span class="pill" style="background:' + color(order[0]) + '">' + abbr(order[0]) + '</span></td>' +
        '<td class="num">' + (mine === undefined ? '—' : mine.toFixed(1)) + '</td>' +
        '<td class="num">' + r.seats + '</td></tr>';
    }).join('');
    var ni = PP.REGION_BY_ID.n_ireland;

    return '<div class="map-layout">' +
      '<div class="map-wrap">' +
      '<div class="chips map-modes">' + modes + '</div>' +
      '<svg class="uk-map" viewBox="0 0 440 500" preserveAspectRatio="xMidYMid meet">' +
      '<rect class="map-sea" x="0" y="0" width="440" height="500" rx="10"/>' +
      '<polygon class="map-outside" points="' + PP.MAP_IRELAND + '"><title>Ирландия — за пределами выборов</title></polygon>' +
      islands + shapes +
      '<line x1="340" y1="366" x2="386" y2="348" class="map-leader-line"/>' +
      '<text class="map-callout" x="390" y="346">Лондон · ' + PP.REGION_BY_ID.london.seats + '</text>' +
      '<line x1="78" y1="180" x2="66" y2="150" class="map-leader-line"/>' +
      '<text class="map-callout" x="66" y="144" text-anchor="middle">Сев. Ирландия · ' + ni.seats + '</text>' +
      '</svg>' +
      '<div class="ch-legend">' + legend + '</div>' +
      '</div>' +
      '<div class="map-side"><table class="map-table"><thead><tr>' +
      '<th>Регион</th><th>Ведёт</th><th class="num">Вы</th><th class="num">Мест</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '</div>';
  }

  PP.Map = { render: render, MODES: MODES };
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
